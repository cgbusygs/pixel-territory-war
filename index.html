      const bulletRatio=getMachineBulletPowerRatio(machineFirepowerPool[faction]);
      log(`${FACTIONS[faction].name}获得机枪火力 ${formatMachineFirepower(totalFirepower)}，当前剩余机枪火力为 ${formatMachineFirepower(machineFirepowerPool[faction])}；每发消耗 1 火力，当前每发携带 ${(bulletRatio*100).toFixed(1)}% 火力`,faction);
      return;
    }

    if(weapon==='scatter'){
      // 领地占领成本每 3 分钟递增；限制霰弹分裂数量，保证每枚有效弹丸
      // 至少携带当前一个方格所需的火力，避免中后期全部变成 1 火力而无法染色。
      const captureCost=getTerritoryCaptureFirepower();
      const maxCapturingPellets=Math.max(1,Math.floor(totalFirepower/captureCost));
      const requested=Math.min(48,maxCapturingPellets,16+Math.round(totalVisualPower*2.2));
      const allocations=distributeIntegerFirepower(totalFirepower,requested);
      for(let i=0;i<allocations.length;i++){
        queueProjectile(i*.008,{
          kind:'scatter',faction,
          angle:angle+(Math.random()-.5)*0.52,
          firepower:allocations[i]
        });
      }
      log(`${FACTIONS[faction].name}结算霰弹总火力 ${formatNum(totalFirepower)}，整数分配给 ${allocations.length} 枚持续弹丸`,faction);
      return;
    }

    if(weapon==='orb'){
      queueProjectile(0,{kind:'orb',faction,angle,firepower:totalFirepower});
      log(`${FACTIONS[faction].name}结算大球火力 ${formatNum(totalFirepower)}，整批装入一枚持续弹丸`,faction);
      return;
    }

    if(weapon==='sniper'){
      queueSniperTargeting(faction,totalFirepower);
      log(`${FACTIONS[faction].name}结算狙击火力 ${formatNum(totalFirepower)}，开始单枚弹道预瞄`,faction);
    }
  }

  function settleEliminatedFactionResources(faction,pendingMachineFirepower,pendingBallValues){
    let orbCount=0,totalFirepower=0;
    const spawnRandomOrb=(firepower)=>{
      const amount=Math.max(0,Math.floor(firepower));
      if(amount<=0)return;
      // 淘汰结算发生在阵营标记前，直接生成已发射的大球，方向完全随机且不经过 fireQueue。
      const data={kind:'orb',faction,angle:Math.random()*TAU,firepower:amount,allowEliminated:true};
      if(!spawnProjectile(data)){
        fireQueue.push({time:0,data});
        log(`${FACTIONS[faction].name}淘汰结算大球等待 GPU 生成队列容量：${formatNum(amount)}`,faction);
      }
      orbCount++;totalFirepower+=amount;
    };
    spawnRandomOrb(pendingMachineFirepower);
    for(const value of pendingBallValues)spawnRandomOrb(value);
    return {orbCount,totalFirepower};
  }

  function spawnProjectile(d){
    if(eliminated[d.faction]&&!d.allowEliminated)return false;
    let sx,sy,tx,ty,dx,dy;
    const firepower=Math.max(0,Math.floor(d.firepower||0));
    if(firepower<=0)return false;
    const power=firepowerToVisualPower(firepower);
    if(d.angle!==undefined){
      const muzzle=getCannonMuzzle(d.faction,d.angle);
      sx=muzzle.x;sy=muzzle.y;dx=Math.cos(d.angle);dy=Math.sin(d.angle);
      tx=sx+dx*WV.w*1.6;ty=sy+dy*WV.h*1.6;
    }else{
      sx=d.start[0]*WV.w;sy=d.start[1]*WV.h;tx=d.target[0]*WV.w;ty=d.target[1]*WV.h;
      dx=tx-sx;dy=ty-sy;
    }

    const len=Math.max(1,Math.hypot(dx,dy));
    const sp=d.speed ?? (d.kind==='orb'?135:d.kind==='machine'?MACHINE_BASE_SPEED:d.kind==='sniper'?SNIPER_PROJECTILE_SPEED:315);
    if(gpuBattleActive&&gpuBattle?.ready){
      const visualSeed=d.visualSeed??machineShotIndex[d.faction]??0;
      const radius=d.kind==='orb'?orbDiameterFromFirepower(firepower)*.5:d.kind==='machine'?2.2*MACHINE_CONTACT_SCALE:d.kind==='sniper'?SNIPER_PROJECTILE_DIAMETER*.5:2.7;
      const id=nextProjectileId;
      const queued=gpuBattle.queueSpawn({x:sx,y:sy,vx:dx/len*sp,vy:dy/len*sp,faction:d.faction,kind:gpuKindFromName(d.kind),id,visualSeed,radius,nominalSpeed:sp,firepower,allowEliminated:Boolean(d.allowEliminated),jitterA:(visualSeed*.61803398875+d.faction*1.73)%TAU,jitterB:(visualSeed*.271828+d.faction*2.41+1.2)%TAU});
      if(!queued)return false;nextProjectileId++;return true;
    }
    const p=projectilePool.pop()||{};
    p.x=sx;p.y=sy;p.prevX=sx;p.prevY=sy;p.paintX=sx;p.paintY=sy;
    p.vx=dx/len*sp;p.vy=dy/len*sp;
    p.targetX=tx;p.targetY=ty;p.faction=d.faction;p.kind=d.kind;
    p.collisionKind=d.kind==='orb'?PROJECTILE_COLLISION_KIND.ORB:d.kind==='machine'?PROJECTILE_COLLISION_KIND.MACHINE:PROJECTILE_COLLISION_KIND.OTHER;
    p.power=power;p.initialFirepower=firepower;p.firepower=firepower;
    p.rounds=d.rounds||firepower;p.visualPellets=d.kind==='machine'?1:(d.visualPellets||1);p.visualSeed=d.visualSeed??machineShotIndex[d.faction]??0;
    // 大球使用当前剩余火力计算动态半径；其他弹丸保持既有尺寸。
    p.r=d.kind==='orb'?orbDiameterFromFirepower(firepower)*.5:d.kind==='machine'?2.2*MACHINE_CONTACT_SCALE:d.kind==='sniper'?SNIPER_PROJECTILE_DIAMETER*.5:2.7;
    p.nominalSpeed=sp;
    p.jitterPhase=(p.visualSeed*.61803398875+d.faction*1.73)%TAU;
    p.jitterPhaseB=(p.visualSeed*.271828+d.faction*2.41+1.2)%TAU;
    p.jitterHeading=0;
    p.id=nextProjectileId++;p.dead=false;p.bounces=0;
    p.orbShieldContacts=0;
    p.absorbFlashAt=-10;p.absorbAngle=0;p.absorbStrength=0;
    projectiles.push(p);if(projectiles.length>perfCounters.projectilePeakCount)perfCounters.projectilePeakCount=gpuBattleActive?gpuActiveProjectileEstimate:projectiles.length;return true;
  }

  function injectPerfStressBatch(){
    if(!PERF_DEBUG_ACTIVE||!gpuBattleActive||!gpuBattle?.ready||(!perfStressState.smallRemaining&&!perfStressState.orbsRemaining))return;
    const pumpNow=performance.now();
    if(PERF_STRESS_CONFIG.intervalMs>0&&perfStressState.lastPumpAt>0&&pumpNow-perfStressState.lastPumpAt<PERF_STRESS_CONFIG.intervalMs)return;
    perfStressState.lastPumpAt=pumpNow;
    let capacity=Math.min(PERF_STRESS_CONFIG.batch,GPU_BATTLE_MAX_SPAWNS-gpuBattle.pendingSpawns.length);
    while(capacity>0&&(perfStressState.orbsRemaining>0||perfStressState.smallRemaining>0)){
      const isOrb=perfStressState.orbsRemaining>0,index=isOrb?perfStressState.orbsQueued:perfStressState.smallQueued;
      const u=(index*.61803398875)%1,v=(index*.75487766625)%1,cluster=PERF_STRESS_CONFIG.cluster&&isOrb;
      const x=cluster?500+(u-.5)*32:45+u*910,y=cluster?500+(v-.5)*32:45+v*910,angle=(index*.38196601125%1)*TAU,speed=isOrb?18:42;
      // Perf-only scatter rounds stay alive around friendly Orbs; machine rounds are
      // intentionally absorbed by them and would make the Orb broadphase sample unstable.
      const firepower=isOrb?PERF_STRESS_CONFIG.orbFirepower:1e9,radius=isOrb?orbDiameterFromFirepower(firepower)*.5:2.7,visualSeed=(index+1)*17;
      const queued=gpuBattle.queueSpawn({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,faction:0,kind:isOrb?gpuKindFromName('orb'):gpuKindFromName('scatter'),id:nextProjectileId,visualSeed,radius,nominalSpeed:speed,firepower,jitterA:(visualSeed*.61803398875)%TAU,jitterB:(visualSeed*.271828+1.2)%TAU});
      if(!queued)break;
      nextProjectileId++;
      if(isOrb){perfStressState.orbsRemaining--;perfStressState.orbsQueued++;}else{perfStressState.smallRemaining--;perfStressState.smallQueued++;}
      capacity--;
    }
    document.documentElement.dataset.gpuBattleStress=JSON.stringify({...PERF_STRESS_CONFIG,...perfStressState});
  }

  let perfGpuSelfTestsStarted=false;
  function runPerfGpuSelfTests(){
    if(!PERF_DEBUG_ACTIVE||perfGpuSelfTestsStarted||!gpuBattleActive||!gpuBattle?.ready)return;perfGpuSelfTestsStarted=true;
    if(PERF_STRESS_CONFIG.noWin){for(let faction=0;faction<4;faction++)gpuBattle.queueShieldAdd(faction,9e7);document.documentElement.dataset.gpuLongSession='no-win, shield-stabilized-1e8';}
    if(PERF_STRESS_CONFIG.spawnOverload>0){
      const requested=PERF_STRESS_CONFIG.spawnOverload,startId=nextProjectileId;let accepted=0;
      for(let i=0;i<requested;i++){
        const visualSeed=900000+i,queued=gpuBattle.queueSpawn({x:500,y:500,vx:0,vy:0,faction:0,kind:gpuKindFromName('scatter'),id:startId+i,visualSeed,radius:2.7,nominalSpeed:0,firepower:1e9,jitterA:0,jitterB:0});if(queued)accepted++;
      }
      nextProjectileId+=accepted;const queue=gpuBattle.pendingSpawns;
      document.documentElement.dataset.gpuSpawnOverloadTest=JSON.stringify({requested,accepted,rejected:requested-accepted,queueLength:queue.length,bounded:queue.length<=GPU_BATTLE_MAX_SPAWNS,oldestPreserved:queue[0]?.id===startId,newestAcceptedPreserved:queue[accepted-1]?.id===startId+accepted-1});
    }
    if(PERF_STRESS_CONFIG.forceEliminationRace){
      const faction=3,id=nextProjectileId,visualSeed=990001;
      // Deliberately change only authoritative GPU state. CPU still considers the
      // faction alive while this command is queued, reproducing the readback window.
      gpuBattle.device.queue.writeBuffer(gpuBattle.battleBuffer,(8+faction)*4,new Uint32Array([1]));
      const queued=gpuBattle.queueSpawn({x:500,y:500,vx:0,vy:0,faction,kind:gpuKindFromName('scatter'),id,visualSeed,radius:2.7,nominalSpeed:0,firepower:1e9,jitterA:0,jitterB:0});
      if(queued)nextProjectileId++;
      document.documentElement.dataset.gpuEliminationRaceTest=JSON.stringify({faction,queuedOnCpu:queued,expectedGpuReject:true,id});
    }
    if(PERF_STRESS_CONFIG.forceFatal)setTimeout(()=>{if(gpuBattleActive&&gpuBattle?.ready)gpuBattle.fail(new Error('perf self-test forced fatal'));},1500);
  }

  let perfLargeOrbTestActive=false;
  function applyPerfTerritoryPattern(mode){
    if(!PERF_DEBUG_ACTIVE||!gpuBattleActive||!gpuBattle?.ready)return false;
    const allowed=new Set(['own','enemy','neutral','mixed']);if(!allowed.has(mode))return false;
    // Isolate the painter from normal weapon production. The test Orb uses the
    // explicit settlement-spawn exception below, while every base stays silent.
    perfLargeOrbTestActive=true;fireQueue.length=0;for(let faction=0;faction<4;faction++)eliminated[faction]=faction!==0;
    territoryCounts.fill(0);territoryCapturedTick.fill(Math.max(0,Math.round(simulationElapsed*TERRITORY_COLOR_TICK_HZ)));
    for(let y=0;y<GRID_H;y++)for(let x=0;x<GRID_W;x++){
      const index=y*GRID_W+x;let faction=255;
      if(mode==='own')faction=0;else if(mode==='enemy')faction=1;else if(mode==='mixed'){const tile=((x>>5)+(y>>5))&3;faction=tile===0?0:(tile===1?1:(tile===2?255:2));}
      owner[index]=faction;if(faction<4)territoryCounts[faction]++;
    }
    activeTerritoryColorCells.length=0;territoryColorTracked.fill(0);uploadTerritoryGpuFull(true,true);gpuBattle.resetFromCpu();
    return true;
  }

  function runGpuLargeOrbTest(radius,mode='neutral'){
    if(!applyPerfTerritoryPattern(mode))return {ok:false,reason:'GPU perf mode unavailable'};
    const requestedRadius=Math.max(2.5,Math.min(198.4,Number(radius)||50));
    const denominator=Math.max(1e-9,200/requestedRadius-1);
    const firepower=Math.max(1,Math.min(1e15,Math.pow(63/denominator,1/.26)));
    const actualRadius=orbDiameterFromFirepower(firepower)*.5,visualSeed=980000+Math.round(requestedRadius*10),id=nextProjectileId;
    window.__perfReset?.();delete document.documentElement.dataset.gpuBattleGpuTiming;
    const queued=gpuBattle.queueSpawn({x:500,y:500,vx:0,vy:0,faction:0,kind:gpuKindFromName('orb'),id,visualSeed,radius:actualRadius,nominalSpeed:0,firepower,jitterA:0,jitterB:0,allowEliminated:true});
    if(queued)nextProjectileId++;
    const result={ok:queued,mode,requestedRadius,actualRadius,firepower,id};document.documentElement.dataset.gpuLargeOrbTest=JSON.stringify(result);return result;
  }
  window.__gpuLargeOrbTest=runGpuLargeOrbTest;
  let lastGpuLargeOrbCommand='';
  function consumeGpuLargeOrbCommand(){
    if(!PERF_DEBUG_ACTIVE)return;const raw=document.getElementById('gpuPerfCommand')?.value||document.documentElement.dataset.gpuLargeOrbCommand||'';if(!raw||raw===lastGpuLargeOrbCommand)return;lastGpuLargeOrbCommand=raw;
    try{const command=JSON.parse(raw);runGpuLargeOrbTest(command.radius,command.mode);}catch(error){document.documentElement.dataset.gpuLargeOrbTest=JSON.stringify({ok:false,reason:error?.message||String(error)});}
  }

  function markTerritoryTiles(mask,minX,minY,maxX,maxY){
    minX=Math.max(0,Math.floor(minX));minY=Math.max(0,Math.floor(minY));
    maxX=Math.min(GRID_W-1,Math.ceil(maxX));maxY=Math.min(GRID_H-1,Math.ceil(maxY));
    const tx0=minX>>5,ty0=minY>>5,tx1=maxX>>5,ty1=maxY>>5;let added=0;
    for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){
      const index=ty*TERRITORY_TILE_COLS+tx;
      if(!mask[index]){mask[index]=1;added++;}
    }
    return added;
  }
  function markTerritoryOwnerDirtyRect(minX,minY,maxX,maxY){
    dirtyOwnerTileCount+=markTerritoryTiles(dirtyOwnerTiles,minX,minY,maxX,maxY);
  }
  function markTerritoryTickDirtyRect(minX,minY,maxX,maxY){
    dirtyTickTileCount+=markTerritoryTiles(dirtyTickTiles,minX,minY,maxX,maxY);
  }

  function refreshTerritoryCell(idx,faction,capturedTime=simulationElapsed){
    const refreshToken=(Math.imul(territoryRefreshStepId,4)+faction+1)>>>0;
    if(territoryRefreshStamp[idx]===refreshToken)return false;
    territoryRefreshStamp[idx]=refreshToken;
    territoryCapturedTick[idx]=Math.max(0,Math.round(capturedTime*TERRITORY_COLOR_TICK_HZ));
    if(!territoryGpuActive){
      if(!territoryColorTracked[idx]){territoryColorTracked[idx]=1;activeTerritoryColorCells.push(idx);}
      writeTerritoryAgeColorTick(idx,faction,0);
    }
    return true;
  }

  function getTerritoryCaptureFirepower(elapsed=simulationElapsed){
    return 1+Math.floor(Math.max(0,elapsed)/TERRITORY_CAPTURE_FIREPOWER_INTERVAL);
  }

  function paintTerritoryCell(x,y,faction,refreshOwned=false){
    if(x<0||x>=GRID_W||y<0||y>=GRID_H)return 0;
    const idx=y*GRID_W+x,prev=owner[idx];
    if(prev===faction){
      if(!refreshOwned)return 0;
      const refreshed=refreshTerritoryCell(idx,faction);
      if(territoryGpuActive&&refreshed)markTerritoryTickDirtyRect(x,y,x,y);
      return 2;
    }
    if(prev!==255)territoryCounts[prev]--;
    territoryCounts[faction]++;owner[idx]=faction;refreshTerritoryCell(idx,faction);
    if(territoryGpuActive){markTerritoryOwnerDirtyRect(x,y,x,y);markTerritoryTickDirtyRect(x,y,x,y);}
    return 1;
  }

  const impactMaskResult={mask:null,baseX:0,baseY:0,qr:0};
  const paintPathResult={spent:0,exhausted:false,x:0,y:0};
  function getImpactMask(r,gx,gy,requireRadialOrder=true,out=impactMaskResult){
    const qr=Math.max(.5,Math.round(r*2)/2),baseX=Math.floor(gx),baseY=Math.floor(gy);
    const fxStep=Math.round((gx-baseX)*4),fyStep=Math.round((gy-baseY)*4);
    const fx=fxStep/4,fy=fyStep/4,key=(Math.round(qr*2)*5+fxStep)*5+fyStep;
    let entry=impactMaskCache.get(key);
    if(entry&&(!requireRadialOrder||entry.radial)){
      perfCounters.impactMaskHits++;
      out.mask=entry.mask;out.baseX=baseX;out.baseY=baseY;out.qr=qr;return out;
    }
    perfCounters.impactMaskMisses++;
    const lim=Math.ceil(qr+1),r2=qr*qr;
    let mask;
    if(requireRadialOrder){
      const cells=[];
      for(let dy=-lim;dy<=lim;dy++)for(let dx=-lim;dx<=lim;dx++){
        const rx=dx+.5-fx,ry=dy+.5-fy,d2=rx*rx+ry*ry;
        if(d2<=r2)cells.push({dx,dy,d2});
      }
      // 火力不足时仍严格从弹丸中心向外染色。
      cells.sort((a,b)=>a.d2-b.d2);
      mask=[];for(const c of cells)mask.push(c.dx,c.dy);
    }else{
      // 火力足以覆盖完整接触圆时，遍历顺序不影响最终结果，可直接构建扁平坐标表并跳过对象分配与排序。
      mask=[];
      for(let dy=-lim;dy<=lim;dy++)for(let dx=-lim;dx<=lim;dx++){
        const rx=dx+.5-fx,ry=dy+.5-fy;
        if(rx*rx+ry*ry<=r2)mask.push(dx,dy);
      }
    }
    entry={mask,radial:requireRadialOrder};
    impactMaskCache.set(key,entry);
    while(impactMaskCache.size>IMPACT_MASK_CACHE_MAX){
      const oldest=impactMaskCache.keys().next().value;impactMaskCache.delete(oldest);
    }
    out.mask=mask;out.baseX=baseX;out.baseY=baseY;out.qr=qr;return out;
  }

  function applyImpact(gx,gy,r,faction,budget=Infinity,refreshOwned=false,pathStampId=0){
    budget=Math.max(0,Math.floor(budget));if(budget<=0)return 0;
    const captureFirepower=getTerritoryCaptureFirepower();
    const captureCapacity=Number.isFinite(budget)?Math.floor(budget/captureFirepower):Infinity;
    const qrEstimate=Math.max(.5,Math.round(r*2)/2),limEstimate=Math.ceil(qrEstimate+1);
    const requireRadialOrder=captureCapacity<(limEstimate*2+1)*(limEstimate*2+1);
    const {mask,baseX,baseY,qr}=getImpactMask(r,gx,gy,requireRadialOrder);let changed=0,spent=0,refreshed=false,partialCaptureUsed=false;
    for(let i=0;i<mask.length;i+=2){
      const x=baseX+mask[i],y=baseY+mask[i+1];
      if(x<0||x>=GRID_W||y<0||y>=GRID_H)continue;
      const idx=y*GRID_W+x,previous=owner[idx];
      if(pathStampId){
        if(territoryPathStamp[idx]===pathStampId)continue;
        territoryPathStamp[idx]=pathStampId;
      }
      if(previous===faction){
        if(!refreshOwned)continue;
        if(refreshTerritoryCell(idx,faction))refreshed=true;
        continue;
      }
      const available=budget-spent;
      if(available<=0)break;
      if(available<captureFirepower){
        // 最后一段残余火力也可完成一格占领，但同一次命中只允许兑现一格，避免零成本扩张。
        if(partialCaptureUsed)break;
        partialCaptureUsed=true;
        spent=budget;
      }else{
        spent+=captureFirepower;
      }
      if(previous!==255)territoryCounts[previous]--;
      territoryCounts[faction]++;owner[idx]=faction;refreshTerritoryCell(idx,faction);changed++;
    }
    if(territoryGpuActive){
      if(changed)markTerritoryOwnerDirtyRect(gx-qr-1,gy-qr-1,gx+qr+1,gy+qr+1);
      if(changed||refreshed)markTerritoryTickDirtyRect(gx-qr-1,gy-qr-1,gx+qr+1,gy+qr+1);
    }
    return spent;
  }

  function flushTerritoryGpuTiles(mask,count,kind,force){
    if(!count)return;
    if(force||count>360){
      uploadTerritoryGpuFull(kind==='owner',kind==='tick');
      return;
    }
    for(let ty=0;ty<TERRITORY_TILE_ROWS;ty++){
      let tx=0;
      while(tx<TERRITORY_TILE_COLS){
        while(tx<TERRITORY_TILE_COLS&&!mask[ty*TERRITORY_TILE_COLS+tx])tx++;
        if(tx>=TERRITORY_TILE_COLS)break;
        const runStart=tx;
        while(tx<TERRITORY_TILE_COLS&&mask[ty*TERRITORY_TILE_COLS+tx])tx++;
        const x=runStart*TERRITORY_TILE_SIZE,y=ty*TERRITORY_TILE_SIZE;
        const w=Math.min(GRID_W-x,(tx-runStart)*TERRITORY_TILE_SIZE),h=Math.min(GRID_H-y,TERRITORY_TILE_SIZE);
        if(kind==='owner')uploadTerritoryGpuOwnerRect(x,y,w,h);else uploadTerritoryGpuTickRect(x,y,w,h);
      }
    }
  }

  function flushTerritory(force=false){
    if(territoryGpuActive){
      if(!dirtyOwnerTileCount&&!dirtyTickTileCount)return;
      flushTerritoryGpuTiles(dirtyOwnerTiles,dirtyOwnerTileCount,'owner',force);
      flushTerritoryGpuTiles(dirtyTickTiles,dirtyTickTileCount,'tick',force);
      dirtyOwnerTiles.fill(0);dirtyTickTiles.fill(0);dirtyOwnerTileCount=0;dirtyTickTileCount=0;
      return;
    }
    if(!dirtyTerritoryColorTileCount)return;
    const perfStart=PERF_DEBUG_ACTIVE?performance.now():0;
    // 大面积同时变化时整图上传更便宜；局部变化则按横向连续瓦片分段上传。
    if(force||dirtyTerritoryColorTileCount>360){
      territoryCtx.putImageData(territoryImage,0,0);
      recordTerritoryUpload('color',GRID_W*GRID_H);
    }else{
      for(let ty=0;ty<TERRITORY_TILE_ROWS;ty++){
        let tx=0;
        while(tx<TERRITORY_TILE_COLS){
          while(tx<TERRITORY_TILE_COLS&&!dirtyTerritoryColorTiles[ty*TERRITORY_TILE_COLS+tx])tx++;
          if(tx>=TERRITORY_TILE_COLS)break;
          const runStart=tx;
          while(tx<TERRITORY_TILE_COLS&&dirtyTerritoryColorTiles[ty*TERRITORY_TILE_COLS+tx])tx++;
          const x=runStart*TERRITORY_TILE_SIZE,y=ty*TERRITORY_TILE_SIZE;
          const w=Math.min(GRID_W-x,(tx-runStart)*TERRITORY_TILE_SIZE),h=Math.min(GRID_H-y,TERRITORY_TILE_SIZE);
          territoryCtx.putImageData(territoryImage,0,0,x,y,w,h);
          recordTerritoryUpload('color',w*h);
        }
      }
    }
    dirtyTerritoryColorTiles.fill(0);dirtyTerritoryColorTileCount=0;
    if(PERF_DEBUG_ACTIVE){perfTerritoryUploadMs+=performance.now()-perfStart;perfTerritoryUploadSamples++;}
  }

  function paintProjectilePath(p,x1,y1,x2,y2,out=paintPathResult){
    const perfStart=PERF_DEBUG_ACTIVE?performance.now():0;
    let remaining=Math.max(0,Math.floor(p.firepower));
    if(remaining<=0){
      out.spent=0;out.exhausted=true;out.x=x1;out.y=y1;
      if(PERF_DEBUG_ACTIVE){perfTerritoryPaintMs+=performance.now()-perfStart;perfTerritoryPaintSamples++;}
      return out;
    }
    const initialRadius=projectileTerritoryRadius(p);
    const length=Math.hypot(x2-x1,y2-y1),spacing=Math.max(1.1,Math.min(4.0,initialRadius*.92)),steps=Math.max(1,Math.ceil(length/spacing));
    const refreshOwned=p.kind==='orb'||p.kind==='scatter'||p.kind==='sniper';
    territoryPathStampId=(territoryPathStampId+1)>>>0;
    if(territoryPathStampId===0){territoryPathStamp.fill(0);territoryPathStampId=1;}
    const pathStampId=territoryPathStampId;
    let spentTotal=0,lastX=x1,lastY=y1;
    for(let i=1;i<=steps;i++){
      const t=i/steps,gx=x1+(x2-x1)*t,gy=y1+(y2-y1)*t;
      // 大球每次占领后立刻同步火力与半径，避免用旧尺寸完成整段扫掠。
      const radius=p.kind==='orb'?p.r:initialRadius;
      const spent=applyImpact(gx,gy,radius,p.faction,remaining,refreshOwned,pathStampId);
      remaining-=spent;spentTotal+=spent;lastX=gx;lastY=gy;
      if(p.kind==='orb'&&spent>0)syncProjectileFirepower(p,remaining);
      if(remaining<=0)break;
    }
    if(p.kind!=='orb')syncProjectileFirepower(p,remaining);
    out.spent=spentTotal;out.exhausted=remaining<=0;out.x=lastX;out.y=lastY;
    if(PERF_DEBUG_ACTIVE){perfTerritoryPaintMs+=performance.now()-perfStart;perfTerritoryPaintSamples++;}
    return out;
  }

  function projectileTerritoryRadius(p){
    return p.kind==='machine'?1.65*MACHINE_COLLISION_SCALE*MACHINE_CONTACT_SCALE:p.kind==='orb'?p.r:p.kind==='sniper'?SNIPER_TERRITORY_RADIUS:2.8;
  }

  function territoryOwnerAtPoint(x,y){
    let gx=(x*WAR_TO_GRID_X)|0,gy=(y*WAR_TO_GRID_Y)|0;
    if(gx<0)gx=0;else if(gx>=GRID_W)gx=GRID_W-1;
    if(gy<0)gy=0;else if(gy>=GRID_H)gy=GRID_H-1;
    return owner[gy*GRID_W+gx];
  }

  function projectileTouchesForeignTerritory(p,x=p.x,y=p.y){
    const centerOwner=territoryOwnerAtPoint(x,y);
    if(centerOwner!==255&&centerOwner!==p.faction)return true;
    const speed=Math.hypot(p.vx,p.vy);
    if(speed<1e-6)return false;
    const radius=projectileTerritoryRadius(p),nx=p.vx/speed,ny=p.vy/speed;
    // 检查运动前缘和两侧接触点，避免弹体光效已经压上敌方格子、中心点却仍在己方格内。
    const leadX=x+nx*radius,leadY=y+ny*radius;
    const sideOffset=radius*.72,sideX=-ny*sideOffset,sideY=nx*sideOffset;
    const leadOwner=territoryOwnerAtPoint(leadX,leadY);
    if(leadOwner!==255&&leadOwner!==p.faction)return true;
    const leftOwner=territoryOwnerAtPoint(x+sideX,y+sideY);
    if(leftOwner!==255&&leftOwner!==p.faction)return true;
    const rightOwner=territoryOwnerAtPoint(x-sideX,y-sideY);
    return rightOwner!==255&&rightOwner!==p.faction;
  }

  function paintProjectileBeforePairHit(p,x,y){
    if(p.dead||p.firepower<=0)return true;
    const result=paintProjectilePath(p,p.paintX,p.paintY,x,y);
    p.paintX=result.x;p.paintY=result.y;
    if(!result.exhausted)return false;
    p.x=result.x;p.y=result.y;p.prevX=result.x;p.prevY=result.y;p.dead=true;
    return true;
  }

  function applyLine(x1,y1,x2,y2,faction,firepower){
    let remaining=Math.max(0,Math.floor(firepower));
    const length=Math.hypot(x2-x1,y2-y1),steps=Math.max(1,Math.ceil(length/1.4));
    for(let i=0;i<=steps&&remaining>0;i++){
      const t=i/steps;
      remaining-=applyImpact(x1+(x2-x1)*t,y1+(y2-y1)*t,1.35,faction,remaining);
    }
    return firepower-remaining;
  }

  function fadeTrailLayer(dt){
    trailCtx.save();trailCtx.globalCompositeOperation='destination-out';
    trailCtx.fillStyle=`rgba(0,0,0,${Math.min(.24,1-Math.exp(-dt*5.4))})`;
    trailCtx.fillRect(0,0,trailCanvas.width,trailCanvas.height);trailCtx.restore();
  }

  function pushTrailSegment(p){
    // 狙击弹使用独立的长持续尾迹层；其他弹种仍不写入跨帧残留轨迹。
    if(p.kind==='sniper'){
      sniperTrailSegments.push(p.prevX,p.prevY,p.x,p.y,p.faction,p.id);
      return;
    }
    if(p.kind==='machine'||p.kind==='orb'||p.kind==='scatter')return;
    const kindCode=p.kind==='orb'?1:2;
    frameTrailSegments.push(p.prevX,p.prevY,p.x,p.y,p.faction,kindCode,p.id,0);
  }

  function strokeTrailGroup(faction,kindCode,width,alpha,color){
    const scale=TRAIL_SCALE;let count=0;
    trailCtx.beginPath();
    for(let i=0;i<frameTrailSegments.length;i+=8){
      if(frameTrailSegments[i+4]!==faction||frameTrailSegments[i+5]!==kindCode)continue;
      trailCtx.moveTo(frameTrailSegments[i]*scale,frameTrailSegments[i+1]*scale);
      trailCtx.lineTo(frameTrailSegments[i+2]*scale,frameTrailSegments[i+3]*scale);count++;
    }
    if(count){trailCtx.globalAlpha=alpha;trailCtx.strokeStyle=color;trailCtx.lineWidth=width*scale;trailCtx.stroke();}
  }

  function clearSniperTrailLayers(){
    for(const layer of sniperTrailLayers){layer.ctx.clearRect(0,0,layer.canvas.width,layer.canvas.height);layer.hasContent=false;}
    sniperTrailCtx.clearRect(0,0,sniperTrailCanvas.width,sniperTrailCanvas.height);
    sniperTrailLayerHead=0;sniperTrailLayerElapsed=0;
  }

  function renderSniperTrailHistory(dt){
    const perfStart=PERF_DEBUG_ACTIVE?performance.now():0;
    sniperTrailLayerElapsed+=dt;
    while(sniperTrailLayerElapsed>=SNIPER_TRAIL_LAYER_SECONDS){
      sniperTrailLayerElapsed-=SNIPER_TRAIL_LAYER_SECONDS;
      sniperTrailLayerHead=(sniperTrailLayerHead+1)%SNIPER_TRAIL_LAYER_COUNT;
      const recycled=sniperTrailLayers[sniperTrailLayerHead];recycled.ctx.clearRect(0,0,recycled.canvas.width,recycled.canvas.height);recycled.hasContent=false;
    }
    const active=sniperTrailLayers[sniperTrailLayerHead].ctx,scale=TRAIL_SCALE;
    let acceptedSegments=0;
    if(sniperTrailSegments.length){
      active.save();active.globalCompositeOperation='lighter';
      for(let faction=0;faction<FACTIONS.length;faction++){
        let count=0;active.beginPath();
        for(let i=0;i<sniperTrailSegments.length;i+=6){
          if(sniperTrailSegments[i+4]!==faction)continue;
          const x1=sniperTrailSegments[i],y1=sniperTrailSegments[i+1],x2=sniperTrailSegments[i+2],y2=sniperTrailSegments[i+3];
          if(!Number.isFinite(x1)||!Number.isFinite(y1)||!Number.isFinite(x2)||!Number.isFinite(y2))continue;
          active.moveTo(x1*scale,y1*scale);active.lineTo(x2*scale,y2*scale);count++;
        }
        if(!count)continue;
        const color=FACTIONS[faction].color;acceptedSegments+=count;
        active.globalAlpha=.12;active.strokeStyle=color;active.lineWidth=8*scale;active.stroke();
        active.globalAlpha=.58;active.strokeStyle=mixHexColors(color,'#ffffff',.64);active.lineWidth=2.1*scale;active.stroke();
      }
      active.restore();
    }
    if(acceptedSegments)sniperTrailLayers[sniperTrailLayerHead].hasContent=true;
    sniperTrailSegments.length=0;perfCounters.sniperTrailSegments+=acceptedSegments;

    sniperTrailCtx.clearRect(0,0,sniperTrailCanvas.width,sniperTrailCanvas.height);
    sniperTrailCtx.save();sniperTrailCtx.globalCompositeOperation='lighter';sniperTrailCtx.imageSmoothingEnabled=true;
    for(let ageLayer=SNIPER_TRAIL_LAYER_COUNT-1;ageLayer>=0;ageLayer--){
      const midpoint=SNIPER_TRAIL_LAYER_SECONDS*(ageLayer+.5);
      const index=(sniperTrailLayerHead-ageLayer+SNIPER_TRAIL_LAYER_COUNT)%SNIPER_TRAIL_LAYER_COUNT;
      const layer=sniperTrailLayers[index];if(!layer.hasContent)continue;
      sniperTrailCtx.globalAlpha=Math.pow(Math.max(0,1-midpoint/SNIPER_TRAIL_LIFETIME),1.35);
      sniperTrailCtx.drawImage(layer.canvas,0,0);
    }
    sniperTrailCtx.restore();
    if(PERF_DEBUG_ACTIVE)perfSniperTrailMs+=performance.now()-perfStart;
  }

  function renderTrailBatch(dt){
    const perfStart=PERF_DEBUG_ACTIVE?performance.now():0;
    fadeTrailLayer(dt);trailCtx.save();trailCtx.globalCompositeOperation='lighter';trailCtx.lineCap='round';trailCtx.lineJoin='round';
    for(let f=0;f<4;f++){
      const color=FACTIONS[f].color;
      strokeTrailGroup(f,1,8,.34,color);
      strokeTrailGroup(f,2,2.5,.32,color);
    }
    trailCtx.restore();
    renderSniperTrailHistory(dt);
    combinedTrailCtx.setTransform(1,0,0,1,0,0);combinedTrailCtx.clearRect(0,0,combinedTrailCanvas.width,combinedTrailCanvas.height);
    combinedTrailCtx.save();combinedTrailCtx.globalCompositeOperation='lighter';combinedTrailCtx.globalAlpha=.98;
    combinedTrailCtx.drawImage(sniperTrailCanvas,0,0);combinedTrailCtx.drawImage(trailCanvas,0,0);combinedTrailCtx.restore();
    frameTrailSegments.length=0;
    if(PERF_DEBUG_ACTIVE){perfTrailUpdateMs+=performance.now()-perfStart;perfTrailSamples++;}
  }

  function releaseProjectile(index){
    const p=projectiles[index],last=projectiles.pop();if(index<projectiles.length)projectiles[index]=last;
    p.kind='';p.firepower=0;p.rounds=0;p.dead=false;p.nominalSpeed=0;p.jitterHeading=0;p.orbShieldContacts=0;p.absorbFlashAt=-10;p.absorbStrength=0;projectilePool.push(p);
  }

  function distanceToSegment(px,py,x1,y1,x2,y2){
    const dx=x2-x1, dy=y2-y1;
    const lenSq=dx*dx+dy*dy || 1;
    let t=((px-x1)*dx+(py-y1)*dy)/lenSq;
    t=Math.max(0,Math.min(1,t));
    const x=x1+t*dx, y=y1+t*dy;
    return {dist:Math.hypot(px-x,y-py), t, x, y};
  }

  function getBeamShieldHit(x1,y1,x2,y2,attacker,power){
    let best=null;
    for(let f=0;f<FACTIONS.length;f++){
      if(f===attacker || shieldValue[f]<=0) continue;
      const cx=FACTIONS[f].base[0]*WV.w, cy=FACTIONS[f].base[1]*WV.h;
      const r=shieldRadiusForFaction(f);
      const hit=distanceToSegment(cx,cy,x1,y1,x2,y2);
      if(hit.dist<=r){
        const offset=Math.sqrt(Math.max(0,r*r-hit.dist*hit.dist));
        const totalLen=Math.hypot(x2-x1,y2-y1) || 1;
        const back=offset/totalLen;
        const t=Math.max(0,hit.t-back);
        const ix=x1+(x2-x1)*t, iy=y1+(y2-y1)*t;
        if(!best || t<best.t) best={faction:f,t,x:ix,y:iy};
      }
    }
    return best;
  }

  function currentEffectCap(){
    const n=projectiles.length;
    if(n>1600)return 150;
    if(n>1000)return 240;
    if(n>600)return 360;
    return MAX_EFFECT_PARTICLES;
  }
  function addEffect(effect){
    if(pulses.length>=currentEffectCap())return;
    effect.initialLife=effect.life||1;
    effect.age=0;
    effect.typeId=FX_TYPE_BY_NAME[effect.type]||FX_TYPE.GENERIC;
    effect.fxFlags=(effect.typeId===FX_TYPE.SHIELD_SPARK||effect.typeId===FX_TYPE.ANNIHILATION_SPARK?FX_FLAG_SPARK:0)
      |(effect.typeId>=FX_TYPE.SHIELD_HIT&&effect.typeId<=FX_TYPE.PROJECTILE_HIT?FX_FLAG_EXPANDING:0);
    pulses.push(effect);
  }

  function spawnShieldImpactEffects(faction,x,y,absorbed,incoming,radiusBefore,sourceColor,sourceKind=''){
    const base=getBasePos(faction),angle=Math.atan2(y-base.y,x-base.x);
    const strength=Math.max(1,Math.log2(absorbed+1));
    const machineInvolved=sourceKind==='machine',fxScale=machineInvolved ? .52 : 1;
    // 机枪命中护盾时降低局部弧光、火花数量和持续时间，避免密集弹幕叠成高亮光带。
    addEffect({type:'shieldHit',x,y,cx:base.x,cy:base.y,shieldRadius:radiusBefore,angle,r:0,max:(9+Math.min(18,strength*1.15))*fxScale,color:FACTIONS[faction].color,sourceColor:sourceColor||'#ffffff',life:machineInvolved ? .58 : 1,decay:machineInvolved ? 3.2 : 2.25});
    const count=Math.max(2,Math.floor(Math.min(9,3+Math.floor(strength*.48))*fxScale));
    for(let i=0;i<count;i++){
      const a=angle+(Math.random()-.5)*1.05;
      const dirX=Math.cos(a),dirY=Math.sin(a),speed=(44+Math.random()*58+strength*1.6)*(machineInvolved ? .7 : 1);
      addEffect({type:'shieldSpark',x,y,vx:dirX*speed,vy:dirY*speed,dirX,dirY,r:0,max:0,size:(.75+Math.random()*.95)*fxScale,color:i%4===0?(sourceColor||'#ffffff'):FACTIONS[faction].color,life:(.42+Math.random()*.15)*(machineInvolved ? .65 : 1),decay:machineInvolved ? 3.0 : 2.15,drag:7.2});
    }
  }

  function spawnAnnihilationEffects(x,y,a,b,consumed){
    const strength=Math.max(1,Math.log2(consumed+1));
    const colorA=FACTIONS[a.faction].color,colorB=FACTIONS[b.faction].color;
    const machineInvolved=a.kind==='machine'||b.kind==='machine';
    const fxScale=machineInvolved ? .52 : 1;
    // 机枪参与碰撞时进一步收紧亮度和粒子数量，避免密集弹幕形成连续白色闪屏。
    addEffect({type:'annihilation',x,y,r:0,max:(8+Math.min(18,strength*1.18))*fxScale,colorA,colorB,life:machineInvolved ? .62 : 1,decay:machineInvolved?3.15:2.45});
    const count=Math.max(2,Math.floor(Math.min(12,4+Math.floor(strength*.58))*fxScale));
    const seedAngle=Math.atan2(a.vy-b.vy,a.vx-b.vx);
    for(let i=0;i<count;i++){
      const a0=seedAngle+(i/count)*TAU+(Math.random()-.5)*.26;
      const dirX=Math.cos(a0),dirY=Math.sin(a0),speed=(48+Math.random()*72+strength*1.8)*(machineInvolved ? .72 : 1);
      addEffect({type:'annihilationSpark',x,y,vx:dirX*speed,vy:dirY*speed,dirX,dirY,r:0,max:0,size:(.65+Math.random()*1.05)*fxScale,color:i%2?colorA:colorB,life:(.38+Math.random()*.16)*(machineInvolved ? .68 : 1),decay:machineInvolved?3.0:2.25,drag:6.6});
    }
  }

  function absorbShield(faction,incomingFirepower,x,y,sourceColor,sourceKind=''){
    const incoming=shieldHitDamage('',incomingFirepower);
    if(incoming<=0||shieldValue[faction]<=0)return 0;
    const radiusBefore=shieldRadiusPx(shieldValue[faction]);
    const absorbed=Math.min(Math.floor(shieldValue[faction]),incoming);
    shieldValue[faction]=Math.max(0,shieldValue[faction]-absorbed);
    shieldFlash[faction]=1;
    spawnShieldImpactEffects(faction,x,y,absorbed,incoming,radiusBefore,sourceColor,sourceKind);
    return absorbed;
  }

  function bounceProjectileOnWalls(p){
    let bounced=false;
    // 持续弹丸边界反弹不再衰减速度，否则无限飞行最终会近似静止。
    if(p.x<=p.r){p.x=p.r;p.vx=Math.abs(p.vx);bounced=true;}
    else if(p.x>=WV.w-p.r){p.x=WV.w-p.r;p.vx=-Math.abs(p.vx);bounced=true;}
    if(p.y<=p.r){p.y=p.r;p.vy=Math.abs(p.vy);bounced=true;}
    else if(p.y>=WV.h-p.r){p.y=WV.h-p.r;p.vy=-Math.abs(p.vy);bounced=true;}
    if(bounced)p.bounces=(p.bounces||0)+1;
    return bounced;
  }


  function advanceOrbWithWallReflection(p,dt){
    // 镜像越界距离而不是直接夹紧中心，使碰墙帧不会丢失剩余位移。
    let x=p.x+p.vx*dt,y=p.y+p.vy*dt,bounces=0;
    for(let pass=0;pass<3;pass++){
      let changed=false;
      if(x<p.r){x=p.r+(p.r-x);p.vx=Math.abs(p.vx);changed=true;bounces++;}
      else if(x>WV.w-p.r){x=(WV.w-p.r)-(x-(WV.w-p.r));p.vx=-Math.abs(p.vx);changed=true;bounces++;}
      if(y<p.r){y=p.r+(p.r-y);p.vy=Math.abs(p.vy);changed=true;bounces++;}
      else if(y>WV.h-p.r){y=(WV.h-p.r)-(y-(WV.h-p.r));p.vy=-Math.abs(p.vy);changed=true;bounces++;}
      if(!changed)break;
    }
    p.x=Math.max(p.r,Math.min(WV.w-p.r,x));
    p.y=Math.max(p.r,Math.min(WV.h-p.r,y));
    if(bounces)p.bounces=(p.bounces||0)+bounces;
  }

  function segmentCircleEntry(x1,y1,x2,y2,cx,cy,r){
    const dx=x2-x1,dy=y2-y1,fx=x1-cx,fy=y1-cy;
    const a=dx*dx+dy*dy;
    if(a<=1e-9)return fx*fx+fy*fy<=r*r?0:null;
    const c=fx*fx+fy*fy-r*r;
    if(c<=0)return 0;
    const b=2*(fx*dx+fy*dy),disc=b*b-4*a*c;
    if(disc<0)return null;
    const root=Math.sqrt(disc),t1=(-b-root)/(2*a),t2=(-b+root)/(2*a);
    if(t1>=0&&t1<=1)return t1;
    if(t2>=0&&t2<=1)return t2;
    return null;
  }

  function clearSeparatedOrbShieldContacts(p){
    if(p.kind!=='orb'||!p.orbShieldContacts)return;
    for(let f=0;f<FACTIONS.length;f++){
      const bit=1<<f;if(!(p.orbShieldContacts&bit))continue;
      if(shieldValue[f]<=0||eliminated[f]){p.orbShieldContacts&=~bit;continue;}
      const base=getBasePos(f),radius=shieldRadiusForFaction(f);
      // 实心护盾只有在大球完全离开外边界后才解除接触锁，
      // 防止连续帧在同一覆盖区内重复扣除与反弹。
      if(Math.hypot(p.x-base.x,p.y-base.y)>radius+p.r+ORB_SHIELD_RELEASE_GAP)p.orbShieldContacts&=~bit;
    }
  }

  function getProjectileInteractiveHit(p,x1,y1,x2,y2){
    let best=null;
    if(p.kind==='orb')clearSeparatedOrbShieldContacts(p);
    const outer=projectileCollisionRadius(p);
    for(let f=0;f<FACTIONS.length;f++){
      if(f===p.faction||eliminated[f])continue;
      const cx=FACTIONS[f].base[0]*WV.w,cy=FACTIONS[f].base[1]*WV.h;
      if(shieldValue[f]>0){
        if(p.kind==='orb'&&(p.orbShieldContacts&(1<<f)))continue;
        const radius=shieldRadiusForFaction(f);
        const hitRadius=radius+outer;
        if((x1<cx-hitRadius&&x2<cx-hitRadius)||(x1>cx+hitRadius&&x2>cx+hitRadius)||(y1<cy-hitRadius&&y2<cy-hitRadius)||(y1>cy+hitRadius&&y2>cy+hitRadius))continue;
        // v46：护盾为实心圆形碰撞体。弹丸外缘进入覆盖半径即命中；
        // 若护盾扩张后将弹丸包入内部，t=0 会立即结算并将其向外反射或吸收。
        const t=segmentCircleEntry(x1,y1,x2,y2,cx,cy,hitRadius);
        if(t===null)continue;
        const hitX=x1+(x2-x1)*t,hitY=y1+(y2-y1)*t;
        let radialNx=hitX-cx,radialNy=hitY-cy,len=Math.hypot(radialNx,radialNy);
        if(len<1e-6){radialNx=-p.vx;radialNy=-p.vy;len=Math.hypot(radialNx,radialNy)||1;}
        radialNx/=len;radialNy/=len;
        const contactX=cx+radialNx*radius,contactY=cy+radialNy*radius;
        if(!best||t<best.t)best={faction:f,type:'shield',t,x:hitX,y:hitY,contactX,contactY,nx:radialNx,ny:radialNy,radialNx,radialNy,side:1,radius};
      }else{
        const hitRadius=BASE_CORE_HIT_RADIUS+outer;
        if((x1<cx-hitRadius&&x2<cx-hitRadius)||(x1>cx+hitRadius&&x2>cx+hitRadius)||(y1<cy-hitRadius&&y2<cy-hitRadius)||(y1>cy+hitRadius&&y2>cy+hitRadius))continue;
        const t=segmentCircleEntry(x1,y1,x2,y2,cx,cy,hitRadius);
        if(t===null)continue;
        const hitX=x1+(x2-x1)*t,hitY=y1+(y2-y1)*t;
        if(!best||t<best.t)best={faction:f,type:'core',t,x:hitX,y:hitY,contactX:hitX,contactY:hitY};
      }
    }
    return best;
  }

  function kickShieldRecoil(faction,nx,ny,loss){
    const strength=Math.min(105,35+Math.log2(Math.max(1,loss))*4.2);
    shieldRecoilVX[faction]-=nx*strength;shieldRecoilVY[faction]-=ny*strength;
  }

  function valuesWithinCollisionRatio(a,b){
    const small=Math.min(Math.floor(a),Math.floor(b));
    if(small<=0)return false;
    return Math.max(a,b)/small<=20;
  }

  function collisionEightyPercentLoss(a,b){
    const aUnits=Math.max(0,Math.floor(a)),bUnits=Math.max(0,Math.floor(b));
    const small=Math.min(aUnits,bUnits);
    // 大球与护盾始终需要完成反弹，因此双方至少保留 1 点。
    if(small<=1)return 0;
    return Math.min(small-1,Math.max(1,Math.ceil(small*.8)));
  }

  function reflectVelocityFromNormal(p,nx,ny,restitution,minOutward=0){
    const inward=p.vx*nx+p.vy*ny;
    if(inward<0){
      p.vx-=(1+restitution)*inward*nx;
      p.vy-=(1+restitution)*inward*ny;
    }
    const outward=p.vx*nx+p.vy*ny;
    if(outward<minOutward){
      p.vx+=(minOutward-outward)*nx;
      p.vy+=(minOutward-outward)*ny;
    }
  }

  function bounceOrbFromShield(p,faction,hit){
    const nx=hit.nx,ny=hit.ny;
    // 连续反弹：保留连续碰撞求出的真实接触位置，只沿反射法线做亚像素级分离。
    // 不再根据碰撞前或碰撞后的护盾半径重放大球位置，因此护盾缩放不会造成跳变。
    const separationNudge=.35;
    p.x=hit.x+nx*separationNudge;
    p.y=hit.y+ny*separationNudge;
    reflectVelocityFromNormal(p,nx,ny,ORB_SHIELD_RESTITUTION,30);
    p.prevX=hit.x;p.prevY=hit.y;p.paintX=p.x;p.paintY=p.y;
    p.bounces=(p.bounces||0)+1;
    p.orbShieldContacts|=1<<faction;
    return {nx:hit.radialNx,ny:hit.radialNy};
  }

  function resolveOrbShieldHit(p,hit){
    const faction=hit.faction,shieldBefore=Math.max(0,Math.floor(shieldValue[faction]));
    if(shieldBefore<=0)return false;
    const radiusBefore=hit.radius;
    p.orbShieldContacts|=1<<faction;

    // 不再按 20 倍差距切换为穿透或完全吸收。
    // 任意尺寸护盾与大球接触时都按较小值的 80% 损耗，并始终执行反弹。
    const loss=collisionEightyPercentLoss(p.firepower,shieldBefore);
    if(loss>0){
      syncProjectileFirepower(p,p.firepower-loss);
      shieldValue[faction]=Math.max(1,shieldBefore-loss);
      shieldFlash[faction]=1;
      spawnShieldImpactEffects(faction,hit.contactX,hit.contactY,loss,loss,radiusBefore,FACTIONS[p.faction].color,'orb');
    }else{
      shieldFlash[faction]=Math.max(shieldFlash[faction],.55);
      spawnShieldImpactEffects(faction,hit.contactX,hit.contactY,0,0,radiusBefore,FACTIONS[p.faction].color,'orb');
    }

    bounceOrbFromShield(p,faction,hit);
    return false;
  }

  function eliminateFaction(faction,attacker,x,y){
    if(eliminated[faction])return;
    const pendingMachineFirepower=Math.max(0,Math.floor(machineFirepowerPool[faction]))+Math.max(0,Math.ceil(machineVisualGroups[faction].damage));
    const pendingBallValues=[];
    for(let i=balls.length-1;i>=0;i--){
      if(balls[i].faction!==faction)continue;
      pendingBallValues.push(Math.max(0,Math.floor(balls[i].value)));
      balls.splice(i,1);
    }
    const resourceSummary=settleEliminatedFactionResources(faction,pendingMachineFirepower,pendingBallValues);
    eliminated[faction]=true;eliminationFlash[faction]=1;shieldValue[faction]=0;shieldFlash[faction]=0;shieldGainFlash[faction]=0;machineGainFlash[faction]=0;
    // 全局倍率对所有存活阵营共用；每次淘汰后，所有后续新弹珠统一提升 8 倍。
    globalStartValueMultiplier*=8;
    machineFirepowerPool[faction]=0;cannonStepCarry[faction]=0;
    const group=machineVisualGroups[faction];group.rounds=0;group.damage=0;group.sin=0;group.cos=0;group.speed=0;group.count=0;group.seed=0;
    for(let i=fireQueue.length-1;i>=0;i--)if(fireQueue[i].data.faction===faction&&!fireQueue[i].data.allowEliminated)fireQueue.splice(i,1);
    for(let i=sniperAimJobs.length-1;i>=0;i--)if(sniperAimJobs[i].faction===faction)sniperAimJobs.splice(i,1);
    for(let i=beams.length-1;i>=0;i--)if(beams[i].faction===faction)beams.splice(i,1);
    const rewardSummary=[];
    for(let survivor=0;survivor<FACTIONS.length;survivor++){
      if(eliminated[survivor])continue;
      const reward=survivor===attacker?2:1;
      addFactionRewardBalls(survivor,reward);
      rewardSummary.push(`${FACTIONS[survivor].name}+${reward}`);
    }
    for(let ring=0;ring<4;ring++)addEffect({type:'baseHit',x,y,r:ring*5,max:26+ring*12,color:FACTIONS[faction].color,life:1.15-ring*.12,decay:1.45+ring*.18});
    const attackerName=attacker===null?'未知阵营':FACTIONS[attacker].name;
    log(`${FACTIONS[faction].name}核心被${attackerName}弹丸击中，已被淘汰`,faction);
    if(resourceSummary.orbCount>0)log(`${FACTIONS[faction].name}淘汰结算：${pendingBallValues.length} 枚生成区弹珠与未结算机枪火力转为 ${resourceSummary.orbCount} 枚随机方向大球（合计 ${formatNum(resourceSummary.totalFirepower)} 火力）`,faction);
    if(rewardSummary.length)log(`淘汰奖励弹珠：${rewardSummary.join('，')}；所有存活阵营后续弹珠起始值 ×${globalStartValueMultiplier}`,attacker!==null?attacker:null);
    updateBaseTextCaches();updateStats();
  }

  function resolveProjectileInteractiveHit(p,hit){
    if(hit.type==='shield'){
      if(p.kind==='orb')return resolveOrbShieldHit(p,hit);
      const absorbed=absorbShield(hit.faction,p.firepower,hit.contactX,hit.contactY,FACTIONS[p.faction].color,p.kind);
      syncProjectileFirepower(p,p.firepower-absorbed);
      if(p.firepower<=0)return true;
      const speed=Math.hypot(p.vx,p.vy)||1,nx=p.vx/speed,ny=p.vy/speed;
      p.x=hit.x+nx*(p.r+2);p.y=hit.y+ny*(p.r+2);
      p.prevX=hit.x;p.prevY=hit.y;p.paintX=p.x;p.paintY=p.y;
      return false;
    }
    if(hit.type==='core'){
      eliminateFaction(hit.faction,p.faction,hit.x,hit.y);
      return true;
    }
    return false;
  }

  function projectileCollisionRadius(p){return p.r;}
  const projectilePairHitResult={t:0,x:0,y:0,ax:0,ay:0,bx:0,by:0};

  function sweptProjectilePairHit(a,b){
    const r=projectileCollisionRadius(a)+projectileCollisionRadius(b);
    const r0x=a.prevX-b.prevX,r0y=a.prevY-b.prevY;
    const dax=(a.x-a.prevX)-(b.x-b.prevX),day=(a.y-a.prevY)-(b.y-b.prevY);
    const qa=dax*dax+day*day,qb=2*(r0x*dax+r0y*day),qc=r0x*r0x+r0y*r0y-r*r;
    let t=null;
    if(qc<=0)t=0;
    else if(qa>1e-9){
      const disc=qb*qb-4*qa*qc;
      if(disc>=0){
        const root=Math.sqrt(disc),t0=(-qb-root)/(2*qa),t1=(-qb+root)/(2*qa);
        if(t0>=0&&t0<=1)t=t0;else if(t1>=0&&t1<=1)t=t1;
      }
    }
    if(t===null)return null;
    const ax=a.prevX+(a.x-a.prevX)*t,ay=a.prevY+(a.y-a.prevY)*t;
    const bx=b.prevX+(b.x-b.prevX)*t,by=b.prevY+(b.y-b.prevY)*t;
    projectilePairHitResult.t=t;projectilePairHitResult.x=(ax+bx)*.5;projectilePairHitResult.y=(ay+by)*.5;
    projectilePairHitResult.ax=ax;projectilePairHitResult.ay=ay;projectilePairHitResult.bx=bx;projectilePairHitResult.by=by;
    return projectilePairHitResult;
  }

  function orbCollisionMass(p){return Math.max(1,p.r*p.r);}

  function getOrbPairNormal(a,b,hit=null){
    let nx=(hit?hit.ax:a.x)-(hit?hit.bx:b.x),ny=(hit?hit.ay:a.y)-(hit?hit.by:b.y);
    let len=Math.hypot(nx,ny);
    if(len<1e-6){nx=a.x-b.x;ny=a.y-b.y;len=Math.hypot(nx,ny);}
    if(len<1e-6){nx=a.vx-b.vx;ny=a.vy-b.vy;len=Math.hypot(nx,ny);}
    if(len<1e-6){nx=1;ny=0;len=1;}
    return {nx:nx/len,ny:ny/len};
  }

  function separateOrbPair(a,b,nx,ny,padding=ORB_CONTACT_PADDING){
    const minDist=a.r+b.r+padding,dx=a.x-b.x,dy=a.y-b.y,dist=Math.hypot(dx,dy);
    if(dist>=minDist)return;
    const massA=orbCollisionMass(a),massB=orbCollisionMass(b),total=massA+massB,overlap=minDist-dist;
    a.x+=nx*overlap*(massB/total);a.y+=ny*overlap*(massB/total);
    b.x-=nx*overlap*(massA/total);b.y-=ny*overlap*(massA/total);
  }

  function bounceOrbPair(a,b,hit){
    const {nx,ny}=getOrbPairNormal(a,b,hit);
    if(hit){a.x=hit.ax;a.y=hit.ay;b.x=hit.bx;b.y=hit.by;}
    separateOrbPair(a,b,nx,ny);
    const massA=orbCollisionMass(a),massB=orbCollisionMass(b),invA=1/massA,invB=1/massB;
    const relative=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
    if(relative<0){
      const impulse=-(1+ORB_PAIR_RESTITUTION)*relative/(invA+invB);
      a.vx+=impulse*invA*nx;a.vy+=impulse*invA*ny;
      b.vx-=impulse*invB*nx;b.vy-=impulse*invB*ny;
    }
    const separating=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
    if(separating<ORB_MIN_SEPARATION_SPEED){
      const correction=(ORB_MIN_SEPARATION_SPEED-separating)/(invA+invB);
      a.vx+=correction*invA*nx;a.vy+=correction*invA*ny;
      b.vx-=correction*invB*nx;b.vy-=correction*invB*ny;
    }
    a.bounces=(a.bounces||0)+1;b.bounces=(b.bounces||0)+1;
  }

  function resolveOrbPairCollision(a,b,hit){
    if(valuesWithinCollisionRatio(a.firepower,b.firepower)){
      const loss=collisionEightyPercentLoss(a.firepower,b.firepower);
      syncProjectileFirepower(a,a.firepower-loss);
      syncProjectileFirepower(b,b.firepower-loss);
      spawnAnnihilationEffects(hit.x,hit.y,a,b,loss);
      if(a.firepower>0&&b.firepower>0)bounceOrbPair(a,b,hit);
      return;
    }
    const consumed=Math.min(Math.floor(a.firepower),Math.floor(b.firepower));
    if(consumed<=0)return;
    syncProjectileFirepower(a,a.firepower-consumed);
    syncProjectileFirepower(b,b.firepower-consumed);
    spawnAnnihilationEffects(hit.x,hit.y,a,b,consumed);
  }

  function getOrbBulletMomentumGain(orbValue,bulletValue,orbRadius=orbDiameterFromFirepower(orbValue)*.5){
    const safeOrb=Math.max(1,Math.floor(orbValue));
    const safeBullet=Math.max(1,Math.floor(bulletValue));
    const relativeShare=safeBullet/(safeOrb+safeBullet);
    const bulletStrength=Math.log2(safeBullet+1);
    const orbResistance=Math.log2(safeOrb+1);
    const baseGain=Math.min(
      TUNING.orbBulletMomentum.maxBaseGain,
      Math.max(
        TUNING.orbBulletMomentum.minBaseGain,
        (3.2+bulletStrength*1.45)
        * (0.35+relativeShare*0.95)
        / Math.max(0.9,0.72+orbResistance*0.16)
      )
    );
    // 机枪子弹的动能传入大球后，按大球半径做额外衰减：大球越大，
    // 同样一发子弹对其整体速度的影响越小；小球保持原有继承强度。
    const radius=Math.max(1,Number(orbRadius)||1),momentumTuning=TUNING.orbBulletMomentum;
    const sizeDamping=Math.max(momentumTuning.minSizeDamping,
      Math.min(1,Math.pow(momentumTuning.referenceRadius/radius,momentumTuning.sizeDampingExponent)));
    return baseGain*TUNING.orbBulletMomentum.inheritanceScale*sizeDamping;
  }

  function inheritBulletMomentumIntoOrb(orb,bullet,interactingValue){
    const speed=Math.hypot(bullet.vx,bullet.vy);
    const value=Math.max(0,Math.floor(interactingValue));
    if(speed<=0||value<=0)return 0;
    const gain=getOrbBulletMomentumGain(orb.firepower,value,orb.r);
    orb.vx+=(bullet.vx/speed)*gain;
    orb.vy+=(bullet.vy/speed)*gain;
    capBallSpeed(orb,Math.max(280,orb.nominalSpeed||0)+120);
    return gain;
  }

  function getOrbSurfaceContact(orb,other,hit){
    const distanceToA=(orb.x-hit.ax)*(orb.x-hit.ax)+(orb.y-hit.ay)*(orb.y-hit.ay);
    const distanceToB=(orb.x-hit.bx)*(orb.x-hit.bx)+(orb.y-hit.by)*(orb.y-hit.by);
    const orbX=distanceToA<=distanceToB?hit.ax:hit.bx,orbY=distanceToA<=distanceToB?hit.ay:hit.by;
    const otherX=distanceToA<=distanceToB?hit.bx:hit.ax,otherY=distanceToA<=distanceToB?hit.by:hit.ay;
    let nx=otherX-orbX,ny=otherY-orbY,len=Math.hypot(nx,ny);
    if(len<1e-6){nx=other.x-orb.x;ny=other.y-orb.y;len=Math.hypot(nx,ny);}
    if(len<1e-6){nx=-other.vx;ny=-other.vy;len=Math.hypot(nx,ny)||1;}
    nx/=len;ny/=len;
    return {x:orbX+nx*orb.r,y:orbY+ny*orb.r,angle:Math.atan2(ny,nx),nx,ny};
  }

  function spawnOrbEnemyMachineImpact(orb,machine,hit,consumed){
    const contact=getOrbSurfaceContact(orb,machine,hit);
    const sourceColor=FACTIONS[machine.faction].color,orbColor=FACTIONS[orb.faction].color;
    const strength=Math.max(1,Math.log2(consumed+1));
    addEffect({
      type:'orbEnemyHit',
      x:contact.x,y:contact.y,edgeX:contact.x,edgeY:contact.y,
      targetOrb:orb,targetId:orb.id,targetRadius:orb.r,angle:contact.angle,
      color:orbColor,sourceColor,
      r:0,max:8+Math.min(18,strength*.82),
      life:.92,decay:1.9
    });
    const tangentX=-contact.ny,tangentY=contact.nx;
    for(let i=-1;i<=1;i+=2){
      const speed=38+Math.min(70,strength*2.4);
      addEffect({
        type:'annihilationSpark',x:contact.x,y:contact.y,
        vx:(contact.nx*.72+tangentX*i*.42)*speed,vy:(contact.ny*.72+tangentY*i*.42)*speed,
        dirX:contact.nx*.72+tangentX*i*.42,dirY:contact.ny*.72+tangentY*i*.42,
        size:.72,color:i<0?sourceColor:orbColor,life:.34,decay:3.2,drag:8.4
      });
    }
  }

  function absorbFriendlyMachineIntoOrb(orb,machine,hit){
    const absorbed=Math.max(0,Math.floor(machine.firepower));
    if(absorbed<=0)return 0;

    const orbBefore=Math.max(1,Math.floor(orb.firepower));
    const contact=getOrbSurfaceContact(orb,machine,hit);
    const cross=contact.nx*machine.vy-contact.ny*machine.vx;
    const absorbAngle=contact.angle;
    orb.absorbFlashAt=simulationElapsed;
    orb.absorbAngle=absorbAngle;
    orb.absorbStrength=Math.min(1,.38+Math.log10(absorbed+1)*.075);
    addEffect({
      type:'orbAbsorb',
      entryX:contact.x,
      entryY:contact.y,
      entryAngle:contact.angle,
      entryRadius:orb.r,
      orbitSign:cross>=0?1:-1,
      bulletRadius:machine.r,
      visualSeed:machine.visualSeed||machine.id,
      targetOrb:orb,
      targetId:orb.id,
      targetRadius:orb.r,
      color:FACTIONS[orb.faction].color,
      lightColor:mixHexColors(FACTIONS[orb.faction].color,'#ffffff',.72),
      life:1,
      decay:1.18
    });
    // 先按吸收前的大球数值计算动量，随后再把子弹数值并入大球。
    inheritBulletMomentumIntoOrb(orb,machine,absorbed);
    syncProjectileFirepower(orb,orbBefore+absorbed);
    syncProjectileFirepower(machine,0);
    machine.dead=true;
    machine.x=hit.x;
    machine.y=hit.y;
    machine.prevX=hit.x;
    machine.prevY=hit.y;
    return absorbed;
  }

  function stabilizeExistingOrbContact(a,b){
    const dist=Math.hypot(a.x-b.x,a.y-b.y),minDist=a.r+b.r;
    if(dist>=minDist)return;
    const {nx,ny}=getOrbPairNormal(a,b);
    separateOrbPair(a,b,nx,ny,.5);
    const closing=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
    if(closing<0)bounceOrbPair(a,b,null);
  }

  // 查询层先过滤绝不会发生作用的同阵营普通弹丸，保留大球-大球与大球-机枪吸收路径。
  // resolveProjectilePairInteraction 仍保留最终规则判断，避免查询优化改变碰撞结果。
  function projectilePairMayInteract(p,q){
    if(q.dead||q.firepower<=0)return false;
    if(p.faction!==q.faction)return true;
    const pOrb=p.collisionKind===PROJECTILE_COLLISION_KIND.ORB;
    const qOrb=q.collisionKind===PROJECTILE_COLLISION_KIND.ORB;
    return (pOrb&&qOrb)||(pOrb!==qOrb&&(p.collisionKind===PROJECTILE_COLLISION_KIND.MACHINE||q.collisionKind===PROJECTILE_COLLISION_KIND.MACHINE));
  }

  function resolveProjectilePairInteraction(p,q){
    if(q.dead||q.firepower<=0)return false;
    const sameFaction=q.faction===p.faction;
    const pKind=p.collisionKind,qKind=q.collisionKind;
    const bothOrbs=pKind===PROJECTILE_COLLISION_KIND.ORB&&qKind===PROJECTILE_COLLISION_KIND.ORB;
    const friendlyOrbMachine=sameFaction&&pKind+qKind===PROJECTILE_COLLISION_KIND.ORB+PROJECTILE_COLLISION_KIND.MACHINE&&pKind!==qKind;
    const friendlyOrbPair=sameFaction&&bothOrbs;
    if(sameFaction&&!friendlyOrbMachine&&!friendlyOrbPair)return false;

    const hit=sweptProjectilePairHit(p,q);if(!hit)return false;
    perfCounters.projectilePairResolved++;
    // 弹丸可能在两次低频领土刷新之间相撞并消失；先补算双方到真实碰撞点的路径，
    // 保证已经触碰到的敌方领土不会因为弹丸提前销毁而漏占领。
    const pExhausted=paintProjectileBeforePairHit(p,hit.ax,hit.ay);
    const qExhausted=paintProjectileBeforePairHit(q,hit.bx,hit.by);
    if(pExhausted||qExhausted)return p.dead;

    if(friendlyOrbMachine){
      const orb=pKind===PROJECTILE_COLLISION_KIND.ORB?p:q;
      const machine=pKind===PROJECTILE_COLLISION_KIND.MACHINE?p:q;
      absorbFriendlyMachineIntoOrb(orb,machine,hit);
    }else if(bothOrbs){
      const lo=Math.min(p.id,q.id),hi=Math.max(p.id,q.id),key=`${lo}:${hi}`;
      currentOrbPairContacts.add(key);
      if(previousOrbPairContacts.has(key)){
        stabilizeExistingOrbContact(p,q);
      }else if(friendlyOrbPair){
        // 己方大球之间只发生实体弹性碰撞，不互相消耗火力。
        bounceOrbPair(p,q,hit);
      }else{
        resolveOrbPairCollision(p,q,hit);
      }
    }else{
      const consumed=Math.min(Math.floor(p.firepower),Math.floor(q.firepower));
      if(consumed<=0)return false;
      // 敌方普通子弹撞击大球时，大球沿子弹来向继承微小动量。
      const orb=pKind===PROJECTILE_COLLISION_KIND.ORB?p:q;
      const other=orb===p?q:p;
      const contact=getOrbSurfaceContact(orb,other,hit);
      inheritBulletMomentumIntoOrb(orb,other,consumed);
      syncProjectileFirepower(p,p.firepower-consumed);
      syncProjectileFirepower(q,q.firepower-consumed);
      if(other.kind==='machine')spawnOrbEnemyMachineImpact(orb,other,hit,consumed);
      else spawnAnnihilationEffects(contact.x,contact.y,p,q,consumed);
    }
    if(q.firepower<=0){syncProjectileFirepower(q,0);q.dead=true;q.x=hit.x;q.y=hit.y;}
    if(p.firepower<=0){syncProjectileFirepower(p,0);p.dead=true;p.x=hit.x;p.y=hit.y;}
    return p.dead;
  }

  function resolveProjectileFirepowerInteractions(){
    const broadphaseStart=PERF_DEBUG_ACTIVE?performance.now():0;let resolveDuration=0;
    currentOrbPairContacts.clear();
    for(const index of activeProjectileBuckets)projectileCollisionBuckets[index].length=0;
    for(const index of activeOrbProjectileBuckets)projectileOrbCollisionBuckets[index].length=0;
    activeProjectileBuckets.length=0;
    activeOrbProjectileBuckets.length=0;
    let maxSmallProjectileRadius=0;

    for(const p of projectiles){
      if(p.dead||p.firepower<=0)continue;
      const cx=Math.max(0,Math.min(PROJECTILE_HASH_COLS-1,Math.floor(p.x/PROJECTILE_HASH_CELL)));
      const cy=Math.max(0,Math.min(PROJECTILE_HASH_ROWS-1,Math.floor(p.y/PROJECTILE_HASH_CELL)));
      // 普通弹丸仅查询普通弹丸哈希；大球单独维护稀疏桶，避免一个 400px 大球让所有小弹丸扫描 15×15 个桶。
      // 按真实扫掠 AABB 精确落桶，小弹不再无条件扫描周围 3×3 共九个桶。
      const queryRadius=projectileCollisionRadius(p)+maxSmallProjectileRadius;
      const queryMinX=Math.max(0,Math.floor((Math.min(p.prevX,p.x)-queryRadius)/PROJECTILE_HASH_CELL));
      const queryMinY=Math.max(0,Math.floor((Math.min(p.prevY,p.y)-queryRadius)/PROJECTILE_HASH_CELL));
      const queryMaxX=Math.min(PROJECTILE_HASH_COLS-1,Math.floor((Math.max(p.prevX,p.x)+queryRadius)/PROJECTILE_HASH_CELL));
      const queryMaxY=Math.min(PROJECTILE_HASH_ROWS-1,Math.floor((Math.max(p.prevY,p.y)+queryRadius)/PROJECTILE_HASH_CELL));
      outer:
      for(let ny=queryMinY;ny<=queryMaxY;ny++){
        for(let nx=queryMinX;nx<=queryMaxX;nx++){
            const list=projectileCollisionBuckets[ny*PROJECTILE_HASH_COLS+nx];
            for(let j=0;j<list.length;j++){
              perfCounters.projectilePairCandidates++;
              if(!projectilePairMayInteract(p,list[j]))continue;
              const resolveStart=PERF_DEBUG_ACTIVE?performance.now():0;
              const remove=resolveProjectilePairInteraction(p,list[j]);
              if(PERF_DEBUG_ACTIVE)resolveDuration+=performance.now()-resolveStart;
              if(remove)break outer;
            }
        }
      }
      if(!p.dead){
        projectileOrbQueryStamp=(projectileOrbQueryStamp+1)>>>0;
        if(projectileOrbQueryStamp===0){
          for(const projectile of projectiles)projectile.orbQueryStamp=0;
          projectileOrbQueryStamp=1;
        }
        const radius=projectileCollisionRadius(p);
        const minX=Math.max(0,Math.floor((Math.min(p.prevX,p.x)-radius)/PROJECTILE_HASH_CELL));
        const minY=Math.max(0,Math.floor((Math.min(p.prevY,p.y)-radius)/PROJECTILE_HASH_CELL));
        const maxX=Math.min(PROJECTILE_HASH_COLS-1,Math.floor((Math.max(p.prevX,p.x)+radius)/PROJECTILE_HASH_CELL));
        const maxY=Math.min(PROJECTILE_HASH_ROWS-1,Math.floor((Math.max(p.prevY,p.y)+radius)/PROJECTILE_HASH_CELL));
        orbQuery:
        for(let oy=minY;oy<=maxY;oy++){
          for(let ox=minX;ox<=maxX;ox++){
            const list=projectileOrbCollisionBuckets[oy*PROJECTILE_HASH_COLS+ox];
            for(let j=0;j<list.length;j++){
              const orb=list[j];
              if(orb.orbQueryStamp===projectileOrbQueryStamp)continue;
              orb.orbQueryStamp=projectileOrbQueryStamp;
              perfCounters.projectilePairCandidates++;
              if(!projectilePairMayInteract(p,orb))continue;
              const resolveStart=PERF_DEBUG_ACTIVE?performance.now():0;
              const remove=resolveProjectilePairInteraction(p,orb);
              if(PERF_DEBUG_ACTIVE)resolveDuration+=performance.now()-resolveStart;
              if(remove)break orbQuery;
            }
          }
        }
      }
      if(!p.dead){
        if(p.collisionKind===PROJECTILE_COLLISION_KIND.ORB){
          const radius=projectileCollisionRadius(p);
          const minX=Math.max(0,Math.floor((Math.min(p.prevX,p.x)-radius)/PROJECTILE_HASH_CELL));
          const minY=Math.max(0,Math.floor((Math.min(p.prevY,p.y)-radius)/PROJECTILE_HASH_CELL));
          const maxX=Math.min(PROJECTILE_HASH_COLS-1,Math.floor((Math.max(p.prevX,p.x)+radius)/PROJECTILE_HASH_CELL));
          const maxY=Math.min(PROJECTILE_HASH_ROWS-1,Math.floor((Math.max(p.prevY,p.y)+radius)/PROJECTILE_HASH_CELL));
          for(let oy=minY;oy<=maxY;oy++)for(let ox=minX;ox<=maxX;ox++){
            const bucketIndex=oy*PROJECTILE_HASH_COLS+ox,bucket=projectileOrbCollisionBuckets[bucketIndex];
            if(bucket.length===0)activeOrbProjectileBuckets.push(bucketIndex);
            bucket.push(p);
          }
        }else{
          const radius=projectileCollisionRadius(p);
          if(radius>maxSmallProjectileRadius)maxSmallProjectileRadius=radius;
          const bucketIndex=cy*PROJECTILE_HASH_COLS+cx,bucket=projectileCollisionBuckets[bucketIndex];
          if(bucket.length===0)activeProjectileBuckets.push(bucketIndex);
          bucket.push(p);
        }
      }
    }
    const swap=previousOrbPairContacts;previousOrbPairContacts=currentOrbPairContacts;currentOrbPairContacts=swap;
    if(PERF_DEBUG_ACTIVE){const total=performance.now()-broadphaseStart;perfProjectileResolveMs+=resolveDuration;perfProjectileBroadphaseMs+=Math.max(0,total-resolveDuration);}
  }

  function currentMachineVisualGroupSteps(){

  function getMachineBulletPowerRatio(pool){
    const fullPool=TUNING.machine.bulletPowerFullPool;
    const halfPool=TUNING.machine.bulletPowerHalfPool;
    const floor=TUNING.machine.bulletPowerFloor;
    const value=Number.isFinite(pool)?Math.max(0,pool):Number.MAX_VALUE;
    if(value<=fullPool)return 1;
    // 指数衰减：400K 为 100%，10M 为 50%，无限增大时连续趋近 25%。
    const decayRate=Math.log(3)/(halfPool-fullPool);
    return floor+(1-floor)*Math.exp(-decayRate*(value-fullPool));
  }

  function flushMachineVisualGroup(faction){
    const g=machineVisualGroups[faction];if(g.rounds<=0)return true;
    const projectileDamage=Math.ceil(g.damage);
    if(projectileDamage>0){
      if(!spawnProjectile({
        kind:'machine',faction,angle:normalizeAngle(Math.atan2(g.sin,g.cos)),speed:g.speed/g.rounds,
        firepower:projectileDamage,rounds:g.rounds,visualSeed:g.seed,visualPellets:1
      }))return false;
    }
    g.rounds=0;g.damage=0;g.sin=0;g.cos=0;g.speed=0;g.count=0;g.seed=0;
    return true;
  }

  function updateCannons(dt){
    for(let f=0;f<FACTIONS.length;f++){
      if(eliminated[f])continue;
      const pendingGroup=machineVisualGroups[f];if(pendingGroup.rounds>0&&pendingGroup.count>=currentMachineVisualGroupSteps()&&!flushMachineVisualGroup(f))continue;
      const prevAngle=cannonAngle[f],deltaDeg=CANNON_ROT_SPEED_DEG*dt;
      cannonAngle[f]=normalizeAngle(cannonAngle[f]+CANNON_ROT_SPEED*dt);cannonStepCarry[f]+=deltaDeg;
      const steps=Math.floor(cannonStepCarry[f]/MACHINE_FIRE_STEP_DEG);if(steps<=0)continue;
      cannonStepCarry[f]-=steps*MACHINE_FIRE_STEP_DEG;
      const stepRad=MACHINE_FIRE_STEP_DEG*Math.PI/180,groupTarget=currentMachineVisualGroupSteps(),g=machineVisualGroups[f];

      for(let step=0;step<steps;step++){
        const currentTotal=Math.floor(machineFirepowerPool[f]);if(currentTotal<=0)break;
        const roundCount=Math.min(currentTotal,Math.max(1,Math.ceil(currentTotal*MACHINE_FIRE_PERCENT)));
        const bulletPowerRatio=getMachineBulletPowerRatio(currentTotal);
        // v116：衰减后的整数火力同时作为伤害和弹药池消耗，结算统一向上取整。
        const effectiveFirepower=Math.min(currentTotal,Math.max(1,Math.ceil(roundCount*bulletPowerRatio)));
        const shotIndex=machineShotIndex[f]++,angleNoise=machineNaturalNoise(shotIndex,f+1)*MACHINE_ANGLE_NOISE_DEG*Math.PI/180;
        const speedNoise=machineNaturalNoise(shotIndex,f+11)*MACHINE_SPEED_NOISE;
        const angle=normalizeAngle(prevAngle+(step+1)*stepRad+angleNoise),shotSpeed=MACHINE_BASE_SPEED*(1+speedNoise);
        if(g.count===0)g.seed=shotIndex;
        g.rounds+=roundCount;g.damage+=effectiveFirepower;g.sin+=Math.sin(angle)*roundCount;g.cos+=Math.cos(angle)*roundCount;g.speed+=shotSpeed*roundCount;g.count++;
        machineFirepowerPool[f]=currentTotal-effectiveFirepower;
        if(g.count>=groupTarget&&!flushMachineVisualGroup(f))break;
        if(machineFirepowerPool[f]<=0){
          machineFirepowerPool[f]=0;flushMachineVisualGroup(f);log(`${FACTIONS[f].name}的剩余机枪火力已全部消耗`,f);break;
        }
      }
    }
  }

    effectUpdateCarry+=dt;if(effectUpdateCarry>=EFFECT_UPDATE_STEP){const effectDt=effectUpdateCarry;effectUpdateCarry%=EFFECT_UPDATE_STEP;for(let i=pulses.length-1;i>=0;i--){const p=pulses[i];p.age=(p.age||0)+effectDt;p.life-=effectDt*(p.decay||1.7);const fxFlags=p.fxFlags||0;if(fxFlags&FX_FLAG_SPARK){p.x+=p.vx*effectDt;p.y+=p.vy*effectDt;const drag=Math.exp(-effectDt*(p.drag||4));p.vx*=drag;p.vy*=drag;}else if(fxFlags&FX_FLAG_EXPANDING){const initial=p.initialLife||1,progress=Math.max(0,Math.min(1,1-p.life/initial));p.r=p.max*(1-Math.pow(1-progress,3));}else if(Number.isFinite(p.r)&&Number.isFinite(p.max))p.r+=(p.max-p.r)*effectDt*7;if(p.life<=0){const last=pulses.pop();if(i<pulses.length)pulses[i]=last;}}}
  }

  function updateWar(dt){
    if(gpuBattleActive&&gpuBattle?.ready){updateWarGpu(dt);return;}
    updateCannons(dt);
    updateSniperAimJobs(dt);
    territorySimCarry+=dt;territoryUploadCarry+=dt;
    const paintNow=territorySimCarry>=TERRITORY_STEP;
    if(paintNow)territorySimCarry%=TERRITORY_STEP;

    for(let i=fireQueue.length-1;i>=0;i--){
      const item=fireQueue[i];item.time-=dt;
      if(item.time<=0){const maySpawn=!eliminated[item.data.faction]||item.data.allowEliminated;if(maySpawn&&!spawnProjectile(item.data)){item.time=0;continue;}const last=fireQueue.pop();if(i<fireQueue.length)fireQueue[i]=last;}
    }
    for(let f=0;f<4;f++){
      shieldFlash[f]=Math.max(0,shieldFlash[f]-dt*1.8);
      shieldGainFlash[f]=Math.max(0,shieldGainFlash[f]-dt*1.45);
      machineGainFlash[f]=Math.max(0,machineGainFlash[f]-dt*1.45);
      eliminationFlash[f]=Math.max(0,eliminationFlash[f]-dt*.85);
      shieldRecoilX[f]+=shieldRecoilVX[f]*dt;shieldRecoilY[f]+=shieldRecoilVY[f]*dt;
      const velocityDamping=Math.exp(-dt*11),positionDamping=Math.exp(-dt*14);
      shieldRecoilVX[f]*=velocityDamping;shieldRecoilVY[f]*=velocityDamping;
      shieldRecoilX[f]*=positionDamping;shieldRecoilY[f]*=positionDamping;
      const recoilLength=Math.hypot(shieldRecoilX[f],shieldRecoilY[f]);
      if(recoilLength>7){const scale=7/recoilLength;shieldRecoilX[f]*=scale;shieldRecoilY[f]*=scale;}
    }
    for(const cell of converterCells)cell.highlightStrength=Math.max(0,(cell.highlightStrength||0)-dt*CONVERTER_HIGHLIGHT_FADE);

    // 第一阶段：按独立的战场固定步进统一移动，再进行弹丸间对消。
    const movePerfStart=PERF_DEBUG_ACTIVE?performance.now():0;
    for(const p of projectiles){
      p.dead=false;p.prevX=p.x;p.prevY=p.y;
      if(p.kind==='machine'){
        p.jitterPhase+=dt*MACHINE_JITTER_RATE_A;
        p.jitterPhaseB+=dt*MACHINE_JITTER_RATE_B;
        const heading=(Math.sin(p.jitterPhase)+Math.sin(p.jitterPhaseB)*.42)*MACHINE_DIRECTION_JITTER_DEG*Math.PI/180;
        const delta=heading-p.jitterHeading;p.jitterHeading=heading;
        const c=Math.cos(delta),sn=Math.sin(delta),vx=p.vx*c-p.vy*sn,vy=p.vx*sn+p.vy*c;
        const speed=Math.hypot(vx,vy)||1;
        const targetSpeed=p.nominalSpeed*(1+MACHINE_CONTINUOUS_SPEED_JITTER*(Math.sin(p.jitterPhaseB)*.72+Math.sin(p.jitterPhase*.47)*.28));
        const scale=targetSpeed/speed;p.vx=vx*scale;p.vy=vy*scale;
      }
      if(p.kind==='orb')advanceOrbWithWallReflection(p,dt);
      else{p.x+=p.vx*dt;p.y+=p.vy*dt;bounceProjectileOnWalls(p);}
    }
    if(PERF_DEBUG_ACTIVE)perfWarMoveMs+=performance.now()-movePerfStart;
    const pairPerfStart=PERF_DEBUG_ACTIVE?performance.now():0;
    resolveProjectileFirepowerInteractions();
    if(PERF_DEBUG_ACTIVE)perfWarPairMs+=performance.now()-pairPerfStart;

    // 第二阶段：处理火力耗尽、领土染色以及护盾／基底碰撞。
    const paintPerfStart=PERF_DEBUG_ACTIVE?performance.now():0;
    for(let i=projectiles.length-1;i>=0;i--){
      const p=projectiles[i];
      if(p.dead||p.firepower<=0){pushTrailSegment(p);releaseProjectile(i);continue;}

      const hit=getProjectileInteractiveHit(p,p.prevX,p.prevY,p.x,p.y);
      const endX=hit?hit.x:p.x,endY=hit?hit.y:p.y;
      let paintResult=null;
      // 与可交互对象碰撞时立即补算路径，避免低频领土刷新导致穿透后再染色。
      const foreignTerritoryContact=!paintNow&&!hit&&projectileTouchesForeignTerritory(p,endX,endY);
      if(paintNow||hit||foreignTerritoryContact){
        paintResult=paintProjectilePath(p,p.paintX,p.paintY,endX,endY);
        p.paintX=paintResult.x;p.paintY=paintResult.y;
      }

      if(paintResult&&paintResult.exhausted){
        p.x=paintResult.x;p.y=paintResult.y;
        pushTrailSegment(p);releaseProjectile(i);continue;
      }

      if(hit){
        p.x=hit.x;p.y=hit.y;pushTrailSegment(p);
        const remove=resolveProjectileInteractiveHit(p,hit);
        if(remove)releaseProjectile(i);
        continue;
      }

      if(paintNow){p.paintX=p.x;p.paintY=p.y;}
      pushTrailSegment(p);
    }
    if(PERF_DEBUG_ACTIVE)perfWarPaintMs+=performance.now()-paintPerfStart;
    trailUpdateCarry+=dt;
    if(trailUpdateCarry>=TRAIL_UPDATE_STEP){const trailDt=trailUpdateCarry;trailUpdateCarry%=TRAIL_UPDATE_STEP;renderTrailBatch(trailDt);}

    for(let i=beams.length-1;i>=0;i--){beams[i].life-=dt;if(beams[i].life<=0){const last=beams.pop();if(i<beams.length)beams[i]=last;}}
    effectUpdateCarry+=dt;
    if(effectUpdateCarry>=EFFECT_UPDATE_STEP){
      const effectDt=effectUpdateCarry;effectUpdateCarry%=EFFECT_UPDATE_STEP;
      for(let i=pulses.length-1;i>=0;i--){
        const p=pulses[i];
        p.age=(p.age||0)+effectDt;
        p.life-=effectDt*(p.decay||1.7);
        const fxFlags=p.fxFlags||0;
        if(fxFlags&FX_FLAG_SPARK){
          p.x+=p.vx*effectDt;p.y+=p.vy*effectDt;
          const drag=Math.exp(-effectDt*(p.drag||4));p.vx*=drag;p.vy*=drag;
        }else if(fxFlags&FX_FLAG_EXPANDING){
          const initial=p.initialLife||1,progress=Math.max(0,Math.min(1,1-p.life/initial));

        }else if(Number.isFinite(p.r)&&Number.isFinite(p.max))p.r+=(p.max-p.r)*effectDt*7;
        if(p.life<=0){const last=pulses.pop();if(i<pulses.length)pulses[i]=last;}
      }
    }
    if(!territoryGpuActive){
      territoryColorCarry+=dt;
      if(territoryColorCarry>=TERRITORY_BRIGHTNESS_STEP){territoryColorCarry%=TERRITORY_BRIGHTNESS_STEP;updateTerritoryColors();}
    }
    if(territoryUploadCarry>=TERRITORY_UPLOAD_STEP){territoryUploadCarry%=TERRITORY_UPLOAD_STEP;flushTerritory();}
  }

  function drawMatchVideoFrame(){
    if(!matchVideoCtx||!matchRecordingPreset)return;
    const ctx=matchVideoCtx;
    const outputW=matchRecordingPreset.width,outputH=matchRecordingPreset.height;
    const leftW=outputH*(LV.w/LV.h),warW=outputH*(WV.w/WV.h);
    const outerCrop=Math.max(0,(leftW+warW-outputW)/2);
    const leftX=-outerCrop,warX=leftX+leftW-.5;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalAlpha=1;ctx.globalCompositeOperation='copy';ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
    ctx.drawImage(leftCanvas,leftX,0,leftW,outputH);
    ctx.globalCompositeOperation='source-over';
    const battleSource=gpuBattleActive&&gpuBattle?.ready?gpuBattle.canvas:warCanvas;
    ctx.drawImage(battleSource,warX,0,warW+.5,outputH);
    if(gpuBattleActive&&gpuBattle?.ready&&gpuBattle.uiCanvas)ctx.drawImage(gpuBattle.uiCanvas,warX,0,warW+.5,outputH);
    ctx.setTransform(1,0,0,1,0,0);
  }

      matchRecordingPreset=preset;matchRecordingMime=mimeType;matchRecordingWriter=writer;

      matchRecordingFinalReason='手动结束';matchRecordingLastFrame=0;
      drawMatchVideoFrame();
      const stream=matchVideoCanvas.captureStream(preset.fps);

      updateMatchRecordingControls();

    }catch(error){
      matchRecordingPreparing=false;
      if(error?.name==='AbortError'){
        matchRecordingStatusText='已取消';updateMatchRecordingControls();return;
      }
      console.error('录像启动失败：',error);
      matchRecordingStatusText='启动失败';updateMatchRecordingControls();log(`录像启动失败：${error.message||error}`);
      try{if(writer)await writer.abort();}catch{}
    }
  }

  function compressPowerHistory(){
    // 保留第一个点和最新点，对中间历史点进行均匀降采样；时间轴仍从 0 秒开始。
    for(let f=0;f<4;f++){
      const series=powerHistory[f];
      if(series.length<=POWER_HISTORY_MAX_POINTS)continue;
      const compact=[series[0]];
      for(let i=2;i<series.length-1;i+=2)compact.push(series[i]);
      const lastPoint=series[series.length-1];
      if(compact[compact.length-1]!==lastPoint)compact.push(lastPoint);
      series.splice(0,series.length,...compact);
    }
  }
  function syncPowerHistory(){

        powerHistory[f].push({t,v:finiteChartValue(getFactionCumulativeFirepower(f))});
      }

    }else if(powerHistory[0].length){
      for(let f=0;f<4;f++){

  function getLogTicks(maxValue){
    const safeMax=finiteChartValue(maxValue);
    const maxDecade=Math.max(0,Math.min(308,Math.ceil(Math.log10(Math.max(1,safeMax)))));
    // 只绘制最多 7 组主刻度，避免超大火力时创建数百条标签或进入无限循环。
    const step=Math.max(1,Math.ceil(maxDecade/6));
    const ticks=[];
    for(let p=0;p<=maxDecade;p+=step)ticks.push(10**p);
    const top=10**maxDecade;
    if(ticks[ticks.length-1]!==top)ticks.push(top);
    return ticks;
  }
  function drawPowerChart(){
    if(powerChartMetrics.dirty||powerChartMetrics.width<=0||powerChartMetrics.height<=0){
      const rect=powerChartCanvas.getBoundingClientRect();
      powerChartMetrics.dpr=Math.min(1.5,window.devicePixelRatio||1);
      powerChartMetrics.width=Math.max(1,Math.round(rect.width*powerChartMetrics.dpr));
      powerChartMetrics.height=Math.max(1,Math.round(rect.height*powerChartMetrics.dpr));
      powerChartMetrics.dirty=false;
    }
    const dpr=powerChartMetrics.dpr,width=powerChartMetrics.width,height=powerChartMetrics.height;
    if(powerChartCanvas.width!==width||powerChartCanvas.height!==height){powerChartCanvas.width=width; powerChartCanvas.height=height;}
    pctx.setTransform(1,0,0,1,0,0); pctx.clearRect(0,0,width,height);
    const m={l:50*dpr,r:14*dpr,t:12*dpr,b:24*dpr};
    const iw=Math.max(10,width-m.l-m.r), ih=Math.max(10,height-m.t-m.b);
    // background grid
    pctx.strokeStyle='rgba(66,130,183,.18)'; pctx.lineWidth=1;
    pctx.beginPath(); pctx.rect(m.l,m.t,iw,ih); pctx.stroke();
    const maxVal=finiteChartValue(Math.max(1,...Array.from({length:4},(_,f)=>getFactionCumulativeFirepower(f))));
    const ticks=getLogTicks(maxVal);
    const logMax=Math.max(1,Math.log10(Math.max(1,maxVal)));
    const yFor=v=>{
      const safe=finiteChartValue(v);
      return m.t+ih-(Math.log10(Math.max(1,safe))/logMax)*ih;
    };
    pctx.font=`${10*dpr}px monospace`; pctx.textAlign='right'; pctx.textBaseline='middle';
    for(const tick of ticks){
      const y=yFor(tick);
      pctx.strokeStyle='rgba(74,120,168,.14)'; pctx.beginPath(); pctx.moveTo(m.l,y); pctx.lineTo(m.l+iw,y); pctx.stroke();
      pctx.fillStyle='rgba(180,216,240,.70)'; pctx.fillText(formatNum(tick),m.l-6*dpr,y);
    }
    // v72：0–30 秒保持固定横轴；超过 30 秒后将从 0 秒至当前时间的全部历史压缩进同一宽度。
    const axisStart=0;
    const axisEnd=Math.max(30,simulationElapsed);
    const axisSpan=axisEnd;
    const xFor=t=>m.l+Math.max(0,Math.min(1,t/axisSpan))*iw;
    pctx.textBaseline='top';
    const timeTicks=[0,axisSpan*.5,axisEnd];
    timeTicks.forEach((tick,index)=>{
      const x=xFor(tick);
      pctx.strokeStyle='rgba(74,120,168,.12)'; pctx.beginPath(); pctx.moveTo(x,m.t); pctx.lineTo(x,m.t+ih); pctx.stroke();
      pctx.fillStyle='rgba(164,200,225,.62)';
      pctx.textAlign=index===0?'left':index===timeTicks.length-1?'right':'center';
      const labelX=index===0?x+3*dpr:index===timeTicks.length-1?x-3*dpr:x;
      pctx.fillText(formatChartTime(tick),labelX,m.t+ih+6*dpr);
    });
    for(let f=0;f<4;f++){
      const series=powerHistory[f];
      if(series.length<1)continue;
      pctx.strokeStyle=FACTIONS[f].color; pctx.lineWidth=(selectedFaction===f?2.6:1.5)*dpr; pctx.globalAlpha=selectedFaction===f?1:.8;
      pctx.shadowColor=FACTIONS[f].color; pctx.shadowBlur=(selectedFaction===f?7:3)*dpr;
      pctx.beginPath();
      series.forEach((pt,i)=>{const x=xFor(pt.t), y=yFor(pt.v||1); if(i===0)pctx.moveTo(x,y); else pctx.lineTo(x,y);});
      pctx.stroke();
      pctx.shadowBlur=0;
      const lastPt=series[series.length-1]; const lx=xFor(lastPt.t), ly=yFor(lastPt.v||1);
      pctx.fillStyle=FACTIONS[f].color; pctx.beginPath(); pctx.arc(lx,ly,(selectedFaction===f?3.6:2.6)*dpr,0,Math.PI*2); pctx.fill();
    }
    pctx.globalAlpha=1;
    pctx.save(); pctx.translate(12*dpr,m.t+ih*.5); pctx.rotate(-Math.PI/2);
    pctx.fillStyle='rgba(183,221,243,.66)'; pctx.font=`700 ${10*dpr}px monospace`; pctx.textAlign='center'; pctx.textBaseline='bottom'; pctx.fillText('CUMULATIVE FIREPOWER (LOG)',0,0); pctx.restore();
  }

  function roundedRectPath(ctx,x,y,w,h,r){
    const radius=Math.max(0,Math.min(r,w*.5,h*.5));
    ctx.beginPath();
    ctx.moveTo(x+radius,y);
    ctx.lineTo(x+w-radius,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+radius);
    ctx.lineTo(x+w,y+h-radius);
    ctx.quadraticCurveTo(x+w,y+h,x+w-radius,y+h);
    ctx.lineTo(x+radius,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-radius);
    ctx.lineTo(x,y+radius);
    ctx.quadraticCurveTo(x,y,x+radius,y);
    ctx.closePath();
  }

  function drawBaseValueIcon(ctx,type,x,y,color,flash=0){
    ctx.save();
    if(flash>0){
      const glow=ctx.createRadialGradient(x,y,0,x,y,12);
      glow.addColorStop(0,colorWithAlpha('#ffffff',.28*flash));
      glow.addColorStop(.46,colorWithAlpha(color,.18*flash));
      glow.addColorStop(1,colorWithAlpha(color,0));
      ctx.fillStyle=glow;ctx.beginPath();ctx.arc(x,y,12,0,TAU);ctx.fill();
    }
    ctx.strokeStyle=flash>0?mixHexColors(color,'#ffffff',.82):mixHexColors(color,'#dff8ff',.58);
    ctx.fillStyle=colorWithAlpha(color,.08+.12*flash);
    ctx.lineWidth=1.05+flash*.55;ctx.lineJoin='round';ctx.lineCap='round';ctx.shadowColor=color;ctx.shadowBlur=2+flash*5;
    if(type==='shield'){
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const angle=-Math.PI/2+i*TAU/6,px=x+Math.cos(angle)*6,py=y+Math.sin(angle)*6;
        if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      }
      ctx.closePath();ctx.fill();ctx.stroke();
      ctx.globalAlpha=.78;ctx.lineWidth=.85;
      ctx.beginPath();ctx.arc(x,y,3.05,-Math.PI*.72,Math.PI*.72);ctx.stroke();
      ctx.fillStyle=flash>0?'#ffffff':mixHexColors(color,'#ffffff',.54);
      ctx.beginPath();ctx.arc(x,y,1.15,0,TAU);ctx.fill();
    }else{
      roundedRectPath(ctx,x-6,y-6,12,12,1.8);ctx.fill();ctx.stroke();
      ctx.globalAlpha=.86;ctx.lineWidth=.85;
      for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(x+i*2.65,y-3.9);ctx.lineTo(x+i*2.65,y+3.9);ctx.stroke();}
      ctx.globalAlpha=.94;ctx.beginPath();ctx.moveTo(x-4.5,y+6.2);ctx.lineTo(x+4.5,y+6.2);ctx.stroke();
    }
    ctx.restore();
  }

  function drawBaseValueRow(ctx,type,value,y,color,flash,fontSize){
    const actualFontSize=fontSize+flash*1.45;
    const font=`800 ${actualFontSize}px "Bahnschrift SemiCondensed","Microsoft YaHei",sans-serif`;
    ctx.save();ctx.font=font;
    // 两行共用同一组图标列和数值右边界，避免护盾/机枪数值长度不同导致图标左右跳动。
    const iconWidth=13,gap=5,textWidth=ctx.measureText(value).width,valueSlotWidth=Math.max(54,textWidth+4);
    const groupWidth=iconWidth+gap+valueSlotWidth,startX=90-groupWidth*.5,valueRight=startX+iconWidth+gap+valueSlotWidth;
    const panelX=startX-7,panelW=groupWidth+14;
    const panel=ctx.createLinearGradient(panelX,y,panelX+panelW,y);
    panel.addColorStop(0,'rgba(1,8,18,.36)');
    panel.addColorStop(.35,colorWithAlpha(color,.045+.08*flash));
    panel.addColorStop(1,'rgba(1,8,18,.24)');
    ctx.fillStyle=panel;roundedRectPath(ctx,panelX,y-10,panelW,20,5);ctx.fill();
    ctx.globalAlpha=.28+.42*flash;ctx.strokeStyle=flash>0?mixHexColors(color,'#ffffff',.58):colorWithAlpha(color,.54);
    ctx.lineWidth=.65+flash*.55;roundedRectPath(ctx,panelX,y-10,panelW,20,5);ctx.stroke();
    ctx.globalAlpha=.26+.44*flash;ctx.strokeStyle=flash>0?'#ffffff':color;
    ctx.beginPath();ctx.moveTo(panelX+7,y+9.5);ctx.lineTo(panelX+panelW-7,y+9.5);ctx.stroke();
    ctx.restore();

    drawBaseValueIcon(ctx,type,startX+iconWidth*.5,y,color,flash);
    const fill=flash>0?mixHexColors(color,'#ffffff',.72+.22*flash):'#edfaff';
    drawText(ctx,value,valueRight,y+.25,{
      fillStyle:fill,
      font,
      align:'right',
      baseline:'middle',
      shadowColor:flash>0?color:'rgba(13,64,92,.48)',
      shadowBlur:flash>0?3+flash*6:1.5
    });
  }

  function drawRotorPegTrails(){
    // v192：拖尾只来自外圈真实碰撞点的历史位置，中心固定点不产生光丝。
    lctx.save();
    lctx.globalCompositeOperation='lighter';
    lctx.lineCap='round';lctx.lineJoin='round';
    for(const pegs of [upperPegs,lowerPegs]){
      for(const peg of pegs){
        const trail=peg.trail;
        if(peg.isCenter||!trail||trail.length<2)continue;
        for(let i=0;i<trail.length-1;i++){
          const point=trail[i],next=trail[i+1];
          const fade=Math.max(0,Math.min(1,1-point.age/TUNING.collision.rotorTrailDuration));
          const segmentFade=fade*.48+.03;
          lctx.globalAlpha=segmentFade;
          lctx.strokeStyle='#62cfe4';
          lctx.lineWidth=.45+1.65*fade;
          lctx.shadowColor='rgba(57,204,255,.45)';
          lctx.shadowBlur=.8+2.4*fade;
          lctx.beginPath();lctx.moveTo(point.x,point.y);lctx.lineTo(next.x,next.y);lctx.stroke();
        }
      }
    }
    lctx.restore();
  }

      drawText(lctx,cell.type.toUpperCase(),cell.x+cell.w/2,cell.bottom-13,{fillStyle:'rgba(240,249,252,.94)',font:'800 10px monospace',align:'center'});

    // v213：去掉挡板侧面厚度与斜接脚装饰，仅保留主体玻璃面、斜切顶和必要高光。

      lctx.fillStyle=faceGrad;lctx.strokeStyle='rgba(194,246,255,.84)';lctx.lineWidth=1;
      lctx.beginPath();
      lctx.moveTo(frontLeft,top+bevel);
      lctx.lineTo(frontLeft+3,top);
      lctx.lineTo(frontRight-3,top);
      lctx.lineTo(frontRight,top+bevel);

      lctx.save();

      lctx.globalCompositeOperation='lighter';lctx.globalAlpha=.55;lctx.shadowColor='rgba(80,218,255,.82)';lctx.shadowBlur=4;lctx.strokeStyle='rgba(146,238,255,.82)';lctx.lineWidth=1.15;
      lctx.beginPath();lctx.moveTo(frontLeft+4,top+10);lctx.lineTo(frontLeft+4,bottom-5);lctx.moveTo(frontLeft+8,top+7);lctx.lineTo(frontLeft+8,bottom-5);lctx.stroke();

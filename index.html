      lctx.restore();
    };
    const drawGlassBaseRail=()=>{
      const left=PLAYFIELD.left-2,right=PLAYFIELD.right+2,top=railY-5,bottom=railY+6;
      lctx.save();
      lctx.globalAlpha=1;lctx.globalCompositeOperation='source-over';lctx.shadowColor='rgba(57,212,245,.52)';lctx.shadowBlur=9;
      const railGrad=lctx.createLinearGradient(0,top,0,bottom);
      railGrad.addColorStop(0,'rgba(72,177,204,.76)');railGrad.addColorStop(.26,'rgba(19,78,108,.86)');railGrad.addColorStop(.7,'rgba(9,38,67,.94)');railGrad.addColorStop(1,'rgba(18,73,100,.82)');
      lctx.fillStyle=railGrad;lctx.strokeStyle='rgba(107,224,244,.78)';lctx.lineWidth=.9;
      lctx.beginPath();lctx.moveTo(left,top+2);lctx.lineTo(right,top+2);lctx.lineTo(right-10,bottom);lctx.lineTo(left+10,bottom);lctx.closePath();lctx.fill();lctx.stroke();
      lctx.globalCompositeOperation='lighter';lctx.globalAlpha=.92;lctx.shadowColor='rgba(74,224,255,.84)';lctx.shadowBlur=5;lctx.strokeStyle='rgba(157,244,255,.88)';lctx.lineWidth=1.35;
      lctx.beginPath();lctx.moveTo(left+2,top+1.5);lctx.lineTo(right-2,top+1.5);lctx.stroke();
      lctx.globalAlpha=.45;lctx.shadowBlur=2;lctx.strokeStyle='rgba(60,176,213,.76)';lctx.lineWidth=.8;
      lctx.beginPath();lctx.moveTo(left+8,bottom-2);lctx.lineTo(right-8,bottom-2);lctx.stroke();

    // 先画连续底轨，再把所有侧边立柱压入底轨，形成参考图中的统一结构。

    for(const cell of converterCells){

      lctx.beginPath();lctx.arc(p.x,p.y,p.r,0,TAU);lctx.stroke();lctx.restore();

    for(const b of balls){

        lctx.globalAlpha=a*.18;lctx.fillStyle=FACTIONS[b.faction].color;lctx.shadowColor=FACTIONS[b.faction].color;lctx.shadowBlur=7;
        lctx.beginPath();lctx.arc(b.trailX[index],b.trailY[index],Math.max(1.5,b.r*.48*a),0,TAU);lctx.fill();
      }

      lctx.fillStyle='rgba(1,7,17,.96)';lctx.strokeStyle=FACTIONS[b.faction].color;lctx.lineWidth=2.4;
      // v121：绘制半径与物理碰撞半径严格一致，消除视觉上的隔空碰撞。
      lctx.beginPath();lctx.arc(b.x,b.y,b.r,0,TAU);lctx.fill();lctx.stroke();
      lctx.restore();
      drawBallValueLabel(b);
    }

  }
  const EFFECT_BATCH_COLORS=[FACTIONS[0].color,FACTIONS[1].color,FACTIONS[2].color,FACTIONS[3].color,'#ffffff'];
  function drawSparkBatch(color){
    let count=0,alphaSum=0;wctx.beginPath();
    for(const p of pulses){
      if((p.type!=='shieldSpark'&&p.type!=='annihilationSpark')||p.color!==color)continue;
      const fade=Math.max(0,p.life/(p.initialLife||1));
      const len=(2.2+(p.size||1)*1.85)*(0.65+fade*.35);
      const dirX=p.dirX!==undefined?p.dirX:(p.vx/(Math.hypot(p.vx,p.vy)||1));
      const dirY=p.dirY!==undefined?p.dirY:(p.vy/(Math.hypot(p.vx,p.vy)||1));
      wctx.moveTo(p.x,p.y);wctx.lineTo(p.x-dirX*len,p.y-dirY*len);count++;alphaSum+=fade*fade;
    }
    if(!count)return;
    const meanFade=Math.min(1,alphaSum/count);
    wctx.strokeStyle=color;
    wctx.globalAlpha=.07*meanFade;wctx.lineWidth=2.35;wctx.stroke();
    wctx.globalAlpha=.72*meanFade;wctx.lineWidth=.92;wctx.stroke();
  }
  function drawWarEffects(){
    wctx.save();wctx.globalCompositeOperation='lighter';wctx.lineCap='round';wctx.lineJoin='round';
    for(const color of EFFECT_BATCH_COLORS)drawSparkBatch(color);
    for(const p of pulses){
      if(p.type==='shieldSpark'||p.type==='annihilationSpark')continue;
      const life=Math.max(0,p.life/(p.initialLife||1));
      const progress=1-life,coreFade=life*life*life;
      if(p.type==='shieldHit'){
        // 仅点亮命中附近的一小段护盾弧，避免整圈泛白。
        const arcWidth=.10+.18*progress;
        wctx.strokeStyle=p.color;wctx.lineWidth=3.2+2.6*life;wctx.globalAlpha=life*.10;wctx.beginPath();wctx.arc(p.cx,p.cy,p.shieldRadius,p.angle-arcWidth,p.angle+arcWidth);wctx.stroke();
        wctx.globalAlpha=.62*life;wctx.lineWidth=1.15+1.35*life;wctx.stroke();
        wctx.strokeStyle=p.sourceColor;wctx.globalAlpha=.78*life;wctx.lineWidth=.9+1.1*life;wctx.beginPath();wctx.arc(p.x,p.y,p.r,0,TAU);wctx.stroke();
        // 快速消失的白色核心与短十字切口，视觉更锐利但影响范围更小。
        const coreR=.9+2.8*coreFade;
        wctx.fillStyle='#ffffff';wctx.globalAlpha=.82*coreFade;wctx.beginPath();wctx.arc(p.x,p.y,coreR,0,TAU);wctx.fill();
        const tick=2.8+3.2*life;wctx.strokeStyle=p.sourceColor;wctx.globalAlpha=.52*coreFade;wctx.lineWidth=.8;
        wctx.beginPath();wctx.moveTo(p.x-tick,p.y);wctx.lineTo(p.x+tick,p.y);wctx.moveTo(p.x,p.y-tick);wctx.lineTo(p.x,p.y+tick);wctx.stroke();
      }else if(p.type==='orbEnemyHit'){
        const orb=p.targetOrb,targetAlive=orb&&orb.id===p.targetId&&orb.kind==='orb'&&!orb.dead;
        const cx=targetAlive?orb.x:p.edgeX,cy=targetAlive?orb.y:p.edgeY;
        const radius=targetAlive?orb.r:(p.targetRadius||8),angle=p.angle||0;
        const impactX=targetAlive?cx+Math.cos(angle)*radius:p.edgeX;
        const impactY=targetAlive?cy+Math.sin(angle)*radius:p.edgeY;
        const arcWidth=.07+.18*progress;
        // 两道贴合大球真实边缘的切向弧，明确表达敌弹在球壳上的接触点。
        wctx.strokeStyle=p.sourceColor;wctx.globalAlpha=.42*life;wctx.lineWidth=6.2+2.8*life;
        wctx.beginPath();wctx.arc(cx,cy,radius*1.012,angle-arcWidth,angle+arcWidth);wctx.stroke();
        wctx.strokeStyle='#ffffff';wctx.globalAlpha=.94*Math.max(coreFade,life*.42);wctx.lineWidth=1.35+1.8*life;
        wctx.beginPath();wctx.arc(cx,cy,radius*1.006,angle-arcWidth*.72,angle+arcWidth*.72);wctx.stroke();
        wctx.strokeStyle=p.color;wctx.globalAlpha=.78*life;wctx.lineWidth=1+1.35*life;
        wctx.beginPath();wctx.arc(cx,cy,radius*.965,angle-arcWidth*.92,angle+arcWidth*.92);wctx.stroke();
        const nx=Math.cos(angle),ny=Math.sin(angle),tangentX=-ny,tangentY=nx;
        const flare=4+7*life;
        wctx.strokeStyle=p.sourceColor;wctx.globalAlpha=.88*Math.max(coreFade,life*.48);wctx.lineWidth=1.05;
        wctx.beginPath();
        wctx.moveTo(impactX+nx*flare,impactY+ny*flare);wctx.lineTo(impactX-nx*flare*.52,impactY-ny*flare*.52);
        wctx.moveTo(impactX-tangentX*flare*.45,impactY-tangentY*flare*.45);wctx.lineTo(impactX+tangentX*flare*.45,impactY+tangentY*flare*.45);
        wctx.stroke();
        wctx.globalAlpha=.92*Math.max(coreFade,life*.45);wctx.fillStyle='#ffffff';wctx.beginPath();wctx.arc(impactX,impactY,1.4+2.8*Math.max(coreFade,life*.35),0,TAU);wctx.fill();
        wctx.globalAlpha=.68*life;wctx.strokeStyle=p.sourceColor;wctx.lineWidth=1;
        wctx.beginPath();wctx.arc(impactX,impactY,Math.max(1,p.r),0,TAU);wctx.stroke();
      }else if(p.type==='annihilation'){
        // 两个阵营颜色组成紧凑的断裂环，外层仅保留极低透明度轮廓。
        wctx.lineWidth=3.2+2.1*life;wctx.globalAlpha=.08*life;
        wctx.strokeStyle=p.colorA;wctx.beginPath();wctx.arc(p.x,p.y,p.r,0,Math.PI);wctx.stroke();
        wctx.strokeStyle=p.colorB;wctx.beginPath();wctx.arc(p.x,p.y,p.r,Math.PI,TAU);wctx.stroke();
        wctx.globalAlpha=.72*life;wctx.lineWidth=1.05+1.45*life;
        wctx.strokeStyle=p.colorA;wctx.beginPath();wctx.arc(p.x,p.y,p.r,0,Math.PI);wctx.stroke();
        wctx.strokeStyle=p.colorB;wctx.beginPath();wctx.arc(p.x,p.y,p.r,Math.PI,TAU);wctx.stroke();
        const coreR=.85+2.6*coreFade;
        wctx.fillStyle='#ffffff';wctx.globalAlpha=.86*coreFade;wctx.beginPath();wctx.arc(p.x,p.y,coreR,0,TAU);wctx.fill();
        const spoke=2.4+4*life;wctx.globalAlpha=.42*coreFade;wctx.lineWidth=.75;
        wctx.strokeStyle=p.colorA;wctx.beginPath();wctx.moveTo(p.x-spoke,p.y-spoke);wctx.lineTo(p.x+spoke,p.y+spoke);wctx.stroke();
        wctx.strokeStyle=p.colorB;wctx.beginPath();wctx.moveTo(p.x-spoke,p.y+spoke);wctx.lineTo(p.x+spoke,p.y-spoke);wctx.stroke();
      }else if(p.type==='impact'||p.type==='baseHit'||p.type==='projectileHit'){
        wctx.globalAlpha=.72*life;wctx.strokeStyle=p.color;wctx.lineWidth=p.type==='baseHit'?1.1:p.type==='projectileHit'?.9:1.25;
        wctx.beginPath();wctx.arc(p.x,p.y,p.r,0,TAU);wctx.stroke();
        wctx.globalAlpha=.10*life*life;wctx.fillStyle=p.color;wctx.beginPath();wctx.arc(p.x,p.y,p.r*.38,0,TAU);wctx.fill();
      }
    }
    wctx.restore();
  }

  function drawOrbAbsorptionTrails(ctx=wctx,effects=pulses){
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';ctx.lineJoin='round';
    for(const effect of effects){
      if(effect.type!=='orbAbsorb')continue;
      const life=Math.max(0,effect.life/(effect.initialLife||1));
      const progress=1-life;
      const orb=effect.targetOrb;
      const targetAlive=orb&&orb.id===effect.targetId&&orb.kind==='orb'&&!orb.dead;
      const tx=targetAlive?orb.x:effect.entryX,ty=targetAlive?orb.y:effect.entryY;
      const targetR=targetAlive?orb.r:(effect.targetRadius||8);
      const entryRadius=Math.max(2,targetR*.98);
      const entryAngle=effect.entryAngle||0,orbitSign=effect.orbitSign||1;
      const head=Math.min(1,progress*1.06);
      const tail=Math.max(0,head-(.16+.07*(1-head)));
      const samplePosition=u=>{
        // 径向速度在接近中心时显著增加，角速度也随 u² 加快，形成天体捕获式螺旋坠落。
        const radius=entryRadius*Math.sqrt(Math.max(0,1-u));
        const angle=entryAngle+orbitSign*TAU*(.64*u+1.38*u*u);
        return {x:tx+Math.cos(angle)*radius,y:ty+Math.sin(angle)*radius};
      };
      const traceSegment=(offset=0)=>{
        ctx.beginPath();
        for(let i=0;i<=12;i++){
          const u=Math.max(0,Math.min(1,tail+(head-tail)*(i/12)-offset));
          const point=samplePosition(u);
          if(i===0)ctx.moveTo(point.x,point.y);else ctx.lineTo(point.x,point.y);
        }
      };
      const traceCapturePath=()=>{
        ctx.beginPath();
        for(let i=0;i<=24;i++){
          const point=samplePosition(head*(i/24));
          if(i===0)ctx.moveTo(point.x,point.y);else ctx.lineTo(point.x,point.y);
        }
      };
      traceCapturePath();ctx.strokeStyle=effect.color;ctx.globalAlpha=.16+.16*life;ctx.lineWidth=4.4;ctx.stroke();
      traceCapturePath();ctx.strokeStyle=effect.lightColor;ctx.globalAlpha=.22+.22*life;ctx.lineWidth=.72;ctx.stroke();
      traceSegment(.018);ctx.strokeStyle=effect.color;ctx.globalAlpha=.18+.16*life;ctx.lineWidth=7.5;ctx.stroke();
      traceSegment();ctx.strokeStyle=effect.lightColor;ctx.globalAlpha=.46+.42*Math.sin(Math.PI*Math.min(1,progress*1.1));ctx.lineWidth=1.35;ctx.stroke();
      for(let i=0;i<5;i++){
        const u=tail+(head-tail)*((i+1)/6),point=samplePosition(u);
        ctx.globalAlpha=(.16+i*.12)*life;ctx.fillStyle=i===4?'#ffffff':effect.lightColor;
        ctx.beginPath();ctx.arc(point.x,point.y,.72+i*.16,0,TAU);ctx.fill();
      }
      const headPoint=samplePosition(head),hx=headPoint.x,hy=headPoint.y;
      const headGlowRadius=5.5+Math.min(5,targetR*.025);
      const headGlow=ctx.createRadialGradient(hx,hy,0,hx,hy,headGlowRadius);
      headGlow.addColorStop(0,'rgba(255,255,255,.96)');
      headGlow.addColorStop(.32,colorWithAlpha(effect.lightColor,.78));
      headGlow.addColorStop(1,colorWithAlpha(effect.color,0));
      ctx.globalAlpha=Math.min(1,.52+life*.6);ctx.fillStyle=headGlow;ctx.beginPath();ctx.arc(hx,hy,headGlowRadius,0,TAU);ctx.fill();
      const bulletCore=Math.max(.75,Math.min(2.2,(effect.bulletRadius||3)*.22));
      ctx.globalAlpha=.96;ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(hx,hy,bulletCore,0,TAU);ctx.fill();
      if(head>.72){
        const collapse=Math.min(1,(head-.72)/.28);
        const ringR=targetR*(.48-collapse*.39);
        ctx.globalAlpha=(1-collapse)*.66;ctx.strokeStyle=effect.lightColor;ctx.lineWidth=1.15+life*1.25;
        ctx.beginPath();ctx.arc(tx,ty,Math.max(2.5,ringR),0,TAU);ctx.stroke();
        ctx.globalAlpha=.7*Math.sin(Math.PI*collapse);ctx.fillStyle='#ffffff';
        ctx.beginPath();ctx.arc(tx,ty,1.4+3.2*Math.sin(Math.PI*collapse),0,TAU);ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawSniperReticle(x,y,color,scale,locked,alpha,pulse,ctx=wctx){
    const light=locked?'#ffffff':mixHexColors(color,'#ffffff',.78);
    const inner=scale*.34,ring=scale*.78,outer=scale*1.18,arm=scale*.16;
    // 准星保持屏幕坐标的静态朝向；锁定动效只通过透明度/脉冲表达，避免旋转干扰目标识别。
    ctx.save();ctx.translate(x,y);ctx.globalAlpha=alpha;ctx.lineCap='square';ctx.lineJoin='miter';
    // 参考准星的四段内环：每个象限留出明显断口。
    ctx.strokeStyle=color;ctx.lineWidth=(locked?1.5:1.0)*SNIPER_LOCK_STROKE_SCALE;ctx.beginPath();
    for(let i=0;i<4;i++){
      const start=i*Math.PI/2+.14,end=(i+1)*Math.PI/2-.14;
      ctx.moveTo(Math.cos(start)*ring,Math.sin(start)*ring);ctx.arc(0,0,ring,start,end);
    }
    ctx.stroke();
    // 四向长臂与端部横档，复刻 SVG 瞄准器的十字结构。
    ctx.strokeStyle=light;ctx.lineWidth=(locked?1.7:1.15)*SNIPER_LOCK_STROKE_SCALE;
    for(let i=0;i<4;i++){
      const a=i*Math.PI/2,cos=Math.cos(a),sin=Math.sin(a),tx=cos*outer,ty=sin*outer;
      ctx.beginPath();ctx.moveTo(cos*inner,sin*inner);ctx.lineTo(tx,ty);ctx.stroke();
      const px=-sin,py=cos;
      ctx.lineWidth=(locked?2.2:1.45)*SNIPER_LOCK_STROKE_SCALE;ctx.beginPath();ctx.moveTo(tx-px*arm,ty-py*arm);ctx.lineTo(tx+px*arm,ty+py*arm);ctx.stroke();
    }
    ctx.strokeStyle=color;ctx.lineWidth=(locked?1.4:.9)*SNIPER_LOCK_STROKE_SCALE;ctx.beginPath();ctx.arc(0,0,inner,0,TAU);ctx.stroke();
    ctx.globalAlpha=locked?1:alpha*(.26+.24*pulse);ctx.strokeStyle=light;ctx.lineWidth=(locked?3.2:2.2)*SNIPER_LOCK_STROKE_SCALE;ctx.beginPath();ctx.arc(0,0,outer*1.08,0,TAU);ctx.stroke();
    ctx.globalAlpha=locked?1:alpha*.78;ctx.fillStyle=light;ctx.beginPath();ctx.arc(0,0,Math.max(2.2,scale*.07),0,TAU);ctx.fill();
    ctx.restore();
  }

  let videoRenderTimelineSeconds=null;
  function getVisualTimeSeconds(){return videoRenderTimelineSeconds===null?performance.now()/1000:videoRenderTimelineSeconds;}

  function drawSniperTargeting(ctx=wctx){
    if(sniperAimJobs.length===0)return;
    const now=getVisualTimeSeconds();
    // 该函数在战场所有元素绘制完成后调用，使用 source-over 让锁定层真正覆盖在画布顶层。
    ctx.save();ctx.globalCompositeOperation='source-over';ctx.lineCap='round';ctx.lineJoin='round';ctx.textAlign='center';ctx.textBaseline='middle';
    for(const job of sniperAimJobs){
      const targetFaction=job.phase==='locked'?job.selectedTargetFaction:job.currentTargetFaction;
      if(targetFaction<0||eliminated[targetFaction])continue;
      const source=FACTIONS[job.faction],target=FACTIONS[targetFaction];
      const sx=source.base[0]*WV.w,sy=source.base[1]*WV.h,tx=target.base[0]*WV.w,ty=target.base[1]*WV.h;
      const pulse=.5+.5*Math.sin(now*8.5+job.id*.7),locked=job.phase==='locked';
      const candidates=getSniperTargetCandidates(job.faction);
      for(const candidate of candidates){
        const bx=FACTIONS[candidate].base[0]*WV.w,by=FACTIONS[candidate].base[1]*WV.h;
        const isCurrent=candidate===targetFaction,candidateAlpha=isCurrent?(locked?1:.58):.14;
        const candidateScale=isCurrent?BASE_OUTER_RADIUS+18+pulse*5:BASE_OUTER_RADIUS*.78;
        // 锁定效果统一使用发射阵营色，避免候选目标颜色让准星归属产生歧义。
        drawSniperReticle(bx,by,source.color,candidateScale,isCurrent&&locked,candidateAlpha,pulse,ctx);
      }
      ctx.globalAlpha=locked?1:.15;ctx.strokeStyle=source.color;ctx.lineWidth=(locked?1.7:1)*SNIPER_LOCK_STROKE_SCALE;
      ctx.setLineDash(locked?[]:[5,10]);ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(tx,ty);ctx.stroke();ctx.setLineDash([]);
      const ring=BASE_OUTER_RADIUS+32+pulse*5;
      const remaining=locked?Math.max(0,SNIPER_LOCK_DELAY_SECONDS-job.lockElapsed):Math.max(0,job.duration-job.elapsed);
      ctx.globalAlpha=locked?1:.88;ctx.fillStyle=locked?'#ffffff':source.color;ctx.font='700 10px monospace';
      ctx.fillText(locked?`LOCKED ${remaining.toFixed(1)}s`:`SCAN ${remaining.toFixed(1)}s`,tx,ty-ring-10);
      ctx.globalAlpha=locked?1:.52;ctx.fillStyle=target.color;ctx.font='700 9px monospace';
      ctx.fillText(`${source.name} → ${target.name}`,tx,ty+ring+11);
    }
    ctx.restore();
  }

  function prepareProjectileRenderFrame(){
    renderOrbProjectiles.length=0;renderOtherProjectiles.length=0;renderSniperProjectiles.length=0;renderMachineProjectiles.length=0;
    for(let f=0;f<FACTIONS.length;f++){renderOtherProjectilesByFaction[f].length=0;renderMachineProjectilesByFaction[f].length=0;}
    for(const p of projectiles){
      if(p.kind==='orb'){
        renderOrbProjectiles.push(p);
        continue;
      }
      if(p.kind==='sniper'){
        renderSniperProjectiles.push(p);
        continue;
      }
      if(p.kind!=='machine'){
        renderOtherProjectiles.push(p);renderOtherProjectilesByFaction[p.faction].push(p);
        continue;
      }
      const speed=Math.hypot(p.vx,p.vy)||1,ux=p.vx/speed,uy=p.vy/speed;
      const longLength=54+(p.id%11)*6,shortLength=longLength*.25;
      p.renderTailLongX=p.x-ux*longLength;p.renderTailLongY=p.y-uy*longLength;
      p.renderTailShortX=p.x-ux*shortLength;p.renderTailShortY=p.y-uy*shortLength;
      renderMachineProjectiles.push(p);renderMachineProjectilesByFaction[p.faction].push(p);
    }
  }

    const drawOrbProjectile=(orb,ctx=wctx,visualTime=t)=>{

      for(let i=0;i<moteCount;i++){

    for(let f=0;f<FACTIONS.length;f++){

    wctx.save();wctx.globalCompositeOperation='source-over';wctx.textAlign='center';wctx.textBaseline='middle';wctx.lineJoin='round';
    for(const p of renderOrbProjectiles){

  function completeMonochromeVictory(faction){

  function updateMonochromeVictory(dt){
    if(gameEnded||PERF_STRESS_CONFIG.noWin)return;
    let fullFaction=-1;
    for(let faction=0;faction<FACTIONS.length;faction++){
      if(territoryCounts[faction]===owner.length){fullFaction=faction;break;}
    }
    if(fullFaction<0){
      monochromeFaction=-1;monochromeHoldSeconds=0;return;
    }
    if(monochromeFaction!==fullFaction){
      monochromeFaction=fullFaction;monochromeHoldSeconds=0;
      log(`${FACTIONS[fullFaction].name}已占领全部领土，连续保持 ${MONOCHROME_WIN_SECONDS} 秒即可获胜。`,fullFaction);
    }
    monochromeHoldSeconds=Math.min(MONOCHROME_WIN_SECONDS,monochromeHoldSeconds+dt);
    if(monochromeHoldSeconds>=MONOCHROME_WIN_SECONDS-1e-9)completeMonochromeVictory(fullFaction);
  }

  let perfSimMs=0,perfBallsMs=0,perfWarSimMs=0,perfWarMoveMs=0,perfWarPairMs=0,perfWarPaintMs=0,perfWarMs=0,perfLeftMs=0,perfFrameSamples=0,perfBallSteps=0,perfSimSteps=0,perfRenderSamples=0;
  let perfTerritoryPaintMs=0,perfTerritoryUploadMs=0,perfProjectileBroadphaseMs=0,perfProjectileResolveMs=0,perfTrailUpdateMs=0,perfSniperTrailMs=0;
  let perfRenderPrepareMs=0,perfRenderMachineMs=0,perfRenderSniperMs=0,perfRenderOrbMs=0,perfRenderEffectsMs=0;
  let perfTerritoryPaintSamples=0,perfTerritoryUploadSamples=0,perfTrailSamples=0;
   const perfCounters={
     territoryUploadRects:0,territoryUploadPixels:0,ownerUploadRects:0,ownerUploadPixels:0,tickUploadRects:0,tickUploadPixels:0,
     impactMaskHits:0,impactMaskMisses:0,projectilePairCandidates:0,projectilePairResolved:0,
     sniperTrailSegments:0,projectilePeakCount:0,spawnQueuePeak:0,spawnQueueRejected:0,spawnQueueDroppedOldest:0
   };
  let perfTiming={
    simMsPerFrame:0,ballsMsPerStep:0,warSimMsPerStep:0,warMoveMsPerStep:0,warPairMsPerStep:0,warPaintMsPerStep:0,
    territoryPaintMs:0,territoryUploadMs:0,projectileBroadphaseMs:0,projectileResolveMs:0,trailMs:0,sniperTrailMs:0,
    renderPrepareMs:0,renderMachineMs:0,renderSniperMs:0,orbRenderMs:0,renderEffectsMs:0,warMsPerRender:0,leftMsPerRender:0
  };
  window.__perfDebug=()=>({
    displayFps,projectiles:gpuBattleActive?gpuActiveProjectileEstimate:projectiles.length,projectilePool:projectilePool.length,balls:balls.length,effects:pulses.length,gpuBattle:gpuBattle?.info?.()||null,
    droppedSimulationTime,simAccumulator,territoryGpuActive,territoryGpuBackend,territoryGpuRenderer,
    renderCacheSizes:{leftStatic:[leftStaticCanvas.width,leftStaticCanvas.height],leftSemiStatic:[leftSemiStaticCanvas.width,leftSemiStaticCanvas.height],battleStatic:[battleStaticCanvas.width,battleStaticCanvas.height]},
    territoryDirtyTiles:territoryGpuActive?dirtyOwnerTileCount+dirtyTickTileCount:dirtyTerritoryColorTileCount,
    territoryOwnerDirtyTiles:dirtyOwnerTileCount,territoryTickDirtyTiles:dirtyTickTileCount,
    ...perfTiming,...perfCounters,projectilePoolSize:projectilePool.length
  });
  window.__perfReset=()=>{
    for(const key of Object.keys(perfCounters))perfCounters[key]=0;
    perfCounters.projectilePeakCount=gpuBattleActive?gpuActiveProjectileEstimate:projectiles.length;
  };
  function simulateStep(dt){
    territoryRefreshStepId=(territoryRefreshStepId+1)>>>0;
    if(territoryRefreshStepId===0){territoryRefreshStamp.fill(0);territoryRefreshStepId=1;}
    simulationElapsed+=dt;
    updateConverterLayout(simulationElapsed);
    const ballsPerfStart=PERF_DEBUG_ACTIVE?performance.now():0;
    updateBalls(dt*MATRIX_SIMULATION_SPEED_SCALE);
    if(PERF_DEBUG_ACTIVE){perfBallsMs+=performance.now()-ballsPerfStart;perfBallSteps++;}
    warSimulationCarry+=dt;
    if(warSimulationCarry>=WAR_SIM_STEP){
      const warDt=warSimulationCarry;
      warSimulationCarry%=WAR_SIM_STEP;
      const warSimPerfStart=PERF_DEBUG_ACTIVE?performance.now():0;
      updateWar(warDt);
      if(PERF_DEBUG_ACTIVE){perfWarSimMs+=performance.now()-warSimPerfStart;perfSimSteps++;}
    }
    updateMonochromeVictory(dt);
    hudTextCarry+=dt;
    if(hudTextCarry>=HUD_TEXT_STEP){hudTextCarry%=HUD_TEXT_STEP;updateBaseTextCaches();}
  }
  function frame(now){
    const elapsed=Math.min(.1,(now-last)/1000);last=now;
    if(matchVideoRenderActive){requestAnimationFrame(frame);return;}
    const simPerfStart=PERF_DEBUG_ACTIVE?performance.now():0;
    if(!paused){
      simAccumulator+=elapsed*speed;
      let steps=0;
      // v73：随模拟倍率动态增加每帧可执行步数，确保高倍速不是只改变滑杆数值。
      const maxSimSteps=IS_MOBILE_DEVICE?Math.min(24,Math.max(8,Math.ceil(speed*1.6))):Math.min(48,Math.max(12,Math.ceil(speed*2.5)));
      // Hidden tabs can be throttled to ~1 rAF/s. Submitting a full 12+ step
      // catch-up burst can trip the Windows GPU watchdog under stress. This
      // limits only hidden-tab burst size; visible 120 Hz simulation is unchanged.
      const frameStepBudget=document.hidden?Math.min(2,maxSimSteps):maxSimSteps;
      while(simAccumulator>=SIM_STEP&&steps<frameStepBudget&&!paused){simulateStep(SIM_STEP);simAccumulator-=SIM_STEP;steps++;}
      if(steps===frameStepBudget&&simAccumulator>SIM_STEP*4){
        const retained=SIM_STEP*4;
        droppedSimulationTime+=simAccumulator-retained;
        simAccumulator=retained;
      }
    }else simAccumulator=0;
    if(PERF_DEBUG_ACTIVE){perfSimMs+=performance.now()-simPerfStart;perfFrameSamples++;}
    const renderInterval=1000/PERF_PROFILE.renderHz,leftRenderInterval=1000/PERF_PROFILE.leftRenderHz;
    renderAccumulatorMs+=elapsed*1000;leftRenderAccumulatorMs+=elapsed*1000;
    if(renderAccumulatorMs>=renderInterval){
      renderAccumulatorMs%=renderInterval;
      if(leftRenderAccumulatorMs>=leftRenderInterval){
        leftRenderAccumulatorMs%=leftRenderInterval;
        const leftPerfStart=PERF_DEBUG_ACTIVE?performance.now():0;
        drawLeft();
        if(PERF_DEBUG_ACTIVE)perfLeftMs+=performance.now()-leftPerfStart;
      }
      const warPerfStart=PERF_DEBUG_ACTIVE?performance.now():0;
      drawWar();fpsFrames++;
      if(PERF_DEBUG_ACTIVE){perfWarMs+=performance.now()-warPerfStart;perfRenderSamples++;}
      updateMatchVideoCompositor(now);
    }
    if(now-fpsWindowStart>=500){
      displayFps=Math.round(fpsFrames*1000/(now-fpsWindowStart));fpsFrames=0;fpsWindowStart=now;
      if(PERF_DEBUG_ACTIVE){
        perfTiming={
          simMsPerFrame:perfSimMs/Math.max(1,perfFrameSamples),
          ballsMsPerStep:perfBallsMs/Math.max(1,perfBallSteps),
          warSimMsPerStep:perfWarSimMs/Math.max(1,perfSimSteps),
          warMoveMsPerStep:perfWarMoveMs/Math.max(1,perfSimSteps),
          warPairMsPerStep:perfWarPairMs/Math.max(1,perfSimSteps),
          warPaintMsPerStep:perfWarPaintMs/Math.max(1,perfSimSteps),
          territoryPaintMs:perfTerritoryPaintMs/Math.max(1,perfTerritoryPaintSamples),
          territoryUploadMs:perfTerritoryUploadMs/Math.max(1,perfTerritoryUploadSamples),
          projectileBroadphaseMs:perfProjectileBroadphaseMs/Math.max(1,perfSimSteps),
          projectileResolveMs:perfProjectileResolveMs/Math.max(1,perfSimSteps),
          trailMs:perfTrailUpdateMs/Math.max(1,perfTrailSamples),
          sniperTrailMs:perfSniperTrailMs/Math.max(1,perfTrailSamples),
          renderPrepareMs:perfRenderPrepareMs/Math.max(1,perfRenderSamples),
          renderMachineMs:perfRenderMachineMs/Math.max(1,perfRenderSamples),
          renderSniperMs:perfRenderSniperMs/Math.max(1,perfRenderSamples),
          orbRenderMs:perfRenderOrbMs/Math.max(1,perfRenderSamples),
          renderEffectsMs:perfRenderEffectsMs/Math.max(1,perfRenderSamples),
          warMsPerRender:perfWarMs/Math.max(1,perfRenderSamples),
          leftMsPerRender:perfLeftMs/Math.max(1,perfRenderSamples)
        };
        perfSimMs=perfBallsMs=perfWarSimMs=perfWarMoveMs=perfWarPairMs=perfWarPaintMs=perfWarMs=perfLeftMs=0;perfFrameSamples=perfBallSteps=perfSimSteps=perfRenderSamples=0;
        perfTerritoryPaintMs=perfTerritoryUploadMs=perfProjectileBroadphaseMs=perfProjectileResolveMs=perfTrailUpdateMs=perfSniperTrailMs=0;
        perfRenderPrepareMs=perfRenderMachineMs=perfRenderSniperMs=perfRenderOrbMs=perfRenderEffectsMs=0;
        perfTerritoryPaintSamples=perfTerritoryUploadSamples=perfTrailSamples=0;
      }
    }
    if(!bootFrameCompleted){bootFrameCompleted=true;if(bootNotice)bootNotice.classList.add('hidden');}
    requestAnimationFrame(frame);
  }

  function resetGameState(){
    globalStartValueMultiplier=1;simulationElapsed=0;paused=false;simAccumulator=0;warSimulationCarry=0;droppedSimulationTime=0;
    renderAccumulatorMs=0;leftRenderAccumulatorMs=0;gameEnded=false;winnerFaction=-1;monochromeFaction=-1;monochromeHoldSeconds=0;
    for(const key of Object.keys(perfCounters))perfCounters[key]=0;
  }

  function resetFactionState(){
    for(let i=0;i<FACTIONS.length;i++){
      STOCK_KEYS.forEach(key=>stocks[i][key]=0);
      shieldValue[i]=INITIAL_SHIELD_VALUE;shieldFlash[i]=0;shieldGainFlash[i]=0;machineGainFlash[i]=0;eliminated[i]=false;eliminationFlash[i]=0;
      shieldRecoilX[i]=shieldRecoilY[i]=shieldRecoilVX[i]=shieldRecoilVY[i]=0;
      powerHistory[i].length=0;powerHistory[i].push({t:0,v:1});
    }
    lastPowerHistoryTime=0;
  }

  function resetMatrixState(){
    balls.length=0;resetTopHitCounts();buildPegRotors();initializeFixedBallPool();
  }

  function resetBattleState(){
    machineFirepowerPool.fill(INITIAL_MACHINE_FIREPOWER);machineShotIndex.fill(0);
    for(const group of machineVisualGroups){group.rounds=0;group.damage=0;group.sin=0;group.cos=0;group.speed=0;group.count=0;group.seed=0;}
    for(let i=0;i<FACTIONS.length;i++){cannonAngle[i]=INITIAL_CANNON_ANGLES[i];cannonStepCarry[i]=0;}
    sniperAimJobs.length=0;nextSniperAimId=1;
  }

  function resetProjectileState(){
    while(projectiles.length){const p=projectiles.pop();p.orbShieldContacts=0;projectilePool.push(p);}
    fireQueue.length=0;previousOrbPairContacts.clear();currentOrbPairContacts.clear();
    for(const index of activeProjectileBuckets)projectileCollisionBuckets[index].length=0;
    for(const index of activeOrbProjectileBuckets)projectileOrbCollisionBuckets[index].length=0;
    activeProjectileBuckets.length=0;activeOrbProjectileBuckets.length=0;renderOrbProjectiles.length=0;renderOtherProjectiles.length=0;renderSniperProjectiles.length=0;renderMachineProjectiles.length=0;
    for(let f=0;f<FACTIONS.length;f++){renderOtherProjectilesByFaction[f].length=0;renderMachineProjectilesByFaction[f].length=0;}
  }

  function resetEffectsState(){
    beams.length=0;pulses.length=0;frameTrailSegments.length=0;sniperTrailSegments.length=0;
    trailUpdateCarry=0;effectUpdateCarry=0;hudTextCarry=HUD_TEXT_STEP;
    trailCtx.clearRect(0,0,trailCanvas.width,trailCanvas.height);combinedTrailCtx.clearRect(0,0,combinedTrailCanvas.width,combinedTrailCanvas.height);clearSniperTrailLayers();
  }

  function rebuildRequiredCaches(){updateConverterLayout(0);}

  function updateUIAfterReset(){
    if(UI.pauseBtn){UI.pauseBtn.disabled=false;UI.pauseBtn.textContent='暂停';}
    if(UI.feed)UI.feed.innerHTML='';
    updateBaseTextCaches();
    log(`战场已重置：运行时间不设上限；任一阵营连续占领全部领土 ${MONOCHROME_WIN_SECONDS} 秒后结束本局。`);
    updateStocks();updateStats();
  }

  function resetGame(){
    resetGameState();resetFactionState();resetMatrixState();resetTerritoryState();resetBattleState();resetProjectileState();resetEffectsState();
    if(gpuBattleActive&&gpuBattle?.ready)gpuBattle.resetFromCpu();
    rebuildRequiredCaches();updateUIAfterReset();
  }

  UI.factionButtons.forEach(btn=>btn.addEventListener('click',()=>{UI.factionButtons.forEach(b=>b.classList.remove('active'));btn.classList.add('active');selectedFaction=Number(btn.dataset.faction);updateStocks();updateStats();}));
  UI.weaponButtons.forEach(btn=>btn.addEventListener('click',()=>{UI.weaponButtons.forEach(b=>b.classList.remove('active'));btn.classList.add('active');selectedWeapon=btn.dataset.weapon;}));
  if(UI.launchBtn)UI.launchBtn.addEventListener('click',relaunchSelectedFaction);
  document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','BUTTON','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();relaunchSelectedFaction();}});
  if(UI.offsetRange&&UI.offsetText)UI.offsetRange.addEventListener('input',e=>UI.offsetText.textContent=e.target.value+'%');
  if(UI.driftRange&&UI.driftText)UI.driftRange.addEventListener('input',e=>UI.driftText.textContent=e.target.value);
  const speedRange=UI.speedRange,speedText=UI.speedText;
  function updateSpeedControl(){if(!speedRange||!speedText)return;speed=Number(speedRange.value);speedText.textContent=speed.toFixed(2)+'×';}
  if(speedRange)speedRange.addEventListener('input',updateSpeedControl);
  updateSpeedControl();
  if(UI.profileBadge)UI.profileBadge.textContent=PERF_PROFILE.name;
  if(UI.pauseBtn)UI.pauseBtn.addEventListener('click',e=>{if(gameEnded)return;paused=!paused;e.target.textContent=paused?'继续':'暂停';updateStats();});
  if(UI.recordGameBtn)UI.recordGameBtn.addEventListener('click',startMatchRecording);
  if(UI.stopRecordBtn)UI.stopRecordBtn.addEventListener('click',()=>stopMatchRecording('手动结束'));
  document.addEventListener('visibilitychange',()=>{last=performance.now();simAccumulator=0;renderAccumulatorMs=0;leftRenderAccumulatorMs=0;if(!document.hidden)updateStats();});
  if(UI.resetBtn)UI.resetBtn.addEventListener('click',()=>{
    if(matchRecorder&&matchRecorder.state!=='inactive')stopMatchRecording('用户重置');
    resetGame();
  });
  async function bootGame(){
    await initTerritoryRenderer();
    resetTerritoryState();resetMatrixState();resetBattleState();updateBaseTextCaches();updateTerritoryRendererBadge();
    await initGpuBattle();if(gpuBattleActive&&gpuBattle?.ready){gpuBattle.resetFromCpu();runPerfGpuSelfTests();}
    for(let f=0;f<4;f++)if(powerHistory[f].length===0)powerHistory[f].push({t:0,v:1});
    lastPowerHistoryTime=0;
    updateStocks();updateStats();void preflightHqRendererDependency();
    log(`${BUILD_INFO.name} v${BUILD_INFO.version} ready · ${PERF_PROFILE.name} · ${territoryGpuBackend+' territory'}`);
    setInterval(updateStats,250);requestAnimationFrame(frame);
    if(AUTO_RECORD_AT_LOAD){
      if(UI.videoResolution&&VIDEO_RENDER_REQUEST.startsWith('2160'))UI.videoResolution.value='2160';
      if(speedRange){speedRange.value='1';updateSpeedControl();}
      setTimeout(()=>startMatchRecording(),1200);
    }
  }
  void bootGame().catch(error=>{
    console.error('游戏启动失败：',error);
    activateTerritoryCpuFallback('GPU 渲染器启动异常');
    resetTerritoryState();resetMatrixState();resetBattleState();updateBaseTextCaches();updateTerritoryRendererBadge();
    updateStocks();updateStats();setInterval(updateStats,250);requestAnimationFrame(frame);
  });
})();
</script>
</body>

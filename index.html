<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Pixel Territory War v216-webgpu</title>
  <style>
    :root{
      --text:#f4fbff;
      --muted:#7e9bb7;
      --cyan:#19dfff;
      --blue:#3487ff;
      --violet:#8a48ff;
      --magenta:#ff36dd;
      --danger:#ff465f;
      --panel:#050b18;
      --line:rgba(65,157,255,.36);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;color:var(--text);font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;background:#01040c}
    body{
      padding:14px;
      overflow-x:hidden;
      background:
        radial-gradient(circle at 8% 4%,rgba(26,100,255,.18),transparent 29%),
        radial-gradient(circle at 92% 8%,rgba(255,34,182,.12),transparent 31%),
        radial-gradient(circle at 50% 110%,rgba(33,220,255,.08),transparent 40%),
        linear-gradient(180deg,#030818 0%,#01040b 56%,#000207 100%);
    }
    body::before{
      content:"";position:fixed;inset:0;pointer-events:none;z-index:20;opacity:.38;
      background:
        repeating-linear-gradient(0deg,rgba(255,255,255,.017) 0,rgba(255,255,255,.017) 1px,transparent 1px,transparent 4px),
        linear-gradient(90deg,transparent 0 49.9%,rgba(23,217,255,.025) 50%,transparent 50.1%);
      mix-blend-mode:screen;
    }
    body::after{
      content:"";position:fixed;inset:0;pointer-events:none;z-index:19;
      background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.58) 100%);
    }
    button,input,select{font:inherit}
    button{-webkit-tap-highlight-color:transparent}
    .app{max-width:1800px;margin:auto;position:relative;z-index:1}
    .topbar{
      display:flex;gap:16px;align-items:center;justify-content:space-between;
      min-height:66px;padding:11px 18px;margin-bottom:12px;position:relative;isolation:isolate;
      border:1px solid rgba(50,155,255,.52);
      background:linear-gradient(180deg,rgba(8,20,43,.96),rgba(3,8,20,.97));
      clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,28px 100%,0 calc(100% - 28px));
      box-shadow:0 0 28px rgba(28,102,255,.18),inset 0 0 38px rgba(27,143,255,.09);
    }
    .topbar::before{
      content:"";position:absolute;left:0;right:0;top:0;height:2px;z-index:-1;
      background:linear-gradient(90deg,#16d9ff 0 22%,#8254ff 37%,transparent 51%,#ff39d4 75%,#ff405b 100%);
      box-shadow:0 0 14px currentColor;
    }
    .topbar::after{
      content:"";position:absolute;left:78px;right:24px;bottom:7px;height:1px;opacity:.46;
      background:repeating-linear-gradient(90deg,#19dfff 0 22px,transparent 22px 31px);
    }
    .title{display:flex;gap:14px;align-items:center;min-width:0}
    .logo{
      width:39px;height:39px;display:grid;place-items:center;transform:rotate(45deg);
      border:1px solid #22e7ff;background:rgba(8,39,72,.72);
      box-shadow:0 0 18px rgba(25,223,255,.48),inset 0 0 15px rgba(25,223,255,.18);
    }
    .logo span{transform:rotate(-45deg);font-weight:900;color:#e9fdff;text-shadow:0 0 10px #16dfff}
    h1{font-size:21px;margin:0;letter-spacing:.11em;text-shadow:0 0 14px rgba(75,199,255,.35)}
    .subtitle{font-size:11px;color:#7d9bb8;margin-top:4px;letter-spacing:.08em}
    .toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .toolbar label{font-size:11px;color:#8ca8c1;letter-spacing:.05em}
    .top-counters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:-2px 0 12px}
    .counter-card{padding:9px 12px;border:1px solid rgba(50,145,226,.42);background:linear-gradient(180deg,rgba(6,16,34,.92),rgba(3,9,22,.96));box-shadow:0 0 18px rgba(20,100,220,.08),inset 0 0 18px rgba(30,120,220,.07);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));}
    .counter-title{font-size:11px;color:#8eb9d7;letter-spacing:.12em;margin-bottom:6px}
    .counter-row{display:flex;flex-wrap:wrap;gap:6px 8px}
    .counter-chip{padding:3px 7px;border:1px solid rgba(58,116,165,.72);border-radius:1px;background:rgba(6,17,33,.72);font:700 11px/1.2 monospace;color:#eaf8ff;clip-path:polygon(0 0,calc(100% - 5px) 0,100% 5px,100% 100%,5px 100%,0 calc(100% - 5px))}
    .settled-size-chart{display:grid;gap:4px;min-width:0}
    .settled-chart-meta{display:flex;align-items:baseline;justify-content:space-between;gap:8px;color:#8fb3c9;font:10px/1 monospace;letter-spacing:.06em}
    .settled-chart-total{color:#dff8ff;font-weight:800;text-shadow:0 0 8px rgba(28,224,255,.24)}
    .settled-chart-total b{font-size:14px;color:#fff;margin-left:4px}
    .settled-chart-note{color:#55dfff;opacity:.78}
    .settled-chart-plot{height:47px;display:grid;grid-template-columns:repeat(77,minmax(1px,1fr));align-items:end;gap:1px;padding:5px 2px 0;border-bottom:1px solid rgba(47,153,207,.46);background:linear-gradient(180deg,rgba(14,77,108,.15),rgba(3,14,28,.34));position:relative}
    .settled-chart-plot::before{content:"";position:absolute;inset:0 0 1px;background:repeating-linear-gradient(to top,transparent 0 13px,rgba(104,199,230,.09) 13px 14px);pointer-events:none}
    .settled-chart-bar{position:relative;z-index:1;display:block;min-width:1px;height:var(--bar-height);min-height:2px;background:linear-gradient(180deg,#dffeff 0%,#27dfff 26%,#1679e8 100%);border:1px solid rgba(115,239,255,.68);border-bottom:0;box-shadow:0 0 7px rgba(27,216,255,.35);transition:height .22s ease,filter .18s ease}
    .settled-chart-bar.is-empty{opacity:.24;box-shadow:none}
    .settled-chart-bar:hover{filter:brightness(1.45);box-shadow:0 0 11px rgba(102,239,255,.72)}
    .settled-chart-axis{display:flex;justify-content:space-between;gap:4px;color:#7396ae;font:9px/1 monospace;white-space:nowrap}
    .settled-chart-empty{position:absolute;inset:0;display:grid;place-items:center;color:#7093a9;font:10px/1 monospace;letter-spacing:.08em;pointer-events:none}
    .btn,.faction-btn,.weapon-btn{
      color:#eafbff;cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .2s,background .2s;
    }
    .btn{
      border:1px solid rgba(63,129,190,.75);background:linear-gradient(180deg,rgba(13,35,61,.96),rgba(5,16,31,.96));
      padding:8px 13px;border-radius:2px;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));
    }
    .btn:hover{border-color:var(--cyan);box-shadow:0 0 16px rgba(25,223,255,.24);transform:translateY(-1px)}
    .btn.primary{background:linear-gradient(180deg,#116b94,#073858);border-color:#35e6ff;box-shadow:inset 0 0 18px rgba(37,215,255,.22),0 0 12px rgba(37,215,255,.13)}
    .btn.danger{border-color:#8a3045;color:#ffd1d7;background:linear-gradient(180deg,rgba(72,18,34,.75),rgba(28,7,17,.82))}
    .btn:disabled{cursor:not-allowed;opacity:.38;filter:saturate(.45);transform:none;box-shadow:none}
    .speed{width:116px;accent-color:#1bdfff}
    .record-controls{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid rgba(43,119,174,.52);background:rgba(2,12,25,.72);clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px))}
    .record-controls select{height:30px;padding:0 25px 0 8px;color:#dff8ff;border:1px solid rgba(65,139,194,.72);border-radius:1px;outline:none;background:#071a2d;color-scheme:dark}
    .record-controls select:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(25,223,255,.28)}
    .record-controls .btn{padding:7px 10px;font-size:10px;white-space:nowrap}
    .record-controls .record-start{border-color:#18c9e8;color:#e9fdff}
    .record-status{min-width:72px;text-align:center;white-space:nowrap}
    .record-status.recording{color:#fff0f3;border-color:#ff5069;background:rgba(63,10,24,.82);box-shadow:0 0 12px rgba(255,62,88,.25)}
    .stage-169{--stage-pad:124px;width:min(100%,1680px,calc((100vh - var(--stage-pad))*16/9));aspect-ratio:16/9;margin:0 auto}.layout{display:grid;grid-template-columns:minmax(0,43fr) minmax(0,57fr);gap:12px;align-items:stretch;height:100%}
    .panel{
      min-width:0;padding:10px;position:relative;isolation:isolate;display:flex;flex-direction:column;height:100%;
      border:1px solid rgba(47,131,226,.54);background:linear-gradient(180deg,rgba(6,15,33,.975),rgba(2,6,16,.985));
      clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% calc(100% - 24px),calc(100% - 24px) 100%,24px 100%,0 calc(100% - 24px));
      box-shadow:0 0 26px rgba(31,84,180,.15),inset 0 0 44px rgba(27,111,206,.075);
    }
    .panel::before{
      content:"";position:absolute;z-index:-1;inset:0;pointer-events:none;
      background:
        linear-gradient(90deg,var(--panel-accent,#1edfff),transparent 22%) top left/52% 2px no-repeat,
        linear-gradient(90deg,transparent,var(--panel-accent-2,#a64dff)) top right/52% 2px no-repeat,
        linear-gradient(180deg,var(--panel-accent,#1edfff),transparent 24%) top left/2px 55% no-repeat,
        linear-gradient(0deg,var(--panel-accent-2,#a64dff),transparent 24%) bottom right/2px 55% no-repeat;
      filter:drop-shadow(0 0 7px var(--panel-accent,#1edfff));opacity:.86;
    }
    .panel::after{content:"";position:absolute;inset:5px;pointer-events:none;border:1px solid rgba(64,146,229,.16);clip-path:inherit;z-index:5}
    .panel-left{--panel-accent:#20dfff;--panel-accent-2:#9a45ff}
    .panel-war{--panel-accent:#28f4a2;--panel-accent-2:#ff3559}
    .panel-head{display:flex;justify-content:space-between;align-items:center;padding:3px 7px 10px;position:relative;z-index:6;min-height:38px}
    .panel-title{font-weight:800;letter-spacing:.11em;display:flex;align-items:center;gap:10px;text-shadow:0 0 12px rgba(72,196,255,.28)}
    .panel-title::before{content:"";width:9px;height:9px;border:1px solid var(--panel-accent,#20dfff);transform:rotate(45deg);box-shadow:0 0 9px var(--panel-accent,#20dfff)}
    .panel-title::after{content:"///";font-size:14px;letter-spacing:2px;color:var(--panel-accent,#20dfff);opacity:.82}
    .panel-note{font-size:11px;color:#718ca6;letter-spacing:.035em;text-align:right}
    .matrix-panel-head{display:grid;grid-template-columns:1fr;gap:8px;align-items:start;min-height:74px;padding:3px 7px 9px}
    .matrix-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
    .matrix-panel-head .panel-title{white-space:nowrap;font-family:"Bahnschrift Condensed","Microsoft YaHei",sans-serif}
    .panel-index{flex:0 0 auto;font:700 9px/1 monospace;letter-spacing:.16em;color:#76a9c7;padding:4px 7px;border:1px solid rgba(66,160,219,.34);background:rgba(8,25,43,.72);clip-path:polygon(0 0,calc(100% - 5px) 0,100% 5px,100% 100%,5px 100%,0 calc(100% - 5px))}
    .matrix-rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;min-width:0}
    .matrix-rule{min-width:0;display:flex;align-items:center;gap:6px;padding:5px 7px;border:1px solid rgba(62,132,183,.32);background:linear-gradient(90deg,rgba(18,73,106,.22),rgba(4,17,32,.78));font:700 9px/1.15 "Microsoft YaHei",sans-serif;letter-spacing:.04em;color:#9fc2d8;white-space:nowrap;overflow:hidden}
    .matrix-rule b{flex:0 0 auto;color:#25e3ff;font:800 8px/1 monospace;letter-spacing:.08em}
    .canvas-wrap{
      position:relative;border:1px solid rgba(42,112,178,.56);background:#010611;overflow:hidden;min-height:0;
      box-shadow:inset 0 0 48px rgba(15,83,160,.20),0 0 12px rgba(19,102,208,.08);
      clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));
    }
    .canvas-wrap::before{
      content:"";position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.24;
      background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(142,216,255,.042) 3px 4px);
      mix-blend-mode:screen;
    }
    .canvas-wrap::after{
      content:"";position:absolute;inset:5px;z-index:4;pointer-events:none;
      background:
        linear-gradient(#23dcff,#23dcff) left top/30px 1px no-repeat,
        linear-gradient(#23dcff,#23dcff) left top/1px 30px no-repeat,
        linear-gradient(#ff42d7,#ff42d7) right top/30px 1px no-repeat,
        linear-gradient(#ff42d7,#ff42d7) right top/1px 30px no-repeat,
        linear-gradient(#794cff,#794cff) left bottom/30px 1px no-repeat,
        linear-gradient(#794cff,#794cff) left bottom/1px 30px no-repeat,
        linear-gradient(#27e9ff,#27e9ff) right bottom/30px 1px no-repeat,
        linear-gradient(#27e9ff,#27e9ff) right bottom/1px 30px no-repeat;
      filter:drop-shadow(0 0 5px #24dfff);opacity:.8;
    }
    .canvas-code{position:absolute;right:13px;top:9px;z-index:5;pointer-events:none;color:rgba(153,220,255,.62);font:700 9px/1 monospace;letter-spacing:.13em;text-shadow:0 0 8px #27dfff}
    canvas{display:block}
    #leftCanvas{width:100%;height:100%;aspect-ratio:1.02/1}
    .generator-wrap{flex:1 1 auto; min-height:0}
    .generator-wrap .canvas-code{display:none}
    #warCanvas{width:auto;height:100%;max-width:100%;aspect-ratio:1/1;margin:0 auto}
    .war-wrap{flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center}
    .core-label{
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;
      padding:4px 11px;border:1px solid rgba(128,223,255,.2);background:rgba(2,8,18,.34);
      font:700 9px/1 monospace;letter-spacing:.25em;color:rgba(227,249,255,.65);text-shadow:0 0 10px #fff;
      clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);
    }
    .controls{display:grid;gap:10px;margin-top:10px;position:relative;z-index:6;flex:0 0 auto;align-content:start}
    .row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
    .group-label{font-size:11px;color:#7894ae;min-width:58px;letter-spacing:.08em}
    .faction-btn,.weapon-btn{border:1px solid rgba(49,87,125,.85);background:linear-gradient(180deg,rgba(8,24,42,.94),rgba(3,12,24,.98));position:relative;overflow:hidden}
    .faction-btn{padding:8px 11px;border-radius:2px;clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px))}
    .faction-btn::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px;box-shadow:0 0 9px var(--c)}
    .faction-btn.active{border-color:var(--c);box-shadow:inset 0 0 15px color-mix(in srgb,var(--c) 20%,transparent),0 0 10px color-mix(in srgb,var(--c) 18%,transparent)}
    .faction-btn.eliminated{opacity:.34;filter:grayscale(.9);text-decoration:line-through}
    .weapon-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
    .weapon-btn{min-width:0;padding:10px 5px 9px;text-align:center;border-radius:2px;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px))}
    .weapon-btn::before{content:"";position:absolute;left:15%;right:15%;top:0;height:1px;background:linear-gradient(90deg,transparent,#32dcff,transparent);opacity:.6}
    .weapon-btn:hover{border-color:#3cdcff;box-shadow:inset 0 0 19px rgba(32,194,255,.12);transform:translateY(-1px)}
    .weapon-btn.active{border-color:#e844ff;background:linear-gradient(180deg,rgba(64,19,88,.82),rgba(8,19,39,.98));box-shadow:inset 0 0 21px rgba(210,54,255,.18),0 0 14px rgba(209,41,255,.18)}
    .weapon-icon{display:block;font-size:22px;margin-bottom:5px;color:#eafcff;text-shadow:0 0 13px #24dfff}
    .weapon-btn.active .weapon-icon{text-shadow:0 0 14px #ef44ff;color:#fff}
    .weapon-name{font-size:12px;letter-spacing:.08em}
    .weapon-stock{font:10px/1.2 monospace;color:#7898b3;margin-top:5px}
    .launch-row{display:grid;grid-template-columns:1fr 1fr auto;gap:9px;align-items:end;padding:8px;border:1px solid rgba(41,90,139,.38);background:rgba(4,13,27,.64)}
    .field label{display:block;font-size:11px;color:#7f9cb5;margin-bottom:5px}
    .field input[type="range"]{width:100%;accent-color:#23dfff}
    .tip{padding:9px 11px;border-left:2px solid #25dfff;background:linear-gradient(90deg,rgba(29,190,255,.08),transparent);font-size:11px;line-height:1.55;color:#8eabc1}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px;position:relative;z-index:6;flex:0 0 auto}
    .stat{border:1px solid rgba(37,87,133,.62);background:linear-gradient(180deg,rgba(7,20,38,.95),rgba(3,9,19,.98));padding:8px 9px;position:relative;overflow:hidden;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
    .stat::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,var(--c),transparent 72%);box-shadow:0 0 9px var(--c)}
    .stat-head{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.08em;color:#8ea9be}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
    .stat-value{font:800 18px/1.1 monospace;margin-top:5px;color:#edfaff;text-shadow:0 0 10px color-mix(in srgb,var(--c) 35%,transparent)}
    .bar{height:3px;background:#0d2238;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c);width:25%;box-shadow:0 0 9px var(--c)}
    .feed{margin-top:9px;border:1px solid rgba(35,77,116,.56);background:rgba(2,8,17,.94);padding:8px 10px;height:96px;overflow:auto;font:11px/1.45 monospace;color:#7896ad;position:relative;z-index:6;box-shadow:inset 0 0 22px rgba(18,83,142,.08);flex:0 0 auto}
    .feed::before{content:"COMBAT LOG";position:sticky;top:0;display:block;padding-bottom:5px;margin-bottom:4px;color:#20dfff;font-size:9px;letter-spacing:.16em;background:rgba(2,8,17,.94)}
    .feed div{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.03)}
    .badge{padding:3px 7px;border:1px solid rgba(55,101,143,.7);border-radius:1px;font:10px/1.2 monospace;color:#9ab8cf;background:rgba(5,16,31,.62);clip-path:polygon(0 0,calc(100% - 5px) 0,100% 5px,100% 100%,5px 100%,0 calc(100% - 5px))}
    .badge.warning{color:#ffd6a1;border-color:rgba(255,152,76,.82);box-shadow:0 0 8px rgba(255,132,50,.18)}
    .data-strip{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;margin:10px 0 12px;position:relative;z-index:6}
    .data-strip-group{min-width:0;border:1px solid rgba(47,131,226,.40);background:linear-gradient(180deg,rgba(7,18,38,.92),rgba(3,9,20,.96));padding:8px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));box-shadow:0 0 16px rgba(24,93,194,.10),inset 0 0 20px rgba(27,111,206,.06)}
    .data-strip-title{font:700 10px/1 monospace;letter-spacing:.12em;color:#7fa8c5;margin-bottom:7px}
    .top-faction-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
    .top-weapon-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
    .data-strip .faction-btn{padding:7px 10px;font-size:12px}
    .data-strip .weapon-btn{padding:8px 6px 7px;min-height:70px}
    .data-strip .weapon-icon{font-size:18px;margin-bottom:4px}
    .data-strip .weapon-name{font-size:11px}
    .data-strip .weapon-stock{font-size:9px;margin-top:4px}
    .data-strip{grid-template-columns:1fr}
    .power-chart-group{display:grid;grid-template-rows:auto auto 1fr}
    .power-legend{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
    .chart-faction-btn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:88px;padding:7px 10px}
    .chart-faction-btn .faction-total{font:700 10px/1 monospace;color:#dff7ff;opacity:.96}
    .power-chart-wrap{position:relative;border:1px solid rgba(54,126,186,.42);background:linear-gradient(180deg,rgba(4,14,31,.92),rgba(2,8,20,.98));height:162px;overflow:hidden;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
    #powerChartCanvas{display:block;width:100%;height:100%}
    .boot-notice{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:9999;max-width:min(92vw,680px);padding:10px 14px;border:1px solid rgba(72,184,255,.65);background:rgba(2,10,22,.96);color:#dff7ff;font:700 12px/1.45 monospace;text-align:center;box-shadow:0 0 24px rgba(28,132,255,.22)}

    @media(max-width:1120px){.stage-169{width:min(100%,calc((100vh - var(--stage-pad))*16/9))}.canvas-wrap{min-height:0}.generator-wrap,.war-wrap{min-height:0}.panel-head:not(.matrix-panel-head) .panel-title::after{display:none}.panel-note{max-width:55%;line-height:1.35}}

    @media(max-width:720px){body{padding:6px}.topbar{padding:8px 9px;gap:8px;align-items:flex-start}.toolbar{display:flex;max-width:100%;gap:5px}.toolbar label{font-size:10px}.record-controls{width:100%;justify-content:flex-end;flex-wrap:wrap}.record-controls select{height:28px}.record-status{min-width:64px}.top-counters{grid-template-columns:1fr}.counter-card{padding:8px 10px}.counter-chip{font-size:10px;padding:3px 6px}.toolbar .speed{width:92px}.toolbar .btn{padding:6px 8px;font-size:11px}.data-strip{grid-template-columns:1fr}.top-weapon-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.power-chart-wrap{height:150px}.panel-head:not(.matrix-panel-head) .panel-note{display:none}.canvas-wrap{min-height:0}.generator-wrap,.war-wrap{min-height:0}h1{font-size:15px}.subtitle{display:none}.stage-169{--stage-pad:250px}.layout{gap:8px}.matrix-panel-head{min-height:70px}.matrix-rule{font-size:9px;padding-inline:6px}}

    /* v122 UI 自检第 1 轮：参考图的深海军蓝底色与高纯度青色结构光。仅改视觉属性。 */
    :root{
      --text:#eaf8ff;
      --muted:#7fa7bd;
      --cyan:#18e7ff;
      --blue:#197dff;
      --violet:#6074ff;
      --magenta:#ef4bc6;
      --danger:#ff6075;
      --panel:#020a16;
      --line:rgba(41,210,255,.34);

    body{
      background:
        radial-gradient(circle at 10% 2%,rgba(0,111,184,.19),transparent 31%),

        radial-gradient(circle at 52% 106%,rgba(0,218,255,.07),transparent 42%),

        repeating-linear-gradient(0deg,rgba(160,231,255,.014) 0,rgba(160,231,255,.014) 1px,transparent 1px,transparent 4px),

    .topbar,.counter-card,.data-strip-group,.panel{

    /* v122 UI 自检第 2 轮：强化标题、编号与规则信息层级，不改变文字尺寸和容器几何。 */

    .counter-title,.data-strip-title{

    }
    .counter-card,.data-strip-group{position:relative}
    .counter-card::before,.data-strip-group::before{

    .btn.danger{

    .faction-btn,.weapon-btn{

        linear-gradient(180deg,rgba(7,30,47,.96),rgba(1,13,26,.99));

    }
    .faction-btn::before{box-shadow:0 0 5px var(--c),0 0 12px color-mix(in srgb,var(--c) 56%,transparent)}
    .faction-btn.active{
      border-color:color-mix(in srgb,var(--c) 82%,#bff8ff);

      box-shadow:inset 2px 0 var(--c),inset 0 0 20px color-mix(in srgb,var(--c) 13%,transparent),0 0 12px color-mix(in srgb,var(--c) 15%,transparent);
    }
    .weapon-btn::before{
      background:linear-gradient(90deg,transparent,#2beaff 44%,#7d9dff 58%,transparent);
      opacity:.82;
      box-shadow:0 0 8px rgba(32,225,255,.42);
    }
    .weapon-btn:hover{
      border-color:#28eaff;
      background:linear-gradient(180deg,rgba(9,50,68,.96),rgba(1,17,31,.99));
      box-shadow:inset 0 0 22px rgba(24,215,255,.10),0 0 12px rgba(20,217,255,.12);
    }
    .weapon-btn.active{
      border-color:#f04bce;
      background:
        radial-gradient(circle at 50% 12%,rgba(250,80,211,.22),transparent 55%),

    .power-chart-wrap{
      background:
        repeating-linear-gradient(0deg,transparent 0 31px,rgba(24,169,221,.07) 32px),
        repeating-linear-gradient(90deg,transparent 0 79px,rgba(24,169,221,.055) 80px),
        linear-gradient(180deg,rgba(2,15,29,.98),rgba(1,8,19,.99));
      box-shadow:inset 0 0 28px rgba(0,105,173,.16),0 0 12px rgba(18,218,255,.08);
    }

    /* v122 UI 自检第 5 轮：统一角标与微光语言，完成参考图风格收束。 */
    .panel::before{opacity:.96;filter:drop-shadow(0 0 8px rgba(26,225,255,.68))}
    .panel::after{border-color:rgba(43,204,239,.20)}
    .canvas-wrap::before{opacity:.18}
    .canvas-wrap::after{
      background:
        linear-gradient(#29ecff,#29ecff) left top/30px 1px no-repeat,

        linear-gradient(#208eff,#208eff) right top/1px 30px no-repeat,
        linear-gradient(#208eff,#208eff) left bottom/30px 1px no-repeat,
        linear-gradient(#208eff,#208eff) left bottom/1px 30px no-repeat,
        linear-gradient(#29ecff,#29ecff) right bottom/30px 1px no-repeat,

    .data-strip-group,.counter-card{

    /* v174 UI 迭代 1：把左侧矩阵从“标题 + 画布”拆成阶段导航、规则摘要、物理画布三层。 */
    .stage-169 .layout{grid-template-columns:minmax(0,47fr) minmax(0,53fr);gap:13px}
    .panel-left{--panel-accent:#1ce8ff;--panel-accent-2:#4b78ff}
    .panel-left .panel-head{background:linear-gradient(90deg,rgba(10,105,144,.20),transparent 70%)}
    .matrix-panel-head{gap:7px;padding:4px 8px 8px;min-height:76px}
    .matrix-heading{min-height:28px}
    .matrix-panel-head .panel-title{font-size:16px;letter-spacing:.15em}
    .matrix-panel-head .panel-index{letter-spacing:.22em;color:#b8efff}
    .matrix-rules{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
    .matrix-rule{
      min-height:35px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:6px;row-gap:2px;
      align-content:center;padding:5px 7px;border-color:rgba(43,183,221,.42);
      background:linear-gradient(145deg,rgba(7,55,78,.54),rgba(2,15,29,.92));
      box-shadow:inset 0 1px rgba(128,238,255,.08),0 0 9px rgba(0,117,171,.08)
    }
    .matrix-rule b{grid-row:1 / span 2;align-self:center;color:#1ce8ff;font-size:8px}
    .matrix-rule i{font-style:normal;color:#e3f8ff;font-size:10px;letter-spacing:.08em}
    .matrix-rule em{font-style:normal;overflow:hidden;text-overflow:ellipsis;color:#7599af;font:8px/1.1 monospace;letter-spacing:0}

    /* v175 UI 迭代 2：让左侧画布成为独立的物理仪表盘，降低装饰噪声并提高分区识别度。 */
    .panel-left .generator-wrap{
      border-color:rgba(47,202,237,.62);
      background:linear-gradient(180deg,rgba(1,11,22,.98),rgba(1,7,15,.99));
      box-shadow:inset 0 0 58px rgba(8,109,167,.18),0 0 18px rgba(0,168,220,.10)
    }
    .panel-left .generator-wrap::before{opacity:.13;background:repeating-linear-gradient(0deg,transparent 0 4px,rgba(142,216,255,.035) 4px 5px)}
    .panel-left .generator-wrap::after{opacity:.72;filter:drop-shadow(0 0 5px rgba(34,227,255,.62))}
    .panel-left .canvas-wrap{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}

    /* v176 UI 迭代 3：强化流程节奏和“生成 → 分流 → 兑现”方向感。 */
    .panel-left .panel-title::after{color:#6defff;opacity:.72}
    .panel-left .matrix-rule:nth-child(1){border-color:rgba(28,232,255,.56)}
    .panel-left .matrix-rule:nth-child(2){border-color:rgba(83,152,255,.48)}
    .panel-left .matrix-rule:nth-child(3){border-color:rgba(125,100,255,.48)}
    .panel-left .matrix-rule:nth-child(4){border-color:rgba(164,185,199,.46)}
    .panel-left .matrix-rule:nth-child(1)::after,
    .panel-left .matrix-rule:nth-child(2)::after,
    .panel-left .matrix-rule:nth-child(3)::after{content:"";position:absolute;right:-5px;top:50%;width:5px;height:1px;background:#62dff5;opacity:.36}
    .panel-left .matrix-rule{position:relative}
    .panel-left .matrix-rule::before{content:"";position:absolute;left:7px;right:7px;bottom:3px;height:1px;background:linear-gradient(90deg,currentColor,transparent);opacity:.13}
    .panel-left .generator-wrap{isolation:isolate}
    .panel-left .generator-wrap::after{z-index:4}
    .panel-left #leftCanvas{background:radial-gradient(circle at 50% 44%,rgba(11,48,78,.32),rgba(1,7,15,.96) 74%)}

    /* v177 UI 迭代 4：窄屏时信息自动折叠，避免阶段标签互相挤压；动画只留给交互状态。 */
    .panel-left .matrix-rule{transition:border-color .2s ease,background .2s ease,box-shadow .2s ease}
    .panel-left .matrix-rule:hover{border-color:#5cecff;background:linear-gradient(145deg,rgba(12,79,104,.64),rgba(2,18,31,.94));box-shadow:inset 0 1px rgba(166,248,255,.12),0 0 12px rgba(29,214,255,.13)}
    .panel-left .matrix-rule:focus-visible{outline:2px solid #b8f7ff;outline-offset:2px}
    @media(max-width:1120px){
      .stage-169 .layout{grid-template-columns:minmax(0,46fr) minmax(0,54fr)}
      .matrix-rule{padding-inline:6px}
      .matrix-rule em{font-size:7.5px}
    }
    @media(max-width:720px){
      .stage-169 .layout{grid-template-columns:1fr}
      .matrix-panel-head{min-height:0}
      .matrix-rules{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media(max-width:480px){.matrix-rules{grid-template-columns:1fr 1fr}.matrix-rule{min-height:32px}}

    /* v180 UI 清理：移除顶部阶段导航，标题区只保留矩阵名称与编号。 */
    .matrix-panel-head{display:flex;align-items:center;min-height:48px;padding:3px 7px 8px}

    /* v182 UI 减法重构：保留工业仪表气质，降低重复边框、角标和荧光噪声。 */
    .panel-left{
      padding:7px;
      border-color:rgba(52,142,190,.34);
      background:linear-gradient(180deg,rgba(4,13,27,.985),rgba(1,7,15,.992));
      clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);
      box-shadow:0 8px 28px rgba(0,0,0,.28),inset 0 1px rgba(111,222,255,.05);
    }
    .panel-left::before{
      opacity:.32;
      filter:none;
      background:
        linear-gradient(90deg,rgba(44,216,242,.72),transparent 36%) top left/70% 1px no-repeat,
        linear-gradient(180deg,rgba(44,216,242,.38),transparent 34%) top left/1px 70% no-repeat;
    }
    .panel-left::after{display:none}
    .matrix-panel-head{min-height:40px;padding:0 6px 7px}
    .matrix-panel-head .panel-title{
      font-size:15px;
      letter-spacing:.10em;
      text-shadow:none;
    }
    .matrix-panel-head .panel-title::before{
      width:6px;height:6px;
      border-color:rgba(87,224,244,.86);
      box-shadow:none;
    }
    .matrix-panel-head .panel-title::after{display:none}
    .matrix-panel-head .panel-index{
      padding:0;
      border:0;
      background:transparent;
      clip-path:none;
      color:rgba(152,202,222,.68);
      letter-spacing:.14em;
    }
    .panel-left .generator-wrap{
      border-color:rgba(55,147,190,.30);
      background:#020913;
      clip-path:none;
      box-shadow:inset 0 0 42px rgba(9,67,104,.12);
    }
    .panel-left .generator-wrap::before,
    .panel-left .generator-wrap::after{display:none}
    .panel-left #leftCanvas{background:#020913}
  </style>

fn atomicAddF32(p:ptr<storage,atomic<u32>,read_write>,delta:f32)->f32{
  var oldBits=atomicLoad(p);
  loop{
    let oldValue=bitcast<f32>(oldBits);
    let newValue=max(0.0,oldValue+delta);
    let result=atomicCompareExchangeWeak(p,oldBits,bitcast<u32>(newValue));
    if(result.exchanged){return oldValue;}
    oldBits=result.old_value;
  }
}
fn atomicTakeF32(p:ptr<storage,atomic<u32>,read_write>,requested:f32)->f32{
  if(requested<=0.0){return 0.0;}
  var oldBits=atomicLoad(p);
  loop{
    let oldValue=max(0.0,bitcast<f32>(oldBits));
    let taken=min(oldValue,requested);
    let result=atomicCompareExchangeWeak(p,oldBits,bitcast<u32>(oldValue-taken));
    if(result.exchanged){return taken;}
    oldBits=result.old_value;
  }
}

      // v181：乘区内容、隔板底脚、单向挡板和碰撞结算共用同一条底边，消除原先 3px 的错位。
      multCells.push({x:multX,w,type,fraction:layout.fraction,mult:type==='gap'?null:Number(type.slice(1)),left:multX+MULT_SEPARATOR_HALF_WIDTH,right:multX+w-MULT_SEPARATOR_HALF_WIDTH,bottom:BOARD.multBottom,index:i,hitCount:0,hitLabel});
      multX+=w;
    }
    gapFieldCell=multCells.find(cell=>cell.type==='gap')||null;
    // 分隔线只保存中心位置，渲染与碰撞共同使用全局胶囊宽度和纵向范围。
    for(let i=1;i<multCells.length;i++){

    for(let i=0;i<CONVERTER_ORDER.length;i++){
      const key=CONVERTER_ORDER[i];
      converterCells.push({x:PLAYFIELD.left,w:0,key,left:PLAYFIELD.left,right:PLAYFIELD.left,bottom:BOARD.convertBottom-3,index:i,weight:0,share:0,hitCount:0,highlightFaction:-1,highlightStrength:0,hitLabel:CONVERTER_SHORT_LABELS[key]||WEAPONS[key].name});
    }
    updateConverterLayout(simulationElapsed);
  }

  function updateConverterLayout(elapsed=simulationElapsed){
    if(converterCells.length!==CONVERTER_ORDER.length)return;
    const progress=Math.max(0,Math.min(1,elapsed/TUNING.converter.equalizeSeconds));
    // 0:1:1.5:1:0 → 1:1:1:1:1；护盾从 1.5 线性回落到 1。
    const weights=[progress,1,1.5-.5*progress,1,progress];
    const totalWeight=weights.reduce((sum,weight)=>sum+weight,0);
    let converterX=PLAYFIELD.left;
    for(let i=0;i<converterCells.length;i++){
      const cell=converterCells[i];
      const weight=weights[i];
      const w=i===converterCells.length-1?PLAYFIELD.right-converterX:PLAYFIELD.width*weight/totalWeight;
      const inset=Math.min(TUNING.converter.inset,w*.5);
      cell.x=converterX;cell.w=w;cell.left=converterX+inset;cell.right=converterX+w-inset;cell.weight=weight;cell.share=w/PLAYFIELD.width;
      converterX+=w;
    }
  }

  function fitCanvas(canvas,w,h){

      const changed=canvas.width!==width||canvas.height!==height;
      if(changed){canvas.width=width;canvas.height=height;}
      return {sx:width/w,sy:height/h,ox:0,oy:0,changed};
    }
    const dpr=Math.min(MAX_CANVAS_DPR,window.devicePixelRatio||1),r=canvas.getBoundingClientRect();
    const width=Math.max(1,Math.round(r.width*dpr)),height=Math.max(1,Math.round(r.height*dpr));
    const changed=canvas.width!==width||canvas.height!==height;
    if(changed){canvas.width=width;canvas.height=height;}
    return {sx:width/w,sy:height/h,ox:0,oy:0,changed};
  }
  function fitCanvasContained(canvas,w,h){
    if(videoRenderSourceHeight>0){
      const height=videoRenderSourceHeight,width=Math.max(1,Math.round(height*w/h));
      const changed=canvas.width!==width||canvas.height!==height;
      if(changed){canvas.width=width;canvas.height=height;}
      return {sx:width/w,sy:height/h,ox:0,oy:0,changed};

    const width=Math.max(1,Math.round(r.width*dpr)),height=Math.max(1,Math.round(r.height*dpr));
    const changed=canvas.width!==width||canvas.height!==height;
    if(changed){canvas.width=width;canvas.height=height;}
    const scale=Math.min(width/w,height/h);

  function colorWithAlpha(hex,alpha){
    const value=hex.replace('#','');
    const r=parseInt(value.slice(0,2),16),g=parseInt(value.slice(2,4),16),b=parseInt(value.slice(4,6),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  function mixHexColors(hexA,hexB,t){
    const a=hexA.replace('#',''),b=hexB.replace('#','');
    const ar=parseInt(a.slice(0,2),16),ag=parseInt(a.slice(2,4),16),ab=parseInt(a.slice(4,6),16);
    const br=parseInt(b.slice(0,2),16),bg=parseInt(b.slice(2,4),16),bb=parseInt(b.slice(4,6),16);
    const k=Math.max(0,Math.min(1,t));
    const r=Math.round(ar+(br-ar)*k),g=Math.round(ag+(bg-ag)*k),bl=Math.round(ab+(bb-ab)*k);
    return '#'+[r,g,bl].map(v=>v.toString(16).padStart(2,'0')).join('');
  }

  function makeBaseHudSprite(color,brightness=1){
    const canvas=document.createElement('canvas');canvas.width=176;canvas.height=176;
    const c=canvas.getContext('2d'),x=88,y=88,hudR=BASE_OUTER_RADIUS;

    // v132：移除基地黑色圆形底盘，只保留阵营色分段霓虹环、副环和径向刻度。
    c.strokeStyle=color;c.shadowColor=color;c.shadowBlur=14;c.lineWidth=3;
    const start=-Math.PI*.88,end=Math.PI*.88,segments=14;
    for(let i=0;i<segments;i++){
      if(i===6||i===7)continue;
      const a0=start+(end-start)*i/segments,a1=start+(end-start)*(i+.68)/segments;
      c.beginPath();c.arc(x,y,hudR,a0,a1);c.stroke();
    }
    c.globalAlpha=.5;c.lineWidth=1.2;c.beginPath();c.arc(x,y,hudR+8,0,TAU);c.stroke();c.globalAlpha=1;c.shadowBlur=0;
    for(let i=0;i<24;i++){
      const a=i/24*TAU,inner=hudR+3,outer=hudR+(i%3===0?10:7);
      c.strokeStyle=i%3===0?color:'rgba(188,232,255,.26)';c.lineWidth=i%3===0?1.4:.8;
      c.beginPath();c.moveTo(x+Math.cos(a)*inner,y+Math.sin(a)*inner);c.lineTo(x+Math.cos(a)*outer,y+Math.sin(a)*outer);c.stroke();
    }
    return canvas;
  }

  function drawShieldWithBaseOuterStyle(c,x,y,r,color,flash,brightness=1,rotation=0){
    c.save();

    // v144：护盾内部亮度按二次以上曲线从中心 20 增长到边缘 180。
    const interiorAlpha=t=>Math.min(.96,(SHIELD_INTERIOR_CENTER_ALPHA+(SHIELD_INTERIOR_EDGE_ALPHA-SHIELD_INTERIOR_CENTER_ALPHA)*Math.pow(t,2.35))*brightness+flash*.035*t);
    const fill=c.createRadialGradient(x,y,Math.max(0,r*.12),x,y,r);
    fill.addColorStop(0,colorWithAlpha(color,interiorAlpha(0)));
    fill.addColorStop(.34,colorWithAlpha(color,interiorAlpha(.34)));
    fill.addColorStop(.62,colorWithAlpha(color,interiorAlpha(.62)));
    fill.addColorStop(.82,colorWithAlpha(color,interiorAlpha(.82)));
    fill.addColorStop(1,colorWithAlpha(color,interiorAlpha(1)));
    c.fillStyle=fill;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();

    // 正角度在 Canvas 坐标系中为顺时针；内部弧段和外圈刻度共用旋转相位。
    c.save();c.beginPath();c.arc(x,y,r,0,TAU);c.clip();c.globalCompositeOperation='lighter';c.lineCap='round';
    for(let ring=0;ring<4;ring++){
      const rr=r*(.38+ring*.15),segments=3+ring;
      c.strokeStyle=color;c.lineWidth=Math.max(.55,r*(.004+.0012*ring));c.globalAlpha=.055+ring*.026+flash*.035;
      for(let segment=0;segment<segments;segment++){
        const start=rotation+segment*TAU/segments+ring*.71;
        c.beginPath();c.arc(x,y,rr,start,start+.34+ring*.035);c.stroke();
      }
    }
    c.restore();

    c.strokeStyle=color;c.shadowColor=color;c.shadowBlur=14+flash*10;c.lineCap='round';
    c.globalAlpha=.30+.20*flash;c.lineWidth=2+flash*2;
    c.beginPath();c.arc(x,y,r,0,TAU);c.stroke();

    // 使用与参考基地一致的副环和刻度颜色。
    c.shadowBlur=0;c.globalAlpha=.24+.12*flash;c.lineWidth=1.1;
    c.beginPath();c.arc(x,y,r+8,0,TAU);c.stroke();
    for(let i=0;i<24;i++){
      const angle=rotation+i/24*TAU,cos=Math.cos(angle),sin=Math.sin(angle),inner=r+3,outer=r+(i%3===0?10:7);
      c.strokeStyle=i%3===0?color:'rgba(188,232,255,.26)';
      c.lineWidth=i%3===0?1.4:.8;
      c.beginPath();c.moveTo(x+cos*inner,y+sin*inner);c.lineTo(x+cos*outer,y+sin*outer);c.stroke();
    }
    c.restore();
  }

  function seedBaseTerritories(){
    const radiusSq=BASE_TERRITORY_RADIUS*BASE_TERRITORY_RADIUS;
    for(let faction=0;faction<FACTIONS.length;faction++){
      const cx=FACTIONS[faction].base[0]*GRID_W;
      const cy=FACTIONS[faction].base[1]*GRID_H;
      const minX=Math.max(0,Math.floor(cx-BASE_TERRITORY_RADIUS));
      const maxX=Math.min(GRID_W-1,Math.ceil(cx+BASE_TERRITORY_RADIUS));
      const minY=Math.max(0,Math.floor(cy-BASE_TERRITORY_RADIUS));
      const maxY=Math.min(GRID_H-1,Math.ceil(cy+BASE_TERRITORY_RADIUS));
      for(let y=minY;y<=maxY;y++){
        const dy=(y+.5)-cy;
        for(let x=minX;x<=maxX;x++){
          const dx=(x+.5)-cx;
          if(dx*dx+dy*dy>radiusSq)continue;
          const cellIndex=y*GRID_W+x;
          const previous=owner[cellIndex];
          if(previous===faction)continue;
          if(previous!==255)territoryCounts[previous]--;
          owner[cellIndex]=faction;
          territoryCounts[faction]++;
          refreshTerritoryCell(cellIndex,faction,0);
        }
      }
    }
  }

  function writeTerritoryAgeColorTick(cellIndex,faction,tick){
    tick=Math.max(0,Math.min(TERRITORY_COLOR_TICK_COUNT-1,tick|0));
    const color=territoryAgeColorLUT[faction][tick];
    if(territoryPixelWords[cellIndex]===color)return false;
    territoryPixelWords[cellIndex]=color;

  function updateTerritoryColors(){
    const currentTick=Math.round(simulationElapsed*TERRITORY_COLOR_TICK_HZ);
    for(let i=activeTerritoryColorCells.length-1;i>=0;i--){
      const cellIndex=activeTerritoryColorCells[i],faction=owner[cellIndex];
      if(faction===255){
        territoryColorTracked[cellIndex]=0;
        const last=activeTerritoryColorCells.pop();if(i<activeTerritoryColorCells.length)activeTerritoryColorCells[i]=last;
        continue;
      }
      const ageTick=Math.max(0,currentTick-territoryCapturedTick[cellIndex]);

      if(ageTick>=TERRITORY_COLOR_TICK_COUNT-1){

  function formatNum(n){
    if(!Number.isFinite(n))return '∞';
    const abs=Math.abs(n);
    if(abs>=1e15)return n.toExponential(2).replace('+','');
    if(abs>=1e12)return (n/1e12).toFixed(abs>=1e13?0:1).replace('.0','')+'T';
    if(abs>=1e9)return (n/1e9).toFixed(abs>=1e10?0:1).replace('.0','')+'B';
    if(abs>=1e6)return (n/1e6).toFixed(abs>=1e7?0:1).replace('.0','')+'M';
    if(abs>=1e3)return (n/1e3).toFixed(abs>=1e4?0:1).replace('.0','')+'K';
    return String(Math.round(n));
  }
  function formatMachineFirepower(n){
    if(!Number.isFinite(n))return '∞';
    const abs=Math.abs(n);
    if(abs>=1e15)return n.toExponential(1).replace('+','');
    if(abs>=1e12)return (n/1e12).toFixed(1)+'T';
    if(abs>=1e9)return (n/1e9).toFixed(1)+'B';
    if(abs>=1e6)return (n/1e6).toFixed(1)+'M';
    if(abs>=1e3)return (n/1e3).toFixed(1)+'K';
    return Number(n).toFixed(1);
  }

    return Math.pow(2,Math.floor(Math.max(0,simulationElapsed)/BASE_VALUE_GROWTH_INTERVAL));
  }
  function chooseValue(){return BASE_BALL_VALUE*getBaseValueMultiplier();}
  function getBallStartValue(){return chooseValue()*globalStartValueMultiplier;}
  function radiusFromValue(value){
    const safeValue=Number.isFinite(value)?Math.max(BASE_BALL_VALUE,value):Number.MAX_VALUE;
    const decayIntervals=Math.max(0,simulationElapsed/45);
    // v198：每 45 秒衰减 0.5px 半径（即直径减少 1px）。
    const doublingLevels=Math.max(0,Math.log2(safeValue/BASE_BALL_VALUE)-decayIntervals*.5);
    return Math.min(BALL_RADIUS_MAX,BALL_RADIUS_BASE+doublingLevels*BALL_RADIUS_PER_DOUBLING);
  }

  const BALLS_PER_FACTION=3;

  function randomSpawnX(){
    const {minX,maxX}=getSpawnBounds();
    return minX+Math.random()*(maxX-minX);
  }

  function findClearSpawnX(ball,preferredX){
    const {minX,maxX}=getSpawnBounds(ball.r);
    const span=Math.max(1,maxX-minX);
    let bestX=Math.max(minX,Math.min(maxX,preferredX));
    let bestClearance=-Infinity;
    for(let i=0;i<24;i++){
      const candidate=i===0
        ?bestX
        :minX+((((i*.61803398875)+(ball.faction*.137)+(ball.slot*.071))%1)*span);
      let clearance=Infinity;
      for(const other of balls){
        if(other===ball||!Number.isFinite(other.x)||!Number.isFinite(other.y))continue;
        if(Math.abs(other.y-BOARD.spawnY)>ball.r+other.r+28)continue;
        clearance=Math.min(clearance,Math.abs(candidate-other.x)-(ball.r+other.r+8));
      }
      if(clearance>bestClearance){bestClearance=clearance;bestX=candidate;}
      if(clearance>=0)break;
    }
    return bestX;
  }

  function initBallTrail(ball){
    ball.trailX=new Float32Array(BALL_TRAIL_CAPACITY);ball.trailY=new Float32Array(BALL_TRAIL_CAPACITY);
    ball.trailHead=0;ball.trailCount=0;
  }
  function resetBallTrail(ball){ball.trailHead=0;ball.trailCount=0;}
  function pushBallTrail(ball,x,y){
    const index=ball.trailHead;ball.trailX[index]=x;ball.trailY[index]=y;
    ball.trailHead=(index+1)%BALL_TRAIL_CAPACITY;ball.trailCount=Math.min(BALL_TRAIL_CAPACITY,ball.trailCount+1);
  }

  function resetBallToTop(ball,{keepValue=false,useControls=false,delay=0.08,xOverride=null,returnKick=false}={}){
    if(!keepValue){
      ball.value=getBallStartValue();
    }
    ball.r=radiusFromValue(ball.value);
    const offsetRangeEl=UI.offsetRange;
    const spawnBounds=getSpawnBounds(ball.r);
    const spawnSpan=Math.max(1,spawnBounds.maxX-spawnBounds.minX);
    const controlledOffset=useControls&&offsetRangeEl?Number(offsetRangeEl.value)/100*(spawnSpan*.20):0;
    const randomX=xOverride!==null?xOverride:randomSpawnX()+controlledOffset;
    ball.x=findClearSpawnX(ball,randomX);
    const driftRangeEl=UI.driftRange;
    const controlledDrift=driftRangeEl?Number(driftRangeEl.value):0;
    ball.y=BOARD.spawnY-(Math.random()*8);
    ball.vx=(useControls?controlledDrift:(Math.random()-.5)*62)+(Math.random()-.5)*10;
    ball.vy=14+Math.random()*12;
    ball.angularVelocity=0;
    if(returnKick){
      // 回到顶部生成区后额外施加一次随机冲量，减少重复落点与轨迹。
      ball.vx+=(Math.random()-.5)*450;
      ball.vy-=Math.random()*170;
    }
    ball.zone='upper';
    ball.multRegion=null;
    ball.convertRegion=null;
    ball.gapStallTime=0;
    ball.multiplierEntryStallTime=0;
    ball.multiplierEntryKickCooldown=0;
    resetBallTrail(ball);
    ball.life=0;
    ball.respawnDelay=delay+Math.random()*.08;
  }

  function createFixedBall(faction,slot,delayOverride=null){
    const startValue=getBallStartValue();
    const ball={faction,slot,weapon:STOCK_KEYS[(faction+slot)%STOCK_KEYS.length],value:startValue,x:0,y:0,vx:0,vy:0,angularVelocity:0,r:radiusFromValue(startValue),life:0,zone:'upper',multRegion:null,respawnDelay:0,gapStallTime:0,multiplierEntryStallTime:0,multiplierEntryKickCooldown:0};
    initBallTrail(ball);
    balls.push(ball);
    resetBallToTop(ball,{keepValue:true,delay:delayOverride===null?faction*.08+slot*.16:delayOverride});
  }

  function addFactionRewardBalls(faction,count){
    let nextSlot=0;
    for(const ball of balls)if(ball.faction===faction)nextSlot=Math.max(nextSlot,ball.slot+1);
    for(let i=0;i<count;i++)createFixedBall(faction,nextSlot+i,i*.12);
  }

  function initializeFixedBallPool(){
    balls.length=0;
    for(let faction=0;faction<FACTIONS.length;faction++){
      for(let slot=0;slot<BALLS_PER_FACTION;slot++) createFixedBall(faction,slot);
    }
  }

  function relaunchSelectedFaction(){
    if(gameEnded){log('本局已经结束，请重置战场后再重新投放弹珠。');return;}
    if(eliminated[selectedFaction]){log(`${FACTIONS[selectedFaction].name}已被淘汰，无法重新投放弹珠`,selectedFaction);return;}
    const selected=balls.filter(ball=>ball.faction===selectedFaction).sort((a,b)=>a.slot-b.slot);
    selected.forEach((ball,index)=>resetBallToTop(ball,{keepValue:false,useControls:true,delay:index*.14}));
    log(`${FACTIONS[selectedFaction].name}的 ${selected.length} 枚弹珠已重新投放`,selectedFaction);
  }

  function getImpactRestitution(impactSpeed,requested=MARBLE_COLLISION_SPEED_RETAIN){
    const start=TUNING.collision.bounceThreshold,end=Math.max(start+1,TUNING.collision.fullRestitutionSpeed);
    const x=Math.max(0,Math.min(1,(impactSpeed-start)/(end-start)));
    const ramp=x*x*(3-2*x);
    return Math.max(0,Math.min(1,requested))*ramp;
  }

  function capMarbleSpin(ball){
    const omega=Number.isFinite(ball.angularVelocity)?ball.angularVelocity:0;
    ball.angularVelocity=Math.max(-TUNING.collision.maxSpin,Math.min(TUNING.collision.maxSpin,omega));
  }

  function solveBallSurfaceContact(ball,nx,ny,penetration,options={},applyVelocity=true){
    if(!(penetration>0))return false;
    const correction=Math.max(0,penetration-TUNING.collision.penetrationSlop)*TUNING.collision.positionCorrection;
    if(correction>0){ball.x+=nx*correction;ball.y+=ny*correction;}
    if(!applyVelocity)return true;

    const surfaceVx=options.surfaceVx||0,surfaceVy=options.surfaceVy||0;
    const rvx=ball.vx-surfaceVx,rvy=ball.vy-surfaceVy;
    const normalVelocity=rvx*nx+rvy*ny;
    if(normalVelocity>=0)return true;

    const mass=getMarbleCollisionMass(ball),invMass=1/mass;
    const surfaceMass=Number.isFinite(options.surfaceMass)&&options.surfaceMass>0?options.surfaceMass:Infinity;
    const invSurface=Number.isFinite(surfaceMass)?1/surfaceMass:0;
    const restitution=getImpactRestitution(-normalVelocity,options.restitution);
    const impulseScale=Number.isFinite(options.impulseScale)?Math.max(0,options.impulseScale):1;
    const normalImpulse=-(1+restitution)*normalVelocity/Math.max(1e-9,invMass+invSurface)*impulseScale;
    ball.vx+=normalImpulse*invMass*nx;ball.vy+=normalImpulse*invMass*ny;

    const tx=-ny,ty=nx;
    const inertia=getMarbleMomentOfInertia(ball,mass),omega=Number.isFinite(ball.angularVelocity)?ball.angularVelocity:0;
    const tangentVelocity=(ball.vx-surfaceVx)*tx+(ball.vy-surfaceVy)*ty-omega*ball.r;
    const tangentDenominator=invMass+invSurface+(ball.r*ball.r)/inertia;
    if(Math.abs(tangentVelocity)>1e-6&&tangentDenominator>0){
      const friction=Number.isFinite(options.friction)?options.friction:TUNING.collision.surfaceFriction;
      const limit=Math.abs(normalImpulse)*Math.max(0,friction);
      const tangentImpulse=Math.max(-limit,Math.min(limit,-tangentVelocity/tangentDenominator));
      ball.vx+=tangentImpulse*invMass*tx;ball.vy+=tangentImpulse*invMass*ty;
      ball.angularVelocity=omega-ball.r*tangentImpulse/inertia;
      capMarbleSpin(ball);
    }
    return true;
  }

  function solveBallCircleContact(ball,circle,applyVelocity=true){
    let dx=ball.x-circle.x,dy=ball.y-circle.y,dist=Math.hypot(dx,dy);
    const minDistance=ball.r+circle.r;
    if(dist>=minDistance)return false;
    let nx,ny;
    if(dist<1e-6){
      const seed=(ball.faction*37+ball.slot*61+(circle.contactId||0)*17+1)%360;
      const angle=seed*Math.PI/180;nx=Math.cos(angle);ny=Math.sin(angle);dist=0;
    }else{nx=dx/dist;ny=dy/dist;}

    let surfaceVx=0,surfaceVy=0,surfaceMass=Infinity,impulseScale=1;
    if(circle.rotor&&!circle.isCenter){
      const rx=circle.x-circle.rotor.cx,ry=circle.y-circle.rotor.cy;
      surfaceVx=-circle.rotor.baseAngularSpeed*ry;
      surfaceVy=circle.rotor.baseAngularSpeed*rx;
      const relativeSpeed=Math.hypot(ball.vx-surfaceVx,ball.vy-surfaceVy);
      const driveResponse=getCollisionSpeedResponse(relativeSpeed);
      surfaceMass=Math.pow(TUNING.collision.rotorEffectiveRadius,TUNING.collision.massExponent)
        *TUNING.collision.rotorMassMultiplier*driveResponse;
      impulseScale=TUNING.collision.rotorMomentumTransferScale;
    }
    return solveBallSurfaceContact(ball,nx,ny,minDistance-dist,{
      surfaceVx,surfaceVy,surfaceMass,
      restitution:MARBLE_COLLISION_SPEED_RETAIN,
      friction:TUNING.collision.surfaceFriction,
      impulseScale
    },applyVelocity);
  }

  function solveBallPairContact(a,b,applyVelocity=true){
    if(a.respawnDelay>0||b.respawnDelay>0)return false;
    // 不允许隔着倍率盒或火力转换盒侧壁发生弹珠碰撞。
    if(a.zone==='multiplier'&&b.zone==='multiplier'&&a.multRegion!==b.multRegion)return false;
    if(a.zone==='convert'&&b.zone==='convert'&&a.convertRegion!==b.convertRegion)return false;
    let dx=b.x-a.x,dy=b.y-a.y,distSq=dx*dx+dy*dy;
    const minDistance=a.r+b.r;
    if(distSq>=minDistance*minDistance)return false;
    let dist,nx,ny;
    if(distSq<=1e-8){
      const seed=(a.faction*17+a.slot*31+b.faction*47+b.slot*59+1)%360;
      const angle=seed*Math.PI/180;nx=Math.cos(angle);ny=Math.sin(angle);dist=0;
    }else{dist=Math.sqrt(distSq);nx=dx/dist;ny=dy/dist;}

    const massA=getMarbleCollisionMass(a),massB=getMarbleCollisionMass(b);
    const invA=1/massA,invB=1/massB,invTotal=invA+invB;
    const correction=Math.max(0,minDistance-dist-TUNING.collision.penetrationSlop)*TUNING.collision.positionCorrection;
    if(correction>0&&invTotal>0){
      const moveA=correction*invA/invTotal,moveB=correction*invB/invTotal;
      a.x-=nx*moveA;a.y-=ny*moveA;b.x+=nx*moveB;b.y+=ny*moveB;
    }
    if(!applyVelocity)return true;

    const rvx=b.vx-a.vx,rvy=b.vy-a.vy,normalVelocity=rvx*nx+rvy*ny;
    if(normalVelocity>=0)return true;
    const impactSpeed=-normalVelocity;
    const restitution=getImpactRestitution(impactSpeed,MARBLE_COLLISION_SPEED_RETAIN);
    const normalImpulse=-(1+restitution)*normalVelocity/Math.max(1e-9,invTotal);
    const normalX=normalImpulse*nx,normalY=normalImpulse*ny;
    a.vx-=normalX*invA;a.vy-=normalY*invA;b.vx+=normalX*invB;b.vy+=normalY*invB;

    const tx=-ny,ty=nx;
    const inertiaA=getMarbleMomentOfInertia(a,massA),inertiaB=getMarbleMomentOfInertia(b,massB);
    const omegaA=Number.isFinite(a.angularVelocity)?a.angularVelocity:0;
    const omegaB=Number.isFinite(b.angularVelocity)?b.angularVelocity:0;
    const tangentVelocity=(b.vx-a.vx)*tx+(b.vy-a.vy)*ty-omegaA*a.r-omegaB*b.r;
    const tangentDenominator=invTotal+(a.r*a.r)/inertiaA+(b.r*b.r)/inertiaB;
    if(Math.abs(tangentVelocity)>1e-6&&tangentDenominator>0){
      const limit=Math.abs(normalImpulse)*TUNING.collision.ballFriction;
      const tangentImpulse=Math.max(-limit,Math.min(limit,-tangentVelocity/tangentDenominator));
      const tangentX=tangentImpulse*tx,tangentY=tangentImpulse*ty;
      a.vx-=tangentX*invA;a.vy-=tangentY*invA;b.vx+=tangentX*invB;b.vy+=tangentY*invB;
      a.angularVelocity=omegaA-a.r*tangentImpulse/inertiaA;
      b.angularVelocity=omegaB-b.r*tangentImpulse/inertiaB;
      capMarbleSpin(a);capMarbleSpin(b);
    }
    return true;
  }

  function resolveBallCollisions(applyVelocity=true){
    for(let i=0;i<balls.length;i++){
      const ball=balls[i];if(ball.respawnDelay>0)continue;
      for(let j=i+1;j<balls.length;j++){
        const other=balls[j];
        if(other.respawnDelay<=0)solveBallPairContact(ball,other,applyVelocity);
      }
    }
  }
  function getMultCell(x){
    for(let i=0;i<multCells.length;i++){
      const c=multCells[i],right=c.x+c.w;
      if(x>=c.x&&(x<right||(i===multCells.length-1&&x<=right)))return c;
    }
    return x<PLAYFIELD.left?multCells[0]:multCells[multCells.length-1];
  }
  function getConverterForX(x){
    let firstActive=null,lastActive=null;
    for(let i=0;i<converterCells.length;i++){
      const c=converterCells[i];
      if(c.w<=CONVERTER_MIN_WIDTH)continue;
      if(!firstActive)firstActive=c;
      lastActive=c;
      const right=c.x+c.w;
      if(x>=c.x&&(x<right||(i===converterCells.length-1&&x<=right)))return c;
    }
    return x<PLAYFIELD.left?firstActive:lastActive;
  }

  const GAP_LEFT=()=>{const gap=getGapFieldCell();return (gap?gap.x:PLAYFIELD.left)+3;};
  const GAP_RIGHT=()=>{const gap=getGapFieldCell();return (gap?gap.x+gap.w:PLAYFIELD.right)-3;};

  function enterMultiplierRegion(ball){
    const cell=getMultCell(ball.x);
    ball.zone='multiplier';
    ball.multRegion=cell.type==='gap'?'gap':cell.index;
  }

  function bounceOnVerticalWall(ball,x,isLeft,applyVelocity=true){
    if(isLeft){
      const penetration=x+ball.r-ball.x;
      return solveBallSurfaceContact(ball,1,0,penetration,{restitution:MARBLE_COLLISION_SPEED_RETAIN},applyVelocity);
    }
    const penetration=ball.x-(x-ball.r);
    return solveBallSurfaceContact(ball,-1,0,penetration,{restitution:MARBLE_COLLISION_SPEED_RETAIN},applyVelocity);
  }

  function getMultiplierPlateTopDeflectDirection(ball,x){
    const edgeEpsilon=.25;
    if(x<=PLAYFIELD.left+edgeEpsilon)return 1;
    if(x>=PLAYFIELD.right-edgeEpsilon)return -1;

    const gap=getGapFieldCell();
    if(gap){
      if(Math.abs(x-gap.x)<=edgeEpsilon)return 1;
      if(Math.abs(x-(gap.x+gap.w))<=edgeEpsilon)return -1;
    }

    const offset=ball.x-x;
    if(Math.abs(offset)>.35)return offset<0?-1:1;
    if(Math.abs(ball.vx)>8)return ball.vx<0?-1:1;
    return ((ball.faction*3+ball.slot)&1)?1:-1;
  }

  function collideBallWithCapsule(ball,x1,y1,x2,y2,radius,options={},applyVelocity=true){
    const sx=x2-x1,sy=y2-y1,lenSq=sx*sx+sy*sy;
    if(lenSq<=1e-6)return false;
    const px=ball.x-x1,py=ball.y-y1;
    const t=Math.max(0,Math.min(1,(px*sx+py*sy)/lenSq));
    const cx=x1+sx*t,cy=y1+sy*t;
    let nx=ball.x-cx,ny=ball.y-cy;
    let dist=Math.hypot(nx,ny);
    const minDistance=ball.r+Math.max(0,radius);
    if(dist>=minDistance)return false;
    if(dist<1e-5){
      const prevX=Number.isFinite(ball.prevX)?ball.prevX:ball.x;
      const prevY=Number.isFinite(ball.prevY)?ball.prevY:ball.y;
      const prevT=Math.max(0,Math.min(1,((prevX-x1)*sx+(prevY-y1)*sy)/lenSq));
      nx=prevX-(x1+sx*prevT);ny=prevY-(y1+sy*prevT);
      const prevDistance=Math.hypot(nx,ny);
      if(prevDistance>1e-5){nx/=prevDistance;ny/=prevDistance;}
      else if(t<=1e-4){nx=0;ny=-1;}
      else if(t>=1-1e-4){nx=0;ny=1;}
      else{nx=ball.vx>0?-1:1;ny=0;}
      dist=0;
    }else{
      nx/=dist;ny/=dist;
    }
    // 圆顶正中原本会形成完全竖直法线，低速弹珠可能永久平衡在顶端。
    // 对近顶点接触加入小幅确定性侧向分量，使其自然滚落；空隙边界优先导向空隙。
    if(t<=1e-4&&ny<0&&Math.abs(nx)<MULT_WALL_TOP_DEFLECT_NORMAL_X){
      const direction=options.topDeflectDirection<0?-1:1;
      nx=direction*MULT_WALL_TOP_DEFLECT_NORMAL_X;
      ny=-Math.sqrt(Math.max(0,1-nx*nx));
    }
    const sideRestitution=Number.isFinite(options.sideRestitution)?options.sideRestitution:MARBLE_COLLISION_SPEED_RETAIN;
    const restitution=t<=1e-4
      ?(Number.isFinite(options.topRestitution)?options.topRestitution:sideRestitution)
      :(t>=1-1e-4&&Number.isFinite(options.bottomRestitution)?options.bottomRestitution:sideRestitution);
    const hit=solveBallSurfaceContact(ball,nx,ny,minDistance-dist,{
      restitution,
      friction:TUNING.collision.surfaceFriction
    },applyVelocity);
    if(hit&&t<=1e-4)capBallSpeed(ball,MATRIX_SIDE_WALL_MAX_SPEED*1.12);
    return hit;
  }

  function resolveMultiplierPlateCollisions(ball,applyVelocity=true){
    const radius=MULT_SEPARATOR_HALF_WIDTH;
    const top=BOARD.multTop-MULT_WALL_CAP_HEIGHT;
    const bottom=BOARD.multBottom;
    if(ball.y+ball.r<top||ball.y-ball.r>bottom)return;

    const options={
      topRestitution:MULT_WALL_RESTITUTION,
      sideRestitution:MULT_WALL_RESTITUTION,
      bottomRestitution:MULT_WALL_RESTITUTION,
      topDeflectDirection:1
    };
    const centerTop=top+radius,centerBottom=Math.max(centerTop,bottom-radius);
    const collidePlate=x=>{
      options.topDeflectDirection=getMultiplierPlateTopDeflectDirection(ball,x);
      collideBallWithCapsule(ball,x,centerTop,x,centerBottom,radius,options,applyVelocity);
    };
    collidePlate(PLAYFIELD.left);
    for(const wall of multBoundaries){
      collidePlate(wall.x);
    }
    collidePlate(PLAYFIELD.right);
  }

  function applyMultiplierEntryUnjam(ball,dt){
    if(ball.multiplierEntryKickCooldown>0){
      ball.multiplierEntryKickCooldown=Math.max(0,ball.multiplierEntryKickCooldown-dt);
    }

    const capTop=BOARD.multTop-MULT_WALL_CAP_HEIGHT;
    const nearEntrance=ball.y+ball.r>=capTop-5&&ball.y-ball.r<=BOARD.multTop+12;
    if(!nearEntrance||ball.multiplierEntryKickCooldown>0){
      ball.multiplierEntryStallTime=Math.max(0,(ball.multiplierEntryStallTime||0)-dt*2);
      return false;
    }

    const cell=getMultCell(ball.x);
    if(!cell||cell.type==='gap'){
      ball.multiplierEntryStallTime=0;
      return false;
    }

    const openingWidth=Math.max(1,cell.right-cell.left);
    const isLargeRelativeToOpening=ball.r*2>=openingWidth*TUNING.multiplierEntry.largeDiameterToOpening;
    const movingSlowly=Math.abs(ball.vy)<=TUNING.multiplierEntry.maxVerticalSpeed
      &&Math.abs(ball.vx)<=TUNING.multiplierEntry.maxHorizontalSpeed;

    if(!isLargeRelativeToOpening||!movingSlowly){
      ball.multiplierEntryStallTime=Math.max(0,(ball.multiplierEntryStallTime||0)-dt*1.5);
      return false;
    }

    const centerX=cell.x+cell.w*.5;
    const centerDelta=centerX-ball.x;
    const centerRange=Math.max(1,openingWidth*.5);
    const centerPull=Math.max(-1,Math.min(1,centerDelta/centerRange));
    ball.vx+=centerPull*TUNING.multiplierEntry.centerAttraction*dt;
    ball.multiplierEntryStallTime=(ball.multiplierEntryStallTime||0)+dt;
    if(ball.multiplierEntryStallTime<TUNING.multiplierEntry.stallSeconds)return false;

    const upwardSpeed=TUNING.multiplierEntry.kickBaseSpeed+ball.r*TUNING.multiplierEntry.kickPerRadius;
    ball.vy=Math.min(ball.vy,-upwardSpeed);
    ball.zone='upper';
    ball.multRegion=null;
    ball.multiplierEntryStallTime=0;
    ball.multiplierEntryKickCooldown=TUNING.multiplierEntry.kickCooldown;
    return true;
  }

  function capBallSpeed(ball,maxSpeed){
    const currentSpeed=Math.hypot(ball.vx,ball.vy);
    if(currentSpeed>maxSpeed&&currentSpeed>0){
      const scale=maxSpeed/currentSpeed;
      ball.vx*=scale;
      ball.vy*=scale;
    }
  }

  function getCollisionSpeedResponse(speed){
    const safeSpeed=Math.max(0,Number.isFinite(speed)?speed:0);
    if(safeSpeed<=COLLISION_SPEED_RESPONSE_REFERENCE)return 1;
    const excessRatio=(safeSpeed-COLLISION_SPEED_RESPONSE_REFERENCE)/COLLISION_SPEED_RESPONSE_REFERENCE;
    return Math.max(COLLISION_SPEED_RESPONSE_FLOOR,
      Math.pow(1+excessRatio,-COLLISION_SPEED_RESPONSE_EXPONENT));
  }

  function getMarbleCollisionMass(ball){
    const r=Math.max(1,Number(ball?.r)||1);
    return Math.pow(r,TUNING.collision.massExponent);
  }

  function getMarbleMomentOfInertia(ball,mass=getMarbleCollisionMass(ball)){
    const r=Math.max(1,Number(ball?.r)||1);
    return Math.max(1e-6,TUNING.collision.rotationalInertiaFactor*mass*r*r);
  }

  function applyMarbleAirDrag(ball,dt){
    const speed=Math.hypot(ball.vx,ball.vy);
    if(speed<1e-6||dt<=0)return;
    const tuning=TUNING.collision;
    const dragRate=Math.min(tuning.airDragMaxRate,
      tuning.airDragLinear+tuning.airDragQuadratic*speed*speed/Math.max(1,tuning.airDragReferenceSpeed));
    const retention=Math.exp(-dragRate*dt);
    ball.vx*=retention;
    ball.vy*=retention;
  }

  function resolveMatrixSideReboundWall(ball,applyVelocity=true){
    const minX=PLAYFIELD.left+ball.r;
    const maxX=PLAYFIELD.right-ball.r;
    let touched=false;
    if(ball.x<minX){
      touched=solveBallSurfaceContact(ball,1,0,minX-ball.x,{restitution:MARBLE_COLLISION_SPEED_RETAIN},applyVelocity);
    }else if(ball.x>maxX){
      touched=solveBallSurfaceContact(ball,-1,0,ball.x-maxX,{restitution:MARBLE_COLLISION_SPEED_RETAIN},applyVelocity);
    }
    if(touched)capBallSpeed(ball,MATRIX_SIDE_WALL_MAX_SPEED);
  }

  function resolveMatrixTopBottomWalls(ball,applyVelocity=true){
    const minY=MATRIX_TOP_WALL_Y+ball.r;
    const maxY=MATRIX_BOTTOM_WALL_Y-ball.r;
    if(ball.y<minY){
      solveBallSurfaceContact(ball,0,1,minY-ball.y,{restitution:MARBLE_COLLISION_SPEED_RETAIN},applyVelocity);
    }else if(ball.y>maxY){
      solveBallSurfaceContact(ball,0,-1,ball.y-maxY,{restitution:MARBLE_COLLISION_SPEED_RETAIN},applyVelocity);
    }
  }

  function smooth01(v){
    const x=Math.max(0,Math.min(1,v));
    return x*x*(3-2*x);
  }

  function getGapFieldCell(){
    return gapFieldCell;
  }

  function countGapEntranceCongestion(gap){
    if(!gap)return 0;
    let congestion=0;
    for(const ball of balls){
      if(ball.respawnDelay>0)continue;
      if(ball.y<BOARD.multTop-GAP_FIELD_ENTRY_BAND_ABOVE||ball.y>BOARD.multTop+GAP_FIELD_ENTRY_BAND_BELOW)continue;
      if(ball.x<gap.x-ball.r-20||ball.x>gap.x+gap.w+ball.r+20)continue;
      congestion++;
    }
    return congestion;
  }

  function getGapUpwardAcceleration(ball){
    const rawDiameter=Number.isFinite(ball.r)?ball.r*2:GAP_FIELD_MAX_DIAMETER;
    const diameter=Math.max(GAP_FIELD_MIN_DIAMETER,Math.min(GAP_FIELD_MAX_DIAMETER,rawDiameter));
    const sizeProgress=(diameter-GAP_FIELD_MIN_DIAMETER)/Math.max(1,GAP_FIELD_MAX_DIAMETER-GAP_FIELD_MIN_DIAMETER);
    const inverseSize=Math.pow(1-sizeProgress,GAP_FIELD_SIZE_EXPONENT);
    return GAP_FIELD_LIFT_FLOOR+(GAP_FIELD_LIFT_CEILING-GAP_FIELD_LIFT_FLOOR)*inverseSize;
  }

  function applyGapUpdraft(ball,dt,gap=getGapFieldCell(),congestion=0){
    if(!gap)return 0;

    const upwardAccel=getGapUpwardAcceleration(ball);
    if(upwardAccel<=0)return 0;

    const gapRight=gap.x+gap.w;
    const gapCenterX=gap.x+gap.w*.5;
    const centerOverGap=ball.x>=gap.x&&ball.x<=gapRight;
    const belongsToGap=ball.zone==='multiplier'&&ball.multRegion==='gap';
    const gapCandidate=centerOverGap||belongsToGap;
    const nearEntrance=gapCandidate
      &&ball.y>=BOARD.multTop-GAP_FIELD_ENTRY_BAND_ABOVE
      &&ball.y<=BOARD.multTop+GAP_FIELD_ENTRY_BAND_BELOW;

    // 使用真实胶囊挡板半径与球半径定义安全通道，力场不再把球推向实体挡板。
    const safeLeft=gap.x+MULT_SEPARATOR_HALF_WIDTH+ball.r+GAP_FIELD_WALL_CLEARANCE;
    const safeRight=gapRight-MULT_SEPARATOR_HALF_WIDTH-ball.r-GAP_FIELD_WALL_CLEARANCE;
    const hasSafeCorridor=safeLeft<=safeRight;
    const safeTargetX=hasSafeCorridor
      ?Math.max(safeLeft,Math.min(safeRight,ball.x))
      :gapCenterX;
    const clearanceDelta=safeTargetX-ball.x;
    const rejectStrength=smooth01((upwardAccel-GAP_FIELD_GRAVITY_REFERENCE)/2200);
    if(nearEntrance){
      if(Math.abs(clearanceDelta)>1e-4){
        const clearanceRange=Math.max(1,MULT_SEPARATOR_HALF_WIDTH+ball.r+GAP_FIELD_WALL_CLEARANCE);
        const clearanceStrength=Math.max(0,Math.min(1,Math.abs(clearanceDelta)/clearanceRange));
        const centeringAccel=(GAP_FIELD_CENTERING_ACCEL+Math.max(0,congestion-2)*GAP_FIELD_CONGESTION_ACCEL)
          *(.40+.60*rejectStrength)*(.35+.65*clearanceStrength);
        ball.vx+=Math.sign(clearanceDelta)*centeringAccel*dt;
      }

      const verticallyStalled=Math.abs(ball.vy)<GAP_FIELD_STALL_SPEED_Y;
      if(verticallyStalled)ball.gapStallTime=(ball.gapStallTime||0)+dt;
      else ball.gapStallTime=Math.max(0,(ball.gapStallTime||0)-dt*.7);

      const stallLimit=congestion>=5?.58:1.05;
      if(ball.gapStallTime>stallLimit){
        if(Math.abs(clearanceDelta)>1e-4){
          ball.vx+=Math.sign(clearanceDelta)*(150+Math.min(8,congestion)*12);
        }else{
          ball.vx*=.72;
        }
        ball.vy=Math.min(ball.vy,-260);
        ball.gapStallTime=0;
      }
    }else{
      ball.gapStallTime=Math.max(0,(ball.gapStallTime||0)-dt*1.5);
    }

    const centerInsideX=gapCandidate&&hasSafeCorridor&&ball.x>=safeLeft&&ball.x<=safeRight;
    const fieldTop=BOARD.multTop-MULT_WALL_CAP_HEIGHT-ball.r;
    const centerInsideY=ball.y>=fieldTop&&ball.y-ball.r<=BOARD.multBottom;
    if(!centerInsideX||!centerInsideY)return 0;

    const span=Math.max(1,BOARD.multBottom-fieldTop);
    const yT=Math.max(0,Math.min(1,(ball.y-fieldTop)/span));
    const verticalFactor=.72+.28*Math.sin(Math.PI*yT);
    const effectiveAccel=upwardAccel*verticalFactor;
    ball.vy-=effectiveAccel*dt;
    return effectiveAccel;
  }

  function passBallToLowerRegion(ball){
    ball.zone='lower';
    ball.multRegion=null;
  }

  function resolveLowerReturnBarrier(ball,applyVelocity=true){
    // 单向挡板只约束已经处于 lower 状态的弹珠；向下穿越时不干预。
    const barrierTop=BOARD.multBottom+ball.r;
    if(ball.y<barrierTop&&ball.vy<0){
      solveBallSurfaceContact(ball,0,1,barrierTop-ball.y,{
        restitution:.12,
        friction:TUNING.collision.surfaceFriction
      },applyVelocity);
    }
  }

  function updateMultiplierRegion(ball){
    // 顶部没有墙，尚未落入下层的弹珠被撞回上方时重新进入上层分流区。
    if(ball.y+ball.r<BOARD.multTop&&ball.vy<0){
      ball.zone='upper';
      ball.multRegion=null;
      return;
    }

    // 碰撞已由统一接触求解器处理；这里只更新区域身份与结算状态。
    const cell=getMultCell(ball.x);
    ball.multRegion=cell.type==='gap'?'gap':cell.index;

    if(ball.multRegion==='gap'){
      // 中央空隙底部保持开放：能否进入下层完全由可见向上力场与球体尺寸决定。
      // 只在向下穿越时切换状态，穿越瞬间不改写坐标和速度。
      if(ball.y>=BOARD.multBottom-4&&ball.vy>=0)passBallToLowerRegion(ball);
      return;
    }

    if(!cell||cell.type==='gap'){
      enterMultiplierRegion(ball);
      return;
    }

    // 只有球体实际接触封闭底板时才结算倍率。
    if(ball.y+ball.r>=cell.bottom&&ball.vy>=0){
      ball.y=cell.bottom-ball.r;
      const newValue=ball.value*cell.mult;
      cell.hitCount=(cell.hitCount||0)+1;
      log(`${FACTIONS[ball.faction].name}的弹珠触碰 ${cell.type} 碰撞盒底板，数值提升为 ${formatNum(newValue)} 并随机回到顶部`,ball.faction);
      pulses.push({type:'mult',x:cell.x+cell.w/2,y:cell.bottom,r:0,max:54,color:FACTIONS[ball.faction].color,life:1});
      teleportToTop(ball,newValue);
    }
  }

  function enterConverterRegion(ball){
    const cell=getConverterForX(ball.x);
    if(!cell)return;
    ball.zone='convert';
    ball.convertRegion=cell.index;
  }

  function syncBallConverterCell(ball){
    const current=getConverterForX(ball.x);
    if(current)ball.convertRegion=current.index;
    return current;
  }

  function updateConverterRegion(ball){
    // 顶部开放，被撞回上方时重新回到下层分流区。
    if(ball.y+ball.r<BOARD.convertTop&&ball.vy<0){
      ball.zone='lower';
      ball.convertRegion=null;
      return;
    }

    const cell=syncBallConverterCell(ball);
    if(!cell){
      enterConverterRegion(ball);
      return;
    }

    // 只有实际触碰火力转换盒底板时才兑现火力。
    if(ball.y+ball.r>=cell.bottom&&ball.vy>=0){
      ball.y=cell.bottom-ball.r;
      settleBall(ball,cell);
    }
  }

  function teleportToTop(ball,newValue){
    // 不设置玩法层面的火力上限；仅在超出 JavaScript 有限数值范围时停在引擎极限。
    ball.value=Number.isFinite(newValue)?newValue:Number.MAX_VALUE;
    resetBallToTop(ball,{keepValue:true,delay:.08,xOverride:randomSpawnX(),returnKick:true});
  }

  function settleBall(ball,cell){
    if(eliminated[ball.faction])return;
    recordSettledBallSize(ball);
    const amount=ball.value;
    cell.hitCount=(cell.hitCount||0)+1;
    stocks[ball.faction][cell.key]+=amount;
    cell.highlightFaction=ball.faction;
    cell.highlightStrength=1;
    const amountText=cell.key==='machine'?formatMachineFirepower(amount):formatNum(amount);
    log(`${FACTIONS[ball.faction].name}的 ${formatNum(ball.value)} 弹珠落入【${WEAPONS[cell.key].name}转换格】，兑现 ${amountText} 火力；原球复原回顶`,ball.faction);
    triggerWeapon(ball.faction,cell.key,amount);
    updateStocks();
    pulses.push({type:'convert',x:cell.x+cell.w/2,y:BOARD.convertTop+31,r:0,max:70,color:FACTIONS[ball.faction].color,life:1});
    resetBallToTop(ball,{keepValue:false,delay:.14,returnKick:true});
  }

  function resolveBallStaticContacts(ball,applyVelocity){
    resolveMatrixSideReboundWall(ball,applyVelocity);
    resolveMatrixTopBottomWalls(ball,applyVelocity);
    if(ball.zone==='upper'){
      for(const peg of upperPegs)solveBallCircleContact(ball,peg,applyVelocity);
    }else if(ball.zone==='lower'){
      for(const peg of lowerPegs)solveBallCircleContact(ball,peg,applyVelocity);
      resolveLowerReturnBarrier(ball,applyVelocity);
    }else if(ball.zone==='convert'){
      const cell=syncBallConverterCell(ball);
      if(cell&&cell.right-cell.left>=ball.r*2){
        bounceOnVerticalWall(ball,cell.left,true,applyVelocity);
        bounceOnVerticalWall(ball,cell.right,false,applyVelocity);
      }
    }
    resolveMultiplierPlateCollisions(ball,applyVelocity);
  }

  function stepBalls(dt){
    updatePegRotors(dt);
    const gap=getGapFieldCell();
    const gapCongestion=countGapEntranceCongestion(gap);

    // 第一阶段：半隐式积分。业务状态不参与冲量计算，避免不同区域使用不同手感。
    for(const b of balls){
      if(b.respawnDelay>0){b.respawnDelay-=dt;continue;}
      b.r=radiusFromValue(b.value);
      b.life+=dt;
      b.angularVelocity=(Number.isFinite(b.angularVelocity)?b.angularVelocity:0)*Math.exp(-TUNING.collision.spinDamping*dt);
      b.prevX=b.x;
      b.prevY=b.y;
      b.vy+=MATRIX_GRAVITY*dt;
      applyGapUpdraft(b,dt,gap,gapCongestion);
      applyMarbleAirDrag(b,dt);
      b.x+=b.vx*dt;
      b.y+=b.vy*dt;
      pushBallTrail(b,b.x,b.y);
    }

    // 第二阶段：统一求解所有静态/运动表面与弹珠接触。
    // 第一轮计算速度冲量，后续轮仅渐进修正位置，避免同一接触重复获得能量。
    for(let iteration=0;iteration<TUNING.collision.solverIterations;iteration++){
      const applyVelocity=iteration===0;
      for(const b of balls){
        if(b.respawnDelay<=0)resolveBallStaticContacts(b,applyVelocity);
      }
      resolveBallCollisions(applyVelocity);
    }
    for(const b of balls){
      if(b.respawnDelay<=0)applyMultiplierEntryUnjam(b,dt);
    }

    // 第三阶段：倍率、空隙和火力转换状态结算；这一层不再直接改写碰撞速度。
    for(const b of balls){
      if(b.respawnDelay>0)continue;
      if(b.zone==='upper'){
        if(b.y+b.r>=BOARD.multTop)enterMultiplierRegion(b);
      }else if(b.zone==='multiplier'){
        updateMultiplierRegion(b);
      }else if(b.zone==='lower'){
        if(b.y+b.r>=BOARD.convertTop)enterConverterRegion(b);
      }else if(b.zone==='convert'){
        updateConverterRegion(b);
        continue;
      }
      if(b.life>18){const cell=getConverterForX(b.x);settleBall(b,cell);}
    }
  }

  function updateBalls(dt){
    let maxSpeed=0,maxAcceleration=MATRIX_GRAVITY;
    const gap=getGapFieldCell();
    for(const b of balls){
      if(b.respawnDelay>0)continue;
      maxSpeed=Math.max(maxSpeed,Math.hypot(b.vx,b.vy));
      const mayTouchGap=gap
        &&b.x+b.r>=gap.x&&b.x-b.r<=gap.x+gap.w
        &&b.y+b.r>=BOARD.multTop-GAP_FIELD_ENTRY_BAND_ABOVE
        &&b.y-b.r<=BOARD.multBottom;
      if(mayTouchGap){
        maxAcceleration=Math.max(maxAcceleration,MATRIX_GRAVITY+getGapUpwardAcceleration(b));
      }
    }
    const predictedTravel=maxSpeed*dt+maxAcceleration*dt*dt;
    const substeps=Math.max(1,Math.min(
      TUNING.collision.maxSubsteps,
      Math.ceil(predictedTravel/TUNING.collision.maxTravelPerStep)
    ));
    const subDt=dt/substeps;
    for(let i=0;i<substeps;i++)stepBalls(subDt);
  }

  const BASE_POSITIONS=FACTIONS.map(faction=>Object.freeze({x:faction.base[0]*WV.w,y:faction.base[1]*WV.h}));
  function getBasePos(faction){return BASE_POSITIONS[faction];}

  function getCannonMuzzle(faction,angle=cannonAngle[faction]){
    const base=getBasePos(faction);
    const offset=BASE_RING_RADIUS+12;
    return {
      x:base.x+Math.cos(angle)*offset,
      y:base.y+Math.sin(angle)*offset
    };
  }

  function normalizeAngle(angle){
    angle%=TAU;
    return angle<0 ? angle+TAU : angle;
  }

  // 组合两个低频正弦波和少量随机扰动，使相邻机枪弹丸保持相关性，
  // 避免完全独立随机造成的机械抖动，同时形成自然的速度与角度漂移。
  function machineNaturalNoise(index,seed){
    const smoothA=Math.sin(index*.024+seed*1.71)*.62;
    const smoothB=Math.sin(index*.0067+seed*2.37)*.28;
    const micro=(Math.random()-.5)*.10;
    return Math.max(-1,Math.min(1,smoothA+smoothB+micro));
  }

  function targetFactionBase(faction){
    const x=Math.round(FACTIONS[faction].base[0]*GRID_W),y=Math.round(FACTIONS[faction].base[1]*GRID_H);
    return [(x+.5)/GRID_W,(y+.5)/GRID_H];
  }

  function targetFor(f){
    let weakTarget=-1,weakRatio=Infinity,weakTerritory=-1,weakOrder=Infinity;
    let mainTarget=-1,mainTerritory=-1,mainRatio=Infinity,mainOrder=Infinity;
    for(let enemy=0;enemy<FACTIONS.length;enemy++){
      if(enemy===f||eliminated[enemy])continue;
      const ratio=shieldValue[enemy]/Math.max(1,INITIAL_SHIELD_VALUE);
      const territory=territoryCounts[enemy];
      const order=(enemy-f+FACTIONS.length)%FACTIONS.length;

      // 不再扫描随机地图候选点：直接按势力状态确定目标基地。
      if(territory>mainTerritory||
        (territory===mainTerritory&&ratio<mainRatio)||
        (territory===mainTerritory&&ratio===mainRatio&&order<mainOrder)){
        mainTarget=enemy;
        mainTerritory=territory;
        mainRatio=ratio;
        mainOrder=order;
      }

      if(ratio<=TUNING.targeting.weakShieldRatio&&
        (ratio<weakRatio||
          (ratio===weakRatio&&territory>weakTerritory)||
          (ratio===weakRatio&&territory===weakTerritory&&order<weakOrder))){
        weakTarget=enemy;
        weakRatio=ratio;
        weakTerritory=territory;
        weakOrder=order;
      }
    }
    const target=weakTarget>=0?weakTarget:mainTarget;
    return target>=0?targetFactionBase(target):[.5,.5];
  }

  function getSniperTargetCandidates(faction){
    const candidates=[];
    for(let enemy=0;enemy<FACTIONS.length;enemy++){
      if(enemy!==faction&&!eliminated[enemy])candidates.push(enemy);
    }
    return candidates;
  }

  function pickSniperTarget(job){
    const candidates=getSniperTargetCandidates(job.faction);
    if(candidates.length===0)return -1;
    const fresh=candidates.filter(faction=>faction!==job.currentTargetFaction);
    const pool=fresh.length>0?fresh:candidates;
    return pool[Math.floor(Math.random()*pool.length)];
  }

  function queueSniperTargeting(faction,totalFirepower){
    const firepower=Math.max(0,Math.floor(totalFirepower));
    if(firepower<=0||eliminated[faction])return;
    const job={
      id:nextSniperAimId++,faction,firepower,
      elapsed:0,duration:SNIPER_AIM_MIN_SECONDS+Math.random()*(SNIPER_AIM_MAX_SECONDS-SNIPER_AIM_MIN_SECONDS),
      nextPickAt:0,currentTargetFaction:-1,selectedTargetFaction:-1,
      phase:'selecting',lockElapsed:0,pickCount:0
    };
    job.currentTargetFaction=pickSniperTarget(job);
    if(job.currentTargetFaction<0)return;
    sniperAimJobs.push(job);
    log(`${FACTIONS[faction].name}狙击开始随机扫描目标，预计 ${job.duration.toFixed(1)} 秒完成锁定`,faction);
  }

  function updateSniperAimJobs(dt){
    for(let i=sniperAimJobs.length-1;i>=0;i--){
      const job=sniperAimJobs[i];
      if(eliminated[job.faction]||job.firepower<=0){sniperAimJobs.splice(i,1);continue;}
      const candidates=getSniperTargetCandidates(job.faction);
      if(candidates.length===0){sniperAimJobs.splice(i,1);continue;}
      if(job.phase==='selecting'){
        job.elapsed=Math.min(job.duration,job.elapsed+dt);
        const progress=Math.min(1,job.elapsed/job.duration),slowdown=smooth01(progress);
        while(job.elapsed>=job.nextPickAt&&job.elapsed<job.duration-1e-9){
          const next=pickSniperTarget(job);
          if(next<0)break;
          job.currentTargetFaction=next;job.pickCount++;
          const interval=SNIPER_PICK_INTERVAL_FAST+(SNIPER_PICK_INTERVAL_SLOW-SNIPER_PICK_INTERVAL_FAST)*slowdown;
          job.nextPickAt=job.elapsed+interval;
        }
        if(job.elapsed>=job.duration-1e-9){
          if(!candidates.includes(job.currentTargetFaction))job.currentTargetFaction=pickSniperTarget(job);
          job.selectedTargetFaction=job.currentTargetFaction;job.phase='locked';job.lockElapsed=0;
          log(`${FACTIONS[job.faction].name}狙击已锁定${FACTIONS[job.selectedTargetFaction].name}，1 秒后发射`,job.faction);
        }
      }else{
        job.lockElapsed+=dt;
        if(job.lockElapsed<SNIPER_LOCK_DELAY_SECONDS)continue;
        if(!candidates.includes(job.selectedTargetFaction))job.selectedTargetFaction=pickSniperTarget(job);
        if(job.selectedTargetFaction<0){sniperAimJobs.splice(i,1);continue;}
        const start=FACTIONS[job.faction].base,target=FACTIONS[job.selectedTargetFaction].base;
        queueProjectile(0,{kind:'sniper',faction:job.faction,start,target,firepower:job.firepower});
        log(`${FACTIONS[job.faction].name}狙击弹已发射，目标：${FACTIONS[job.selectedTargetFaction].name}`,job.faction);
        sniperAimJobs.splice(i,1);
      }
    }
  }

  function queueProjectile(time,data){if(!eliminated[data.faction])fireQueue.push({time,data});}
  function shieldRadiusPx(value){
    if(value<=0)return 0;
    if(value<=INITIAL_SHIELD_VALUE){
      const normalized=Math.log10(value+1)/Math.log10(INITIAL_SHIELD_VALUE+1);
      return SHIELD_MIN_RADIUS+(SHIELD_INITIAL_RADIUS-SHIELD_MIN_RADIUS)*normalized;
    }
    return SHIELD_INITIAL_RADIUS+Math.log10(value/INITIAL_SHIELD_VALUE)*SHIELD_GROWTH_PER_DECADE;
  }
  const shieldRadiusCacheValue=Array(FACTIONS.length).fill(NaN);
  const shieldRadiusCache=Array(FACTIONS.length).fill(0);
  function shieldRadiusForFaction(faction){
    const value=shieldValue[faction];
    if(shieldRadiusCacheValue[faction]!==value){
      shieldRadiusCacheValue[faction]=value;
      shieldRadiusCache[faction]=shieldRadiusPx(value);
    }
    return shieldRadiusCache[faction];
  }

  function firepowerToVisualPower(firepower){
    return Math.log2(Math.max(0,firepower)/2+1);
  }

  // 大球直径按当前剩余火力采用饱和型幂函数。
  // v136：约为 1K -> 34.9px、1M -> 146.2px、100M -> 262.5px；火力无限增大时趋近 400px。
  const ORB_MIN_DIAMETER=5;
  const ORB_MAX_DIAMETER=400;
  const ORB_SIZE_COEFFICIENT=63;
  const ORB_SIZE_EXPONENT=.26;
  // v39 大球独立物理参数：120Hz 下使用连续圆检测与接触迟滞，避免重复结算和边缘黏连。
  const ORB_CONTACT_PADDING=1.25;
  const ORB_CONTACT_RELEASE_GAP=5;
  const ORB_SHIELD_RELEASE_GAP=6;
  const ORB_PAIR_RESTITUTION=1;
  const ORB_SHIELD_RESTITUTION=1;
  const ORB_MIN_SEPARATION_SPEED=22;
  function orbDiameterFromFirepower(firepower){
    const value=Math.max(1,Number(firepower)||0);
    const diameter=ORB_MAX_DIAMETER/(1+ORB_SIZE_COEFFICIENT*Math.pow(value,-ORB_SIZE_EXPONENT));
    return Math.max(ORB_MIN_DIAMETER,Math.min(ORB_MAX_DIAMETER,diameter));
  }

  function syncProjectileFirepower(p,firepower){
    p.firepower=Math.max(0,Math.floor(firepower));
    p.power=firepowerToVisualPower(p.firepower);
    if(p.kind==='orb')p.r=orbDiameterFromFirepower(p.firepower)*.5;
    return p.firepower;
  }

  function shieldHitDamage(kind,firepower){
    // v26：护盾值与攻击火力严格按 1:1 抵消，不再使用武器伤害倍率。
    return Math.max(0,Math.floor(firepower));
  }

  function distributeIntegerFirepower(total,count){
    const units=Math.max(0,Math.floor(total));
    const n=Math.max(1,Math.min(units||1,count));
    const base=Math.floor(units/n),extra=units%n;
    return Array.from({length:n},(_,i)=>base+(i<extra?1:0));
  }

  function triggerWeapon(faction,weapon,amount){
    if(eliminated[faction])return;
    const totalFirepower=Math.max(0,Math.floor(amount));
    if(totalFirepower<=0)return;
    const totalVisualPower=firepowerToVisualPower(totalFirepower);
    if(weapon==='shield'){
      shieldValue[faction]+=totalFirepower;
      if(gpuBattleActive&&gpuBattle?.ready)gpuBattle.queueShieldAdd(faction,totalFirepower);
      shieldFlash[faction]=1;
      shieldGainFlash[faction]=1;
      log(`${FACTIONS[faction].name}结算护盾火力 ${formatNum(totalFirepower)}，等额叠加后为 ${formatNum(shieldValue[faction])}`,faction);
      return;
    }
    const angle=cannonAngle[faction];

    if(weapon==='machine'){
      machineFirepowerPool[faction]+=totalFirepower;
      machineGainFlash[faction]=1;
